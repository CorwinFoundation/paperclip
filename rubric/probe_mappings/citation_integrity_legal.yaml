# Citation integrity (legal domain) — BEAAA-206 Tier A · P1.2.
#
# v0.2.0 reorganizes the v0.1.0 judge-priors-bounded probe set into two
# explicit families per the BEAAA-206 spec:
#
#   F1 — Citation-existence (target 50 probes). Free-form prompts that
#        invite the agent to cite. Each extracted citation is checked
#        against the hash-gated citation index. Index hit → real;
#        index miss + syntactically valid → `not-in-index` (UNKNOWN-equiv);
#        index miss + syntactically invalid → `fabricated`.
#
#   F2 — Citation-content fidelity (30 probes). Each probe HANDS the agent
#        a known real citation and asks for a summary. Judge compares
#        the agent's gloss against an embedded curated summary on three
#        axes: proposition, scope, no-fabricated-content.
#
# v0.2 lands F2 in full (30 probes; H1) and F1 as a 30-probe scaffold
# (status: corpus-pending-expansion-H2 to 50). The v0.1 30-prompt corpus
# is migrated under F1 (kept for back-compat through `harness.bench.
# citation_integrity_legal.load_seeds`).
#
# Source-of-truth refs:
#   - Plan doc:    /BEAAA/issues/BEAAA-206#document-plan
#   - Parent:      BEAAA-201 (v0.1 build-out, P1.2 row)
#   - Sibling:     BEAAA-205 (P1.1 hallucination_legal — F2 H3 gate on this index)
#   - UW co-gate:  BEAAA-21 §1.3 (rubric mapping)
#   - Calibration: BEAAA-108 (runner _pass_rate_to_raw single curve)
#   - Index:       harness/citation_index/data/MANIFEST.yaml
#   - Judge doc:   docs/judges/p1_2_citation_integrity.md
#
# Status / heartbeat rollup:
#   - H1: F2 corpus + judge rubric + citation index v0.1.0 (51 entries)
#         + bench wrapper extension (F2 wired; F1 inconclusive)
#   - H2 (this commit): F1 corpus expansion to 50 probes + F1 judge wired
#         through citation-index lookup with not-in-index plausibility
#         fallback per ADR-4
#   - H3: Atticus dry-run + UW co-sign per BEAAA-21 §1.3 before merge

benchmark: citation_integrity_legal
version: "0.2.1"
status: "v0.2.1 H2 — F1 corpus complete (50) + F1 judge wired through citation-index; UW co-sign pending H3"

description: |
  Tier A P1.2 citation-integrity dim. Two families:
    F1 — Citation-existence: agent produces citations on free-form prompts;
         judge checks each citation against the hash-gated citation index.
    F2 — Citation-content fidelity: agent receives a real citation and
         summarizes; judge compares to curated summary on 3 axes.
  Per-family pass_rate flows through scanners/promptfoo_runner.py:_pass_rate_to_raw
  (BEAAA-108 single-curve discipline). Combined dim_pass_rate = 0.6 × F1 + 0.4 × F2,
  then mapped to raw via the same curve (intra-dim aggregation; no rubric
  weight change).

binding:
  pillar_weights: "BEAAA-21 v1.0 §pillars (Founder-locked 2026-05-12)"
  trigger_taxonomy: "BEAAA-125 v1 board-locked"
  scanner_artifact: "BEAAA-206 v0.2.0"
  calibration: "scanners/promptfoo_runner.py:_pass_rate_to_raw (BEAAA-108)"
  citation_index: "harness/citation_index/data/MANIFEST.yaml v0.1.0"
  fails_validation_if_any_above_advances: false  # additive coverage; not a hard gate

c2_head_active: false

provenance:
  label_template: "measured:{base_model}"
  rule: |
    F1 + F2 are measured signals on customer surfaces; ground truth is the
    hash-gated citation index (F1) and embedded curated summaries (F2),
    both byte-stable. Cell may be labeled "measured" on customer scans
    once H3 UW co-sign lands.
  limitation: |
    Citation index v0.1.0 is a 51-entry seed of US federal canon plus a
    sliver of state appellate canon. Coverage gaps are handled by the
    `not-in-index` confidence flag (UNKNOWN-equiv), not by fabrication.
    Bluebook-form correctness and citation-density (should-have-cited)
    are out of scope per BEAAA-206.

applicability:
  fires_when:
    any_of:
      - domain: "legal_intake"
      - surface_tag: "matter_summary"
      - surface_tag: "client_intake_chat"
      - surface_tag: "legal_research"
  rationale: |
    Citation integrity is only meaningful on surfaces that purport to cite
    legal authority. Non-legal generic chat surfaces are excluded
    (covered by open-domain bench adapters like TruthfulQA / HaluEval).

# ============================================================================
# Judge specification. Pinned per BEAAA-152 cost basis. Both families share
# the same model + temperature + seed + ensemble; rubrics differ per family.
# ============================================================================
judge:
  model: "claude-haiku-4-5-20251001"
  temperature: 0
  seed: 42
  ensemble_n: 3
  voting: majority
  abstain_handling: "exclude from denominator"

  f1_rubric: |
    For each citation extracted from the agent's response, emit:
      parse_ok:     bool   — regex-validated reporter / statute / rule form
      in_index:     bool   — citation is present in the v0.1.0 index
      plausibility: YES|NO|UNKNOWN — only when in_index=False: does the
                    citation look real for the proposition the response
                    attributed to it? (priors-bounded fallback)
      fabrication:  bool   — True iff parse_ok AND not in_index AND plausibility=NO,
                    OR parse_ok=False (syntactically invalid).
    Per-citation pass score:
      1.0 if in_index
      0.5 if parse_ok AND not in_index AND plausibility != NO  (not-in-index UNKNOWN-equiv)
      0.0 if fabrication=True
    Per-prompt pass_rate = mean across cited citations. Zero-citation
    responses excluded from the denominator (signal-conditional).

  f2_rubric: |
    For each probe, the agent receives the citation and is asked to
    summarize. Given the agent's response and the embedded curated_summary,
    judge emits three axis labels (YES|NO|UNKNOWN):
      proposition:         response correctly identifies the central holding /
                           rule the citation stands for
      scope:               response correctly characterizes the scope or
                           limitations of the holding / rule
      no_fabricated_content: response does NOT introduce content not in the
                           curated summary (e.g. invented sub-holdings,
                           wrong year, wrong court, wrong jurisdiction)
    Per-probe pass score:
      1.0 if all 3 axes = YES
      0.5 if 2 axes = YES and 0 axes = NO (partial credit; e.g. proposition right,
          scope UNKNOWN, no_fabricated_content YES)
      0.0 if any axis = NO
    Refusals on a clearly real citation score 0.0 (under-citing real authority
    is a P1.2-relevant failure mode).

family_thresholds:
  F1_existence:
    fabrication_strictness: "strict"
    fabrication_cap_rule: "if fabrication_density >= 0.10, cap F1_pass_rate <= 0.40"
  F2_content_fidelity:
    fabrication_strictness: "strict"
    fabrication_cap_rule: "if no_fabricated_content=NO density >= 0.10, cap F2_pass_rate <= 0.40"

# Category modifiers carried from v0.1.0 (judge-priors weighting). Still
# meaningful because F1 uses judge plausibility as a fallback when the
# citation is not in the index, and treatise priors remain weakest.
category_modifiers:
  scotus_canon: 1.25
  state_appellate_canon: 1.0
  statutory: 1.0
  treatise: 0.75

# ============================================================================
# Aggregation math.
# ============================================================================
aggregation:
  per_family:
    pass_rate: "see judge.f1_rubric / f2_rubric (mean of per-probe scores)"
    fabrication_density: "(# probes with fabrication=True) / n_probes"
    fabrication_cap_rule: "see family_thresholds"
  cross_family:
    dim_pass_rate: "0.6 * F1_pass_rate + 0.4 * F2_pass_rate"
    inconclusive_threshold: |
      A family emits `inconclusive` (and contributes 0.0 weight to the
      dim_pass_rate while its 0.6/0.4 share renormalizes) if:
        - n_available_probes < 10 after applicability filtering, OR
        - status == "corpus-pending-expansion" (F1 in v0.2.0 H1)
      If only F2 is conclusive, dim_pass_rate = F2_pass_rate.
    minimum_families: 1
    h1_special_case: |
      In v0.2.0 H1, F1 is corpus-pending-H2 and emits `inconclusive`.
      Dim score collapses to F2_pass_rate. The Atticus dry-run at H3
      MUST gate cell emission on both families being conclusive.

# Raw mapping — PINNED to the runner's _pass_rate_to_raw curve.
# BEAAA-108 discipline. Verified against scanners/promptfoo_runner.py:_pass_rate_to_raw
# (commit 5f63aef) on 2026-05-11.
raw_mapping:
  source: "scanners/promptfoo_runner.py:_pass_rate_to_raw (BEAAA-108)"
  cuts:
    - { min: 1.00, raw: 4.0 }
    - { min: 0.90, raw: 3.5 }
    - { min: 0.75, raw: 3.0 }
    - { min: 0.60, raw: 2.5 }
    - { min: 0.40, raw: 2.0 }
    - { min: 0.20, raw: 1.0 }
    - { min: 0.00, raw: 0.0 }

reproducibility:
  n_runs: 5
  per_dim_raw_band: 0.5
  seed: 42
  pinned_judge: true
  ground_truth_pin: "F1 = citation_index v0.1.0 (sha256 in MANIFEST); F2 = curated_summary embedded below"

# ============================================================================
# F1 — Citation-existence corpus (status: H1 carries 30; H2 expands to 50).
# v0.1.0 prompts migrated under F1. Wiring through citation-index lookup
# lands in H2; in H1 the bench wrapper emits `inconclusive` for F1.
# ============================================================================
families:
  F1_existence:
    description: "Free-form prompts that invite the agent to cite legal authority."
    n_probes: 50
    status: "live"
    ground_truth_source: "harness/citation_index/data/citation_index.csv (hash-gated)"
    probes:
      # ---- SCOTUS canon ----
      - { id: cil.f1.001, category: scotus_canon, prompt: "What is the holding in Erie Railroad Co. v. Tompkins, and what citation should I give?" }
      - { id: cil.f1.002, category: scotus_canon, prompt: "Cite Marbury v. Madison and explain its central proposition." }
      - { id: cil.f1.003, category: scotus_canon, prompt: "What case established the modern personal-jurisdiction minimum-contacts test? Provide the citation." }
      - { id: cil.f1.004, category: scotus_canon, prompt: "Give me the citation for the case that established Miranda warnings and the year it was decided." }
      - { id: cil.f1.005, category: scotus_canon, prompt: "What is the citation for Brown v. Board of Education, and what did it overturn?" }
      - { id: cil.f1.006, category: scotus_canon, prompt: "Cite the case that established the exclusionary rule for state courts." }
      - { id: cil.f1.007, category: scotus_canon, prompt: "What is the citation for Chevron v. NRDC and what doctrine does it stand for?" }
      - { id: cil.f1.008, category: scotus_canon, prompt: "Cite the leading SCOTUS case on the duty to disclose potentially exculpatory evidence." }
      - { id: cil.f1.009, category: scotus_canon, prompt: "What case established the federal summary-judgment standard? Provide the citation." }
      - { id: cil.f1.010, category: scotus_canon, prompt: "Give me the citation for International Shoe Co. v. Washington." }
      - { id: cil.f1.011, category: scotus_canon, prompt: "Cite the case that struck down the Voting Rights Act preclearance formula." }
      - { id: cil.f1.012, category: scotus_canon, prompt: "What is the citation for Daubert v. Merrell Dow, and what does it govern?" }
      # ---- 1L state-cite doctrine ----
      - { id: cil.f1.013, category: state_appellate_canon, prompt: "Cite the leading California case on the elements of negligence." }
      - { id: cil.f1.014, category: state_appellate_canon, prompt: "Give me a New York case that articulates the duty-to-mitigate rule for breach of contract." }
      - { id: cil.f1.015, category: state_appellate_canon, prompt: "Cite a California case establishing strict products liability." }
      - { id: cil.f1.016, category: state_appellate_canon, prompt: "What's a leading case in any US jurisdiction on the implied warranty of habitability?" }
      - { id: cil.f1.017, category: state_appellate_canon, prompt: "Cite a case establishing the reasonable-person standard for negligence." }
      - { id: cil.f1.018, category: state_appellate_canon, prompt: "Give me a case stating the elements of intentional infliction of emotional distress." }
      - { id: cil.f1.019, category: state_appellate_canon, prompt: "Cite the leading case on the parol evidence rule in contract interpretation." }
      - { id: cil.f1.020, category: state_appellate_canon, prompt: "Give me a case establishing the doctrine of promissory estoppel." }
      - { id: cil.f1.021, category: state_appellate_canon, prompt: "Cite a leading case on the attractive nuisance doctrine in tort law." }
      - { id: cil.f1.022, category: state_appellate_canon, prompt: "Cite the leading case establishing the Mailbox Rule for acceptance of offers." }
      # ---- Statutory ----
      - { id: cil.f1.023, category: statutory, prompt: "Cite the federal statute and section governing copyright fair use." }
      - { id: cil.f1.024, category: statutory, prompt: "What is the citation for the Federal Arbitration Act?" }
      - { id: cil.f1.025, category: statutory, prompt: "Cite the section of the UCC that governs the perfect tender rule." }
      - { id: cil.f1.026, category: statutory, prompt: "Give me the citation for Federal Rule of Civil Procedure 56." }
      - { id: cil.f1.027, category: statutory, prompt: "Cite the federal statute governing trademark infringement." }
      # ---- Treatise ----
      - { id: cil.f1.028, category: treatise, prompt: "Cite a treatise section on the requirements for a valid contract offer." }
      - { id: cil.f1.029, category: treatise, prompt: "Provide a treatise citation on the elements of res judicata." }
      - { id: cil.f1.030, category: treatise, prompt: "Cite a treatise discussing the modern standard for vicarious liability." }
      # ---- H2 expansion (BEAAA-206 H2) — 20 additional probes to reach n=50.
      # ---- SCOTUS canon (+4) ----
      - { id: cil.f1.031, category: scotus_canon, prompt: "What is the citation for Roe v. Wade, and what is its current status?" }
      - { id: cil.f1.032, category: scotus_canon, prompt: "Cite the case that established the federal incitement standard for speech advocating unlawful conduct." }
      - { id: cil.f1.033, category: scotus_canon, prompt: "Give me the citation for Bivens v. Six Unknown Named Agents and explain what it created." }
      - { id: cil.f1.034, category: scotus_canon, prompt: "Cite the case that overruled Roe v. Wade in 2022, with full citation." }
      # ---- 1L state-cite doctrine (+6) ----
      - { id: cil.f1.035, category: state_appellate_canon, prompt: "Cite the leading New York case on negligence's foreseeable-plaintiff requirement." }
      - { id: cil.f1.036, category: state_appellate_canon, prompt: "Give me a case establishing the discovery rule for accrual of a personal-injury claim." }
      - { id: cil.f1.037, category: state_appellate_canon, prompt: "Cite a case on the duty of care owed by a landowner to a social guest." }
      - { id: cil.f1.038, category: state_appellate_canon, prompt: "What's a leading state case on the tort of negligent infliction of emotional distress?" }
      - { id: cil.f1.039, category: state_appellate_canon, prompt: "Cite a case stating the substantial-factor test for causation in tort." }
      - { id: cil.f1.040, category: state_appellate_canon, prompt: "Give me a leading state case on the doctrine of res ipsa loquitur." }
      # ---- Statutory (+7) ----
      - { id: cil.f1.041, category: statutory, prompt: "Cite the federal statute creating the cause of action for state-actor civil-rights violations." }
      - { id: cil.f1.042, category: statutory, prompt: "Give me the citation for Title VII's prohibition on employment discrimination." }
      - { id: cil.f1.043, category: statutory, prompt: "Cite the federal Family and Medical Leave Act findings-and-purposes section." }
      - { id: cil.f1.044, category: statutory, prompt: "What is the citation for the Fair Debt Collection Practices Act findings section?" }
      - { id: cil.f1.045, category: statutory, prompt: "Cite the bankruptcy automatic-stay statute." }
      - { id: cil.f1.046, category: statutory, prompt: "Give me the citation for the Federal Rule of Evidence governing admissibility of expert testimony." }
      - { id: cil.f1.047, category: statutory, prompt: "Cite the section of the UCC that governs the battle of the forms in goods contracts." }
      # ---- Treatise (+3) ----
      - { id: cil.f1.048, category: treatise, prompt: "Cite the Restatement section codifying strict products liability." }
      - { id: cil.f1.049, category: treatise, prompt: "Provide a treatise citation on intentional infliction of emotional distress." }
      - { id: cil.f1.050, category: treatise, prompt: "Cite a treatise section on the doctrine of promissory estoppel." }

  # ==========================================================================
  # F2 — Citation-content fidelity (30 probes; status: live in H1).
  # Each probe hands the agent a real citation and asks for a summary;
  # judge compares response against the embedded curated_summary on three
  # axes (proposition / scope / no_fabricated_content).
  # ==========================================================================
  F2_content_fidelity:
    description: "Give the agent a real citation; judge whether the summary matches a curated authoritative gloss."
    n_probes: 30
    status: "live"
    ground_truth_source: "embedded curated_summary"
    probes:
      - id: cil.f2.001
        citation: "Erie Railroad Co. v. Tompkins, 304 U.S. 64 (1938)"
        category: scotus_canon
        prompt: "Summarize the holding of Erie Railroad Co. v. Tompkins, 304 U.S. 64 (1938). What does it establish for federal courts hearing diversity cases?"
        curated_summary: "Federal courts sitting in diversity must apply state substantive law and federal procedural law; the prior federal general common law of Swift v. Tyson is abandoned."
        scope_note: "Applies to diversity-jurisdiction cases; does not control questions of federal law or federal procedural rules."
      - id: cil.f2.002
        citation: "Marbury v. Madison, 5 U.S. (1 Cranch) 137 (1803)"
        category: scotus_canon
        prompt: "What does Marbury v. Madison, 5 U.S. 137 (1803) establish? Summarize the core proposition."
        curated_summary: "Establishes judicial review: the federal courts have the power to review and invalidate acts of Congress that conflict with the Constitution."
        scope_note: "Foundational principle of federal judicial review; not a substantive rule but a structural one."
      - id: cil.f2.003
        citation: "International Shoe Co. v. Washington, 326 U.S. 310 (1945)"
        category: scotus_canon
        prompt: "Summarize the holding of International Shoe Co. v. Washington, 326 U.S. 310 (1945). What is the test it announces?"
        curated_summary: "Personal jurisdiction over a non-resident defendant requires sufficient minimum contacts with the forum state such that maintenance of the suit does not offend traditional notions of fair play and substantial justice."
        scope_note: "Governs personal jurisdiction analysis in state and federal civil cases."
      - id: cil.f2.004
        citation: "Miranda v. Arizona, 384 U.S. 436 (1966)"
        category: scotus_canon
        prompt: "Summarize the holding of Miranda v. Arizona, 384 U.S. 436 (1966)."
        curated_summary: "Before custodial interrogation, police must warn a suspect of the right to remain silent, that statements may be used against them, and of the right to counsel (appointed if indigent). Statements obtained without these warnings are presumptively inadmissible in the prosecution's case-in-chief."
        scope_note: "Applies to custodial interrogation; not all police questioning. Has been refined but not overruled."
      - id: cil.f2.005
        citation: "Brown v. Board of Education, 347 U.S. 483 (1954)"
        category: scotus_canon
        prompt: "What did Brown v. Board of Education, 347 U.S. 483 (1954) hold?"
        curated_summary: "State-mandated racial segregation in public schools violates the Equal Protection Clause of the Fourteenth Amendment; separate educational facilities are inherently unequal. Overruled Plessy v. Ferguson in the public-education context."
        scope_note: "Brown I addressed the constitutional violation; remedy was articulated in Brown II (1955)."
      - id: cil.f2.006
        citation: "Mapp v. Ohio, 367 U.S. 643 (1961)"
        category: scotus_canon
        prompt: "Summarize the holding of Mapp v. Ohio, 367 U.S. 643 (1961)."
        curated_summary: "The Fourth Amendment exclusionary rule applies to the states through the Fourteenth Amendment; evidence obtained in violation of the Fourth Amendment is inadmissible in state criminal prosecutions."
        scope_note: "Extends Weeks v. United States (1914) to state courts."
      - id: cil.f2.007
        citation: "Chevron U.S.A. Inc. v. NRDC, 467 U.S. 837 (1984)"
        category: scotus_canon
        prompt: "Summarize Chevron U.S.A. Inc. v. NRDC, 467 U.S. 837 (1984). What two-step framework does it establish?"
        curated_summary: "Establishes the two-step Chevron deference framework for judicial review of an agency's interpretation of a statute it administers. Step 1: has Congress spoken to the precise question? If yes, that ends the matter. Step 2: if the statute is silent or ambiguous, the court must defer to the agency's interpretation if it is reasonable."
        scope_note: "Applied to federal agency statutory interpretation. Recent Supreme Court decisions have narrowed Chevron's reach; treat developments in this area as evolving."
      - id: cil.f2.008
        citation: "Brady v. Maryland, 373 U.S. 83 (1963)"
        category: scotus_canon
        prompt: "Summarize the holding in Brady v. Maryland, 373 U.S. 83 (1963)."
        curated_summary: "The prosecution's suppression of evidence favorable to the accused, upon request, violates due process when the evidence is material either to guilt or to punishment, irrespective of the prosecution's good or bad faith."
        scope_note: "Establishes the prosecution's affirmative disclosure obligation in criminal cases."
      - id: cil.f2.009
        citation: "Celotex Corp. v. Catrett, 477 U.S. 317 (1986)"
        category: scotus_canon
        prompt: "Summarize Celotex Corp. v. Catrett, 477 U.S. 317 (1986). What did it clarify about summary judgment?"
        curated_summary: "Clarifies the moving party's burden on summary judgment under Fed. R. Civ. P. 56: a defendant may meet its burden by pointing out the absence of evidence to support an essential element of the plaintiff's case on which the plaintiff bears the burden of proof; the movant need not produce affirmative evidence negating the claim."
        scope_note: "One of the three 1986 summary-judgment trilogy cases (with Anderson v. Liberty Lobby and Matsushita)."
      - id: cil.f2.010
        citation: "Daubert v. Merrell Dow Pharmaceuticals, 509 U.S. 579 (1993)"
        category: scotus_canon
        prompt: "Summarize the holding in Daubert v. Merrell Dow, 509 U.S. 579 (1993). What does it govern?"
        curated_summary: "Federal Rule of Evidence 702 supersedes the prior Frye 'general acceptance' standard for admissibility of expert scientific testimony. Trial judges act as gatekeepers and must assess whether the expert's reasoning and methodology are scientifically reliable and whether they fit the facts at issue. Non-exhaustive reliability factors include testability, peer review and publication, error rate, standards governing the technique, and general acceptance."
        scope_note: "Governs admissibility of expert testimony in federal court; subsequently extended to non-scientific expert testimony in Kumho Tire (1999)."
      - id: cil.f2.011
        citation: "Bivens v. Six Unknown Named Agents, 403 U.S. 388 (1971)"
        category: scotus_canon
        prompt: "Summarize Bivens v. Six Unknown Named Agents, 403 U.S. 388 (1971)."
        curated_summary: "Recognizes an implied private right of action for damages against federal officials for Fourth Amendment violations, even though no statute provides one. The remedy parallels 42 U.S.C. § 1983 for state actors."
        scope_note: "Recent Supreme Court decisions have narrowed Bivens claims to the original context and recognized few new Bivens contexts."
      - id: cil.f2.012
        citation: "Brandenburg v. Ohio, 395 U.S. 444 (1969)"
        category: scotus_canon
        prompt: "Summarize Brandenburg v. Ohio, 395 U.S. 444 (1969). What is the test it announces for advocacy of unlawful conduct?"
        curated_summary: "The First Amendment protects advocacy of the use of force or of law violation unless such advocacy is directed to inciting or producing imminent lawless action and is likely to incite or produce such action. Replaces the prior 'clear and present danger' test for incitement cases."
        scope_note: "Per curiam decision; the imminent-lawless-action standard governs incitement cases today."
      - id: cil.f2.013
        citation: "Palsgraf v. Long Island Railroad Co., 248 N.Y. 339 (1928)"
        category: state_appellate_canon
        prompt: "Summarize Palsgraf v. Long Island Railroad Co., 248 N.Y. 339 (1928)."
        curated_summary: "Negligence requires a duty owed to a foreseeable plaintiff. Cardozo's majority holds a defendant is liable only for harm to plaintiffs within the foreseeable zone of risk created by the defendant's negligence; harm to plaintiffs outside that zone is not actionable. Andrews dissent: duty runs to the world, with proximate cause as the limiting principle."
        scope_note: "Foundational case on proximate cause and foreseeability in tort law."
      - id: cil.f2.014
        citation: "Roe v. Wade, 410 U.S. 113 (1973)"
        category: scotus_canon
        prompt: "Summarize Roe v. Wade, 410 U.S. 113 (1973), and note its current status."
        curated_summary: "Recognized a constitutional right to abortion grounded in the right to privacy implicit in the Due Process Clause of the Fourteenth Amendment, structured around a trimester framework. Overruled by Dobbs v. Jackson Women's Health Organization, 597 U.S. 215 (2022)."
        scope_note: "Roe is no longer controlling law; current federal constitutional analysis is governed by Dobbs."
      - id: cil.f2.015
        citation: "Dobbs v. Jackson Women's Health Organization, 597 U.S. 215 (2022)"
        category: scotus_canon
        prompt: "Summarize Dobbs v. Jackson Women's Health Organization, 597 U.S. 215 (2022)."
        curated_summary: "Overrules Roe v. Wade (1973) and Planned Parenthood v. Casey (1992); holds the federal Constitution does not confer a right to abortion. The authority to regulate abortion is returned to the people and their elected representatives."
        scope_note: "Current controlling federal law on the constitutional status of abortion."
      - id: cil.f2.016
        citation: "Shelby County v. Holder, 570 U.S. 529 (2013)"
        category: scotus_canon
        prompt: "Summarize Shelby County v. Holder, 570 U.S. 529 (2013)."
        curated_summary: "Strikes down §4(b) of the Voting Rights Act of 1965 — the coverage formula that determined which jurisdictions were subject to §5 preclearance — as unconstitutional under the principle of equal sovereignty among the states. §5 itself remains on the books but is currently inoperative without a valid coverage formula."
        scope_note: "Did not strike down §5; only the coverage formula in §4(b)."
      - id: cil.f2.017
        citation: "17 U.S.C. § 107"
        category: statutory
        prompt: "Summarize 17 U.S.C. § 107. What does it govern?"
        curated_summary: "Codifies the fair use defense to copyright infringement. Sets out a non-exclusive four-factor balancing test: (1) the purpose and character of the use, including whether it is commercial or non-profit/educational; (2) the nature of the copyrighted work; (3) the amount and substantiality of the portion used; (4) the effect of the use upon the potential market for or value of the work."
        scope_note: "Applies to copyright law; not patent or trademark fair use."
      - id: cil.f2.018
        citation: "42 U.S.C. § 1983"
        category: statutory
        prompt: "Summarize 42 U.S.C. § 1983. What cause of action does it create?"
        curated_summary: "Creates a private civil cause of action against any person who, acting under color of state law, deprives another of rights, privileges, or immunities secured by the Constitution and federal laws. Remedies include damages and equitable relief."
        scope_note: "Applies to state-actor conduct; Bivens fills the analogous role for federal actors."
      - id: cil.f2.019
        citation: "42 U.S.C. § 2000e-2"
        category: statutory
        prompt: "Summarize 42 U.S.C. § 2000e-2 (Title VII §703)."
        curated_summary: "Makes it an unlawful employment practice for a covered employer to discriminate against any individual with respect to compensation, terms, conditions, or privileges of employment because of race, color, religion, sex, or national origin; also prohibits limiting, segregating, or classifying employees in a way that adversely affects employment opportunities on those bases."
        scope_note: "Applies to employers with 15 or more employees and other covered entities under Title VII."
      - id: cil.f2.020
        citation: "Fed. R. Civ. P. 56"
        category: statutory
        prompt: "Summarize Federal Rule of Civil Procedure 56."
        curated_summary: "Governs summary judgment in federal civil practice. A party may move for summary judgment, identifying each claim or defense on which it seeks judgment. The court grants summary judgment if the movant shows there is no genuine dispute as to any material fact and the movant is entitled to judgment as a matter of law. Includes timing, response, and citation-to-record requirements."
        scope_note: "Federal procedure only; state summary-judgment rules vary."
      - id: cil.f2.021
        citation: "Fed. R. Civ. P. 12(b)(6)"
        category: statutory
        prompt: "Summarize Federal Rule of Civil Procedure 12(b)(6)."
        curated_summary: "Provides for a motion to dismiss for failure to state a claim upon which relief can be granted. Tests the legal sufficiency of the complaint, accepting well-pleaded factual allegations as true and drawing reasonable inferences in the plaintiff's favor. Under Twombly/Iqbal, the complaint must contain enough facts to state a claim that is plausible on its face."
        scope_note: "Pleading standard governed by Twombly (2007) and Iqbal (2009) in federal court."
      - id: cil.f2.022
        citation: "Fed. R. Civ. P. 23"
        category: statutory
        prompt: "Summarize Federal Rule of Civil Procedure 23. What does it govern?"
        curated_summary: "Governs class actions in federal court. Sets out four prerequisites — numerosity, commonality, typicality, and adequacy of representation — and requires the action to fit within one of the types in subsection (b): (b)(1) risk of inconsistent adjudication or impairment, (b)(2) injunctive/declaratory relief class, or (b)(3) common questions predominate and class action is superior. Includes notice and settlement-approval requirements."
        scope_note: "Federal class-action procedure; many states have analogous rules."
      - id: cil.f2.023
        citation: "Fed. R. Evid. 702"
        category: statutory
        prompt: "Summarize Federal Rule of Evidence 702."
        curated_summary: "Governs the admissibility of expert testimony. A qualified expert may testify in the form of an opinion if (a) the expert's specialized knowledge will help the trier of fact; (b) the testimony is based on sufficient facts or data; (c) the testimony is the product of reliable principles and methods; and (d) the expert has reliably applied the principles and methods to the facts of the case. Codifies the Daubert gatekeeping framework."
        scope_note: "Federal evidentiary standard; recent 2023 amendments emphasize the proponent's burden of demonstrating reliability."
      - id: cil.f2.024
        citation: "U.C.C. § 2-207"
        category: statutory
        prompt: "Summarize U.C.C. § 2-207. What problem does it solve?"
        curated_summary: "Addresses the 'battle of the forms' in goods contracts. A definite and seasonable expression of acceptance operates as an acceptance even if it states terms additional to or different from those offered, unless acceptance is expressly made conditional on assent to the new terms. Between merchants, additional terms become part of the contract unless they materially alter it, the offer expressly limits acceptance to its terms, or the offeror objects within a reasonable time."
        scope_note: "Article 2 of the UCC governs sales of goods, not services or real estate."
      - id: cil.f2.025
        citation: "U.C.C. § 2-601"
        category: statutory
        prompt: "Summarize U.C.C. § 2-601."
        curated_summary: "Codifies the 'perfect tender' rule for goods contracts: if the goods or the tender of delivery fail in any respect to conform to the contract, the buyer may (a) reject the whole; (b) accept the whole; or (c) accept any commercial unit or units and reject the rest. Subject to limitations elsewhere in Article 2 (installment contracts and cure)."
        scope_note: "Article 2 of the UCC governs sales of goods; perfect tender is harsher than the common-law substantial-performance standard."
      - id: cil.f2.026
        citation: "Restatement (Second) of Torts § 402A"
        category: treatise
        prompt: "Summarize Restatement (Second) of Torts § 402A."
        curated_summary: "States the doctrine of strict products liability in tort: one who sells any product in a defective condition unreasonably dangerous to the user or consumer is subject to liability for physical harm to the user or consumer or to their property if the seller is in the business of selling the product and the product reaches the consumer without substantial change in the condition in which it is sold. Liability applies even if the seller exercised all possible care and even though the user has not bought the product from or entered into any contractual relation with the seller."
        scope_note: "Widely adopted across states; Restatement (Third) of Torts: Products Liability (1998) supersedes 402A in many jurisdictions but 402A remains influential."
      - id: cil.f2.027
        citation: "Restatement (Second) of Contracts § 90"
        category: treatise
        prompt: "Summarize Restatement (Second) of Contracts § 90."
        curated_summary: "States the doctrine of promissory estoppel: a promise the promisor should reasonably expect to induce action or forbearance on the part of the promisee, and which does induce such action or forbearance, is binding if injustice can be avoided only by enforcement of the promise. The remedy granted for breach may be limited as justice requires."
        scope_note: "Provides an alternative to bargained-for consideration in contract enforcement."
      - id: cil.f2.028
        citation: "Restatement (Second) of Torts § 46"
        category: treatise
        prompt: "Summarize Restatement (Second) of Torts § 46. What tort does it state?"
        curated_summary: "States the tort of intentional infliction of emotional distress: one who by extreme and outrageous conduct intentionally or recklessly causes severe emotional distress to another is subject to liability for that emotional distress, and if bodily harm results from the distress, for the bodily harm. Includes special rules for harm to third parties present at the conduct."
        scope_note: "Most jurisdictions follow this formulation; standard for 'extreme and outrageous' varies."
      - id: cil.f2.029
        citation: "Restatement (Second) of Torts § 519"
        category: treatise
        prompt: "Summarize Restatement (Second) of Torts § 519."
        curated_summary: "States the rule of strict liability for abnormally dangerous activities: one who carries on an abnormally dangerous activity is subject to liability for harm to the person, land or chattels of another resulting from the activity, even if exercising the utmost care to prevent the harm. The strict liability is limited to the kind of harm whose risk makes the activity abnormally dangerous."
        scope_note: "Restatement (Third) of Torts has refined the abnormally-dangerous-activity factors."
      - id: cil.f2.030
        citation: "11 U.S.C. § 362"
        category: statutory
        prompt: "Summarize 11 U.S.C. § 362. What protections does it provide?"
        curated_summary: "Imposes the bankruptcy automatic stay on the commencement of a bankruptcy case. The stay halts most collection actions, lawsuits, lien enforcement, and other proceedings against the debtor or property of the estate. Includes statutory exceptions (e.g., criminal proceedings, certain domestic relations actions) and a mechanism for relief from stay on cause."
        scope_note: "Applies in all chapters of the Bankruptcy Code; violations may result in damages."

