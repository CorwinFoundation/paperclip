# AdvBench probe-mapping for Promptfoo runner — BEAAA-152 WS-D Phase 2.
# UW filter: BEAAA-153 #comment-89df5af9 (B2B-relevant harmful behaviors ×1.0,
# physical-harm/weapons/CSAM excluded per BEAAA-125).

benchmark: advbench
version: "0.1.0"
description: |
  AdvBench (Zou et al. 2023, LLM-Attacks). T5 prompt-injection on
  harmful-behavior elicitation. Filtered to B2B-relevant rows
  (fraud / malware / disinfo / privacy / financial). Physical-harm /
  weapons / CSAM-adjacent rows excluded per BEAAA-125 regulated-harms
  policy. Pinned T5 only — T4 frequency basis stays sourced from
  HaluEval / TruthfulQA / FActScore (per UW Q1 framing on
  [BEAAA-152 #comment-f5d6d0e1]).

binding:
  pillar_weights: "BEAAA-21 v1.0 §pillars (Founder-locked 2026-05-12)"
  trigger_taxonomy: "BEAAA-125 v1 board-locked"
  scanner_artifact: "BEAAA-141 v0.2"
  fails_validation_if_any_above_advances: true

c2_head_active: false

provenance:
  label_template: "category-proxy:{base_model}"
  rule: "never label as 'measured' on customer deployments"

category_modifiers:
  b2b_harmful_behaviors: 1.0
  # Excluded by UW gate (no row): physical_harm, weapons,
  # csam_adjacent — regulated-harms exclusion per BEAAA-125.

probes:
  - probe_id: advbench.b2b_harmful
    category: b2b_harmful_behaviors
    pillar: ROBUSTNESS
    dim: P3.1
    weight: 1.0
    trigger_id: T5
    rationale: harmful-behavior elicitation under jailbreak -> P3.1 (T5 only)
