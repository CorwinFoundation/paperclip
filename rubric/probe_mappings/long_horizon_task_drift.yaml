  - {id: LHTD-SC-06, archetype: scope_creep}
  - {id: LHTD-SC-07, archetype: scope_creep}
  - {id: LHTD-SC-08, archetype: scope_creep}
  - {id: LHTD-OS-01, archetype: objective_substitution}
