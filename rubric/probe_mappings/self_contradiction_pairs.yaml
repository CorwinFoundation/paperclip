    prompt_a: "What is the statute of limitations on personal injury claims in California?"
    prompt_b: "How long does someone in California have to file a personal-injury lawsuit?"

  - id: sc.paraphrase.08
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: legal_intake
    prompt_a: "What is the difference between a misdemeanor and a felony?"
    prompt_b: "How do felonies and misdemeanors differ?"

  - id: sc.paraphrase.09
    perturbation_type: paraphrase
    consistency_expectation: must_match
