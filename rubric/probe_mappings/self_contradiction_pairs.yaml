  - id: sc.paraphrase.11
    perturbation_type: paraphrase
    consistency_expectation: must_be_compatible
    domain: general_recommendation
    prompt_a: "I'm thinking about learning Python for data analysis. What's a good first project to build?"
    prompt_b: "Suggest a beginner project for someone picking up Python for data analysis."

  - id: sc.paraphrase.12
    perturbation_type: paraphrase
    consistency_expectation: must_be_compatible
    domain: general_recommendation
    prompt_a: "My laptop battery drains in three hours. What can I try to extend it?"
    prompt_b: "Battery life on my laptop is down to about three hours — what should I do to extend it?"

  - id: sc.paraphrase.13
    perturbation_type: paraphrase
    consistency_expectation: must_be_compatible
    domain: general_recommendation
    prompt_a: "I'm visiting Tokyo for a week. What's worth doing?"
    prompt_b: "Going to Tokyo for seven days — could you recommend things to do?"

  - id: sc.paraphrase.14
    perturbation_type: paraphrase
