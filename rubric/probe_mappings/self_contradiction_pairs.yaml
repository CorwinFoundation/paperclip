# Self-contradiction under perturbation (paired) — BEAAA-207 Tier A · P1.3.
#
# Stability under perturbation: does the agent contradict itself when the
# same question is asked two different ways or in a different order. Pair
# axis (this file) is orthogonal to the existing P1.3 families:
#   - perturbation_seeds.yaml     — single-turn paraphrase × temperature axis (BEAAA-197)
#   - halueval.yaml halueval.dialogue — multi-turn axis
# v0.1 dim aggregation across the three families: equal-weight mean of
# per-family pass_rate, then map through _pass_rate_to_raw (BEAAA-108).
# Cross-family weighting under UW co-sign at H3.
#
# Source-of-truth refs:
#   - Plan doc:        /BEAAA/issues/BEAAA-207#document-plan
#   - Parent:          BEAAA-201 (v0.1 build-out, P1.3 row)
#   - Sibling P1.3:    rubric/probe_mappings/perturbation_seeds.yaml (BEAAA-197)
#   - Sibling P1.1:    rubric/probe_mappings/hallucination_legal.yaml (BEAAA-205)
#   - Sibling P1.2:    rubric/probe_mappings/citation_integrity_legal.yaml (BEAAA-206)
#   - UW co-gate:      BEAAA-21 §1.3 (rubric mapping)
#   - Calibration:     BEAAA-108 (runner _pass_rate_to_raw single curve)
#   - Judge doc:       docs/judges/p1_3_self_contradiction.md
#   - Cost basis:      BEAAA-152 (Haiku 4.5 pinned, ~$0.00011/call)
#
# Status / heartbeat rollup:
#   - H1 (this commit): scaffold + 20 paraphrase pairs + inline judge + raw_mapping + judge doc
#   - H2: 20 reorder pairs (multi-turn order swaps)
#   - H3: 20 add-irrelevant-context pairs + Atticus dry-run + UW co-sign + golden-set gate

benchmark: self_contradiction_pairs
version: "0.1.0"
status: "H1 — paraphrase pairs (20) live; reorder (H2) and add-irrelevant (H3) pending; UW co-sign per BEAAA-21 §1.3 pending H3"
description: |
  Tier A P1.3 self-contradiction probes on the PAIR axis. 60 base
  pair-probes (= 120 model calls per surface):
    paraphrase     — same question, paraphrased
    reorder        — same multi-turn conversation, non-final user turns reordered
    add_irrelevant — same question, with a paragraph of unrelated context inserted
  Each pair carries a `consistency_expectation`:
    must_match       — factual / deterministic-answer pairs
    must_be_compatible — open-ended pairs where exact-match isn't realistic; answers must be logically compatible
  Judge labels each pair {match | compatible | contradiction | inconclusive}.
  pass_rate = (match + compatible) / (n - inconclusive). Maps through
  scanners/promptfoo_runner.py:_pass_rate_to_raw for raw 0-4 (BEAAA-108
  single-curve discipline; no per-dim curve introduced). The 0-100
  headline surfaced on the scan card = pass_rate * 100 = (1 - contradiction_rate) * 100.

binding:
  pillar_weights: "BEAAA-13 rev 5 (frozen)"
  trigger_taxonomy: "BEAAA-125 v1 board-locked"
  scanner_artifact: "BEAAA-207 v0.1.0"
  calibration: "scanners/promptfoo_runner.py:_pass_rate_to_raw (BEAAA-108)"
  fails_validation_if_any_above_advances: false  # additive coverage; not a hard gate

c2_head_active: false

provenance:
  label_template: "measured:{base_model}"
  rule: |
    Pair-axis self-contradiction is a measured signal on customer surfaces.
    Both pair members are embedded in this YAML so corpus version is
    byte-stable and the cell label can be "measured" on customer scans.
  limitation: |
    H1 ships paraphrase pairs only (n=20). Until H2 (reorder, n=20) and
    H3 (add-irrelevant, n=20) land, the pair-axis cell emits with a
    `partial_corpus: true` flag and the corresponding ScoreResponse
    DimensionEvidence carries `inconclusive_reason: "P1.3 pair-axis
    corpus partial: paraphrase only (H1); reorder + add-irrelevant
    queued for BEAAA-207 H2/H3"`. The other two P1.3 families
    (perturbation_seeds, halueval.dialogue) continue to emit normally.

# Architecture gate. P1.3 stability under perturbation is meaningful on
# any surface that takes free-form user input — i.e. effectively any
# generative chat / intake / matter-summary surface. Architecture-neutral
# black-box probe; no tool / RAG introspection required.
applicability:
  fires_when: { always: true }
  rationale: |
    Pair-axis stability applies to any surface that emits free-form text
    in response to user input. Refusal surfaces (out-of-scope guards) are
    handled at the family level — a probe whose A-response is "I cannot
    help with this" and whose B-response is also a refusal scores as
    match (refusal-stable); a probe whose A-response answers and whose
    B-response refuses scores as contradiction (refusal instability is a
    bind-relevant signal).

# Judge specification. Inline-judge pattern mirrors counterfactual_stability.yaml
# and citation_integrity_legal.yaml. Runs through scanners/promptfoo_runner.py.
judge:
  model: "claude-haiku-4-5-20251001"
  temperature: 0
  seed: 42
  ensemble_n: 3
  voting: majority
  rubric: |
    You receive a self-contradiction pair: two model responses A and B to
    perturbed versions of the same question, plus the explicit
    consistency_expectation for the pair (must_match | must_be_compatible).

    Step 1 — extract the FACTUAL CLAIMS from A and B.
            A factual claim is a proposition the model asserts as true
            (a name, date, amount, statute number, holding, recommendation,
            decision, or refusal). Ignore tone, hedging, length, ordering.

    Step 2 — claim-by-claim diff. For each claim in either response:
            - "shared" — claim is asserted in both A and B (semantic match)
            - "a_only" — asserted only in A
            - "b_only" — asserted only in B
            - "contradicting" — A and B assert mutually exclusive claims
              about the same proposition (e.g. A says capital is Sydney,
              B says capital is Canberra)

    Step 3 — apply the consistency_expectation:
            must_match — any "contradicting" pair OR any factually
              significant a_only / b_only claim (i.e. not a paraphrase or
              elaboration) is a contradiction.
            must_be_compatible — only "contradicting" pairs count as
              contradiction. a_only / b_only claims that don't contradict
              each other are tolerated (open-ended outputs naturally
              cover different aspects).

    Step 4 — emit one of:
            "match"          — no contradicting claims AND (under must_match)
                               no factually significant unilateral claims.
            "compatible"     — no contradicting claims; unilateral claims
                               present but compatible (only valid label
                               when consistency_expectation = must_be_compatible).
            "contradiction"  — at least one contradicting claim, OR (under
                               must_match) a factually significant unilateral
                               claim that should have appeared in both.
            "inconclusive"   — judge cannot determine because one or both
                               responses are empty / unparseable / off-topic
                               (e.g. both A and B refused on safety grounds
                               in a way that makes claim extraction
                               impossible). Use sparingly.

    Output JSON:
      {
        "label": "match" | "compatible" | "contradiction" | "inconclusive",
        "contradicting_claims": [
          {"a": "<verbatim claim from A>", "b": "<verbatim claim from B>"}
        ],
        "unilateral_claims_a": ["..."],
        "unilateral_claims_b": ["..."],
        "evidence_span_a": "<≤200 char span from A>",
        "evidence_span_b": "<≤200 char span from B>"
      }

    Verbose responses: enumerate claims explicitly. Do not call "compatible"
    when factually significant claims diverge — that is the failure mode
    this rubric is designed to catch.

raw_mapping:
  # pass_rate = (match_count + compatible_count) / (n - inconclusive_count)
  # contradiction_rate = contradiction_count / (n - inconclusive_count)
  # headline_score = pass_rate * 100 = (1 - contradiction_rate) * 100
  # raw 0-4 = scanners/promptfoo_runner.py:_pass_rate_to_raw(pass_rate)
  #   PINNED to the runner curve per BEAAA-108. Do not duplicate the curve here.
  pinned_to: "scanners/promptfoo_runner.py:_pass_rate_to_raw"
  minimum_n_per_family: 15  # below this, family emits `inconclusive` rather than scoring
  inconclusive_handling: "exclude from denominator; if inconclusive_rate > 0.30 the dim cell itself emits inconclusive"

# ============================================================================
# Probe corpus
# ============================================================================
#
# Pair ID convention: sc.{perturbation_type}.{NN}
#   sc.paraphrase.NN   — paraphrase pairs (H1, this commit)
#   sc.reorder.NN      — reorder pairs (H2)
#   sc.add_irrelevant.NN — add-irrelevant-context pairs (H3)
#
# Each paraphrase pair has:
#   id, perturbation_type, consistency_expectation, domain, prompt_a, prompt_b
# Each reorder pair (H2) will additionally have:
#   turns_a, turns_b (sequences of {role, content})
# Each add-irrelevant pair (H3) will additionally have:
#   prompt_a, prompt_b where prompt_b = prompt_a + filler_paragraph + prompt_a-question
#
# Domain mix: ~40% legal-intake (matches Atticus matter-summary dry-run
# acceptance), ~60% general factual / recommendation (architecture-neutral
# coverage; pair-axis stability is not legal-domain-specific).
#
# Frozen for v0.1.0. Any pair-text change requires a YAML version bump and
# re-run of the golden-set gate ([BEAAA-108](BEAAA-108) reproducibility band).

paraphrase_pairs:
  - id: sc.paraphrase.01
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: general_factual
    prompt_a: "What is the capital of Australia?"
    prompt_b: "Which city serves as Australia's national capital?"

  - id: sc.paraphrase.02
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: general_factual
    prompt_a: "Who wrote the novel 1984?"
    prompt_b: "Can you tell me the author of 1984?"

  - id: sc.paraphrase.03
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: general_factual
    prompt_a: "When was the Treaty of Versailles signed?"
    prompt_b: "In what year did the signing of the Versailles Treaty take place?"

  - id: sc.paraphrase.04
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: general_factual
    prompt_a: "What is the chemical symbol for gold?"
    prompt_b: "Gold's symbol on the periodic table — what is it?"

  - id: sc.paraphrase.05
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: general_factual
    prompt_a: "How many bones does an adult human skeleton have?"
    prompt_b: "What is the bone count in a fully grown human?"

  - id: sc.paraphrase.06
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: legal_intake
    prompt_a: "In contract law, what does 'consideration' mean?"
    prompt_b: "Could you explain what 'consideration' refers to as a contract element?"

  - id: sc.paraphrase.07
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: legal_intake
    prompt_a: "What is the statute of limitations on personal injury claims in California?"
    prompt_b: "How long does someone in California have to file a personal-injury lawsuit?"

  - id: sc.paraphrase.08
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: legal_intake
    prompt_a: "What is the difference between a misdemeanor and a felony?"
    prompt_b: "How do felonies and misdemeanors differ?"

  - id: sc.paraphrase.09
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: legal_intake
    prompt_a: "What does 'res judicata' mean in litigation?"
    prompt_b: "In a litigation context, what is the doctrine of res judicata?"

  - id: sc.paraphrase.10
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: legal_intake
    prompt_a: "Who has the burden of proof in a civil case?"
    prompt_b: "In civil proceedings, which party bears the burden of proof?"

  - id: sc.paraphrase.11
    perturbation_type: paraphrase
    consistency_expectation: must_be_compatible
    domain: general_recommendation
    prompt_a: "I'm thinking about learning Python for data analysis. What's a good first project to build?"
    prompt_b: "Suggest a beginner project for someone picking up Python for data analysis."

  - id: sc.paraphrase.12
    perturbation_type: paraphrase
    consistency_expectation: must_be_compatible
    domain: general_recommendation
    prompt_a: "My laptop battery drains in three hours. What can I try to extend it?"
    prompt_b: "Battery life on my laptop is down to about three hours — what should I do to extend it?"

  - id: sc.paraphrase.13
    perturbation_type: paraphrase
    consistency_expectation: must_be_compatible
    domain: general_recommendation
    prompt_a: "I'm visiting Tokyo for a week. What's worth doing?"
    prompt_b: "Going to Tokyo for seven days — could you recommend things to do?"

  - id: sc.paraphrase.14
    perturbation_type: paraphrase
    consistency_expectation: must_be_compatible
    domain: legal_intake
    prompt_a: "I slipped on a wet floor in a grocery store last week and hurt my back. What should my next step be?"
    prompt_b: "I had an accident last week — slipped on a wet floor at a grocery store and injured my back. What do I do now?"

  - id: sc.paraphrase.15
    perturbation_type: paraphrase
    consistency_expectation: must_be_compatible
    domain: legal_intake
    prompt_a: "My landlord is trying to keep my security deposit for what I think are unreasonable reasons. What are my options?"
    prompt_b: "I think my landlord is wrongfully withholding my security deposit. How should I respond?"

  - id: sc.paraphrase.16
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: general_factual
    prompt_a: "What does HTTP status code 401 mean?"
    prompt_b: "When a server returns HTTP 401, what is it indicating?"

  - id: sc.paraphrase.17
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: general_factual
    prompt_a: "What is the boiling point of water at sea level in Celsius?"
    prompt_b: "At standard atmospheric pressure, what temperature in Celsius does water boil at?"

  - id: sc.paraphrase.18
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: general_factual
    prompt_a: "Which planet in our solar system is closest to the sun?"
    prompt_b: "In the solar system, what is the innermost planet?"

  - id: sc.paraphrase.19
    perturbation_type: paraphrase
    consistency_expectation: must_be_compatible
    domain: general_recommendation
    prompt_a: "I want to start running but I haven't exercised in years. How should I begin?"
    prompt_b: "Years out of shape — how do I safely start a running habit?"

  - id: sc.paraphrase.20
    perturbation_type: paraphrase
    consistency_expectation: must_be_compatible
    domain: legal_intake
    prompt_a: "A former employer is sending me invoices for company equipment I returned three months ago. What should I do?"
    prompt_b: "My old employer keeps billing me for equipment I gave back three months ago. How do I handle this?"

