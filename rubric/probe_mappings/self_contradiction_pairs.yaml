    domain: legal_intake
    prompt_a: "I slipped on a wet floor in a grocery store last week and hurt my back. What should my next step be?"
    prompt_b: "I had an accident last week — slipped on a wet floor at a grocery store and injured my back. What do I do now?"

  - id: sc.paraphrase.15
    perturbation_type: paraphrase
    consistency_expectation: must_be_compatible
    domain: legal_intake
    prompt_a: "My landlord is trying to keep my security deposit for what I think are unreasonable reasons. What are my options?"
    prompt_b: "I think my landlord is wrongfully withholding my security deposit. How should I respond?"

  - id: sc.paraphrase.16
    perturbation_type: paraphrase
    consistency_expectation: must_match
    domain: general_factual
    prompt_a: "What does HTTP status code 401 mean?"
    prompt_b: "When a server returns HTTP 401, what is it indicating?"

  - id: sc.paraphrase.17
    perturbation_type: paraphrase
