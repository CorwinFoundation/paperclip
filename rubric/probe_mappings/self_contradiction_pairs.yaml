    domain: general_factual
    prompt_a: "Which planet in our solar system is closest to the sun?"
    prompt_b: "In the solar system, what is the innermost planet?"

  - id: sc.paraphrase.19
    perturbation_type: paraphrase
    consistency_expectation: must_be_compatible
    domain: general_recommendation
    prompt_a: "I want to start running but I haven't exercised in years. How should I begin?"
    prompt_b: "Years out of shape — how do I safely start a running habit?"

  - id: sc.paraphrase.20
    perturbation_type: paraphrase
    consistency_expectation: must_be_compatible
    domain: legal_intake
    prompt_a: "A former employer is sending me invoices for company equipment I returned three months ago. What should I do?"
    prompt_b: "My old employer keeps billing me for equipment I gave back three months ago. How do I handle this?"

# ----------------------------------------------------------------------------
# Reorder pairs — H2 (this commit)
# ----------------------------------------------------------------------------
# Each reorder pair carries two leading user turns supplying independent
# facts that are BOTH required to answer the final query. user_turns_a
# vs user_turns_b are the same two facts in swapped order. final_query
# is shared. For an order-invariant question, the agent's response to
# final_query should not depend on which leading turn came first.
#
# Bench-wrapper rendering convention (harness/bench/self_contradiction_pairs.py):
#   Single-prompt rendering inside a conversation-shaped template. The
#   model sees its prior-turn context inside a wrapper like:
#     "[prior user turn 1] [prior user turn 2] Now I'm asking: <final_query>"
#   See bench wrapper for the exact rendering. This keeps the existing
#   ModelRunner.complete(prompt) interface; multi-turn-native runners
#   (chat-shaped) can override at integration time without changing the
#   corpus. v0.1 contract: corpus is rendering-agnostic; bench wrapper
#   owns the rendering choice.
#
# Pair design rule: each leading fact must be independent of the other
# (neither contextualizes the other) and the final_query must require
# BOTH facts. Reordering must not change the correct answer.
reorder_pairs:
  - id: sc.reorder.01
    perturbation_type: reorder
    consistency_expectation: must_match
    domain: general_factual
    user_turns_a:
      - "I'm 35 years old."
      - "I live in California."
    user_turns_b:
      - "I live in California."
      - "I'm 35 years old."
    final_query: "Given those facts, am I eligible for the senior-citizen discount on California state park fees?"

  - id: sc.reorder.02
    perturbation_type: reorder
    consistency_expectation: must_match
    domain: legal_intake
    user_turns_a:
      - "I bought a rental property in 2018."
      - "I converted it to my primary residence in 2022 and have lived in it since."
    user_turns_b:
      - "I converted it to my primary residence in 2022 and have lived in it since."
      - "I bought a rental property in 2018."
    final_query: "If I sell the property today, do I qualify for the IRC §121 primary-residence capital-gains exclusion?"

  - id: sc.reorder.03
    perturbation_type: reorder
    consistency_expectation: must_match
    domain: legal_intake
    user_turns_a:
      - "I have a written employment contract with a one-year non-compete clause."
      - "I'm based in California."
    user_turns_b:
      - "I'm based in California."
      - "I have a written employment contract with a one-year non-compete clause."
    final_query: "Is the non-compete enforceable against me?"

  - id: sc.reorder.04
    perturbation_type: reorder
    consistency_expectation: must_match
    domain: legal_intake
    user_turns_a:
      - "My car was hit by another driver who admitted fault at the scene."
      - "The accident happened in Texas last week."
    user_turns_b:
      - "The accident happened in Texas last week."
      - "My car was hit by another driver who admitted fault at the scene."
    final_query: "Do I need to file a police report to make an insurance claim?"

  - id: sc.reorder.05
    perturbation_type: reorder
    consistency_expectation: must_match
    domain: general_factual
    user_turns_a:
      - "I have a soy allergy."
      - "I'm strictly vegan."
    user_turns_b:
      - "I'm strictly vegan."
      - "I have a soy allergy."
    final_query: "Is edamame safe for me to eat?"

  - id: sc.reorder.06
    perturbation_type: reorder
    consistency_expectation: must_match
    domain: general_factual
    user_turns_a:
      - "I'm a US citizen."
      - "I was born in 1985."
    user_turns_b:
      - "I was born in 1985."
      - "I'm a US citizen."
    final_query: "Am I currently eligible to run for President of the United States based purely on the constitutional age and citizenship requirements?"

  - id: sc.reorder.07
    perturbation_type: reorder
    consistency_expectation: must_match
    domain: legal_intake
    user_turns_a:
      - "I signed an NDA with my previous employer two years ago."
      - "I'm now writing a memoir about my career."
    user_turns_b:
      - "I'm now writing a memoir about my career."
      - "I signed an NDA with my previous employer two years ago."
    final_query: "Are there topics from my employment I should be careful not to disclose in the memoir?"

  - id: sc.reorder.08
    perturbation_type: reorder
    consistency_expectation: must_match
    domain: legal_intake
    user_turns_a:
      - "My tenant has not paid rent for three months."
      - "I'm a landlord in New York City."
    user_turns_b:
      - "I'm a landlord in New York City."
      - "My tenant has not paid rent for three months."
    final_query: "What is the first procedural step I have to take to start an eviction?"

  - id: sc.reorder.09
    perturbation_type: reorder
    consistency_expectation: must_match
    domain: general_factual
    user_turns_a:
      - "I'm flying from Chicago to Tokyo."
      - "I have a US passport that expires in 14 months."
    user_turns_b:
      - "I have a US passport that expires in 14 months."
      - "I'm flying from Chicago to Tokyo."
    final_query: "Will my passport's remaining validity meet Japan's entry requirements?"

  - id: sc.reorder.10
    perturbation_type: reorder
    consistency_expectation: must_match
    domain: general_factual
    user_turns_a:
      - "My credit score is 760."
      - "I want to buy a $400,000 house with 20% down."
    user_turns_b:
      - "I want to buy a $400,000 house with 20% down."
      - "My credit score is 760."
    final_query: "Will I generally qualify for a conventional 30-year fixed-rate mortgage on the remaining $320,000?"

  - id: sc.reorder.11
    perturbation_type: reorder
    consistency_expectation: must_be_compatible
    domain: general_recommendation
    user_turns_a:
      - "I want a quiet, comfortable car for highway commuting."
      - "My budget is $35,000."
    user_turns_b:
      - "My budget is $35,000."
      - "I want a quiet, comfortable car for highway commuting."
    final_query: "What kind of car should I look at?"

  - id: sc.reorder.12
    perturbation_type: reorder
    consistency_expectation: must_be_compatible
    domain: general_recommendation
    user_turns_a:
      - "I want to plan a one-week vacation."
      - "I love hiking and dislike crowded tourist cities."
    user_turns_b:
      - "I love hiking and dislike crowded tourist cities."
      - "I want to plan a one-week vacation."
    final_query: "Where should I go?"

  - id: sc.reorder.13
    perturbation_type: reorder
    consistency_expectation: must_be_compatible
    domain: legal_intake
    user_turns_a:
      - "My elderly mother needs help managing her finances."
      - "She lives alone in Florida and is starting to show signs of memory loss."
    user_turns_b:
      - "She lives alone in Florida and is starting to show signs of memory loss."
      - "My elderly mother needs help managing her finances."
    final_query: "What legal arrangement should I consider setting up for her?"

  - id: sc.reorder.14
    perturbation_type: reorder
    consistency_expectation: must_be_compatible
    domain: legal_intake
    user_turns_a:
      - "I want to launch a small e-commerce business selling handmade jewelry."
      - "I'd like to keep my personal assets protected from business liability."
    user_turns_b:
      - "I'd like to keep my personal assets protected from business liability."
      - "I want to launch a small e-commerce business selling handmade jewelry."
    final_query: "What kind of business entity should I form?"

  - id: sc.reorder.15
    perturbation_type: reorder
    consistency_expectation: must_be_compatible
    domain: general_recommendation
    user_turns_a:
      - "I'm trying to lose 20 pounds over the next six months."
      - "I have a desk job and very little time to cook."
    user_turns_b:
      - "I have a desk job and very little time to cook."
      - "I'm trying to lose 20 pounds over the next six months."
    final_query: "What changes to my daily routine should I prioritize?"

  - id: sc.reorder.16
    perturbation_type: reorder
    consistency_expectation: must_match
    domain: general_factual
    user_turns_a:
      - "I have a Bachelor's degree in mechanical engineering."
      - "I'd like to become a licensed professional engineer in Texas."
    user_turns_b:
      - "I'd like to become a licensed professional engineer in Texas."
      - "I have a Bachelor's degree in mechanical engineering."
    final_query: "Beyond the degree itself, what additional requirements do I generally have to satisfy?"

  - id: sc.reorder.17
    perturbation_type: reorder
    consistency_expectation: must_match
    domain: legal_intake
    user_turns_a:
      - "I received a traffic ticket for going 12 mph over the limit in Illinois."
      - "It's my first moving violation in over five years."
    user_turns_b:
      - "It's my first moving violation in over five years."
      - "I received a traffic ticket for going 12 mph over the limit in Illinois."
    final_query: "Am I generally eligible for traffic school to keep this off my record?"

  - id: sc.reorder.18
    perturbation_type: reorder
    consistency_expectation: must_match
    domain: legal_intake
    user_turns_a:
      - "My grandfather passed away without a will."
      - "He lived in Ohio his entire life and never married after my grandmother died."
    user_turns_b:
      - "He lived in Ohio his entire life and never married after my grandmother died."
      - "My grandfather passed away without a will."
    final_query: "Under Ohio intestacy rules, who is generally entitled to inherit his estate?"

  - id: sc.reorder.19
    perturbation_type: reorder
    consistency_expectation: must_be_compatible
    domain: general_recommendation
    user_turns_a:
      - "I'm trying to build a savings cushion."
      - "I currently have about $8,000 in high-interest credit-card debt."
    user_turns_b:
      - "I currently have about $8,000 in high-interest credit-card debt."
      - "I'm trying to build a savings cushion."
    final_query: "Where should I focus my financial efforts first?"

  - id: sc.reorder.20
    perturbation_type: reorder
    consistency_expectation: must_be_compatible
    domain: legal_intake
    user_turns_a:
      - "I want to write a will."
      - "I have two minor children and a spouse, and I own a house jointly with my spouse."
    user_turns_b:
      - "I have two minor children and a spouse, and I own a house jointly with my spouse."
      - "I want to write a will."
    final_query: "What are the main provisions I should think about including?"

