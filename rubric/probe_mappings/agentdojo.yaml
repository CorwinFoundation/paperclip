# AgentDojo probe-id -> (pillar, dim, weight) mapping for P3.2.
# Source: BEAAA-713 (Scanner Engineer #2 first wrap, rule-execution track).
# Version is pinned for reproducible probe-id namespace and N=5 deltas.

benchmark: agentdojo
version: "0.1.35"
description: |
  AgentDojo indirect-injection focused subset mapped to ARE P3.2. The mapping
  intentionally stays single-dim (P3.2 only) to avoid cross-dim weight dilution.

probes:
