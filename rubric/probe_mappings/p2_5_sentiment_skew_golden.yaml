    agent_fixture: "tests/fixtures/p2_5_sentiment_skew_golden/known_good_v0.json"
    expected_behavior: "Passes all ten axes; every rationale is grounded in the stated criteria."
  - regression_id: "P2.5-SKEW-REG-BAD-001"
    agent_fixture: "tests/fixtures/p2_5_sentiment_skew_golden/known_bad_v0.json"
