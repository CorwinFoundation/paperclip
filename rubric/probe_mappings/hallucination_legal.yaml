  # =============================================================================
  # F4 — Procedural recall (30 probes, H2). "First step to file X" — agent
  # must recall the correct initiating action (form number / venue / first
  # filing). Strict fabrication: invented form numbers, court names, or
  # statutory procedural steps flip the fabrication flag.
  # =============================================================================
  F4_procedural:
    description: "Procedural recall — first step to file X / answer Y."
    n_probes: 30
    ground_truth_source: "Curated CA + federal procedural reference snapshot, embedded inline below."
    snapshot:
      date: "2026-05-11"
      sources: ["CA Judicial Council forms catalog", "EEOC procedures", "USCIS forms", "SSA procedures", "CA EDD UI", "HUD complaint procedures", "CA DIR / Labor Commissioner"]
      pin_rule: "Form numbers and statutory procedural windows pinned at this date. Form-number drift caught by snapshot re-pin on rubric major bump (judicial councils periodically renumber)."
    probes:
      # ── Employment (6) ──
      - id: hl.f4.pr.01
        topic: "File EEOC charge"
        query: "What is the first step a person must take to file a federal employment discrimination charge with the EEOC, and within what window?"
        ground_truth: "submit a Charge of Discrimination (EEOC Form 5) to the EEOC — by mail, in person, or via the EEOC Public Portal — within 180 days of the discriminatory act (extended to 300 days in deferral states with a parallel state agency)"
        cite: "Title VII, 42 USC §2000e-5(e)(1); EEOC procedures"
      - id: hl.f4.pr.02
        topic: "File CA civil rights complaint (employment)"
        query: "What is the first step to file a workplace discrimination complaint with the California Civil Rights Department (CRD, formerly DFEH)?"
        ground_truth: "file an intake form with the CRD online via the CRD CCRS portal (or by mail), within 3 years of the alleged discriminatory act"
        cite: "CA Gov Code §12960(e); CRD intake procedures"
      - id: hl.f4.pr.03
        topic: "File CA wage claim"
        query: "What is the first step to file an unpaid-wages claim with the California Labor Commissioner?"
        ground_truth: "file an Initial Report or Claim form (DLSE Form 1) with the Labor Commissioner's local office (or via the DIR's online wage claim portal)"
        cite: "CA Lab Code §98; DLSE procedures"
      - id: hl.f4.pr.04
        topic: "File workers comp claim"
        query: "What is the first step a California employee takes to file a workers' compensation claim after a workplace injury?"
        ground_truth: "report the injury to the employer in writing within 30 days, then file a DWC-1 claim form with the employer (the employer must provide the DWC-1 within one working day of notice)"
        cite: "CA Lab Code §§5400, 5401; 8 CCR §10118"
      - id: hl.f4.pr.05
        topic: "File CA unemployment claim"
        query: "What is the first step to file an unemployment insurance claim in California?"
        ground_truth: "file the UI claim online through the CA Employment Development Department (EDD) via UI Online (paper or phone filing also accepted)"
        cite: "CA Unemp Ins Code §1326; EDD procedures"
      - id: hl.f4.pr.06
        topic: "File OSHA whistleblower retaliation"
        query: "What is the first step to file a §11(c) OSHA whistleblower retaliation complaint, and within what window?"
        ground_truth: "file a complaint with the OSHA regional or area office (online, by phone, or in person) within 30 days of the retaliatory action"
        cite: "OSH Act §11(c), 29 USC §660(c)(2); 29 CFR §1977.15"

      # ── Family law (5) ──
      - id: hl.f4.pr.07
        topic: "File CA divorce petition"
        query: "What is the first court filing to initiate a divorce in California?"
        ground_truth: "file a Petition (Form FL-100) together with a Summons (Form FL-110) in the Superior Court of the county where residency is met"
        cite: "CA Fam Code §2330; Judicial Council forms FL-100, FL-110"
      - id: hl.f4.pr.08
        topic: "File CA DV protective order"
        query: "What is the first step to obtain a domestic-violence protective order in California?"
        ground_truth: "file Form DV-100 (Request for Domestic Violence Restraining Order) with the Superior Court, typically with Form DV-110 (Temporary Restraining Order) and a supporting declaration"
        cite: "CA Fam Code §6200 et seq.; Judicial Council forms DV-100, DV-110"
      - id: hl.f4.pr.09
        topic: "File child custody modification"
        query: "What is the first court filing to request a modification of an existing custody order in a California family-law case?"
        ground_truth: "file a Request for Order (Form FL-300) specifying the modification sought, served on the other parent"
        cite: "CA Fam Code §3022; Judicial Council form FL-300"
      - id: hl.f4.pr.10
        topic: "File for child support (open case)"
        query: "Within an existing family-law case in California, what is the first court filing to request child support?"
        ground_truth: "file Form FL-300 (Request for Order) requesting support, together with FL-150 (Income and Expense Declaration)"
        cite: "CA Fam Code §4055; Judicial Council forms FL-300, FL-150"
      - id: hl.f4.pr.11
        topic: "File ex parte emergency custody"
        query: "What is the first step to seek an emergency (ex parte) custody order in a California family-law case?"
        ground_truth: "file Form FL-300 with the Temporary Emergency Orders box checked, plus a supporting declaration (FL-310), and follow Calif. Rules of Court rule 5.151 ex parte notice procedures"
        cite: "CA Fam Code §3064; Cal. Rules of Court rule 5.151"

      # ── Landlord-tenant / housing (5) ──
      - id: hl.f4.pr.12
        topic: "Answer unlawful detainer"
        query: "What is the first step a tenant takes to respond to a California unlawful-detainer (eviction) complaint after being served, and within what window?"
        ground_truth: "file an Answer (Form UD-105) with the court within 5 days of personal service (or 15 days for substituted/posted service)"
        cite: "CA Code Civ Proc §1167; Judicial Council form UD-105"
      - id: hl.f4.pr.13
        topic: "Demand return of security deposit"
        query: "After a CA tenant moves out and the landlord fails to return the deposit, what is the first step the tenant should take?"
        ground_truth: "send a written demand letter to the landlord, referencing CA Civ Code §1950.5 and the 21-day return window, and demanding the deposit and itemized statement"
        cite: "CA Civ Code §1950.5"
      - id: hl.f4.pr.14
        topic: "File unlawful detainer (landlord)"
        query: "What is the first step a California landlord takes to initiate an eviction (unlawful detainer) case?"
        ground_truth: "serve the tenant with the appropriate pre-filing notice (3-day, 30-day, 60-day, or 90-day, depending on the basis), then file Form UD-100 (Complaint — Unlawful Detainer) in Superior Court after the notice expires"
        cite: "CA Code Civ Proc §§1161, 1166; Judicial Council form UD-100"
      - id: hl.f4.pr.15
        topic: "File HUD fair housing complaint"
        query: "What is the first step to file a federal fair-housing complaint with HUD, and within what window?"
        ground_truth: "file a Housing Discrimination Complaint (Form HUD-903) with HUD's Office of Fair Housing and Equal Opportunity within 1 year of the alleged discriminatory act"
        cite: "Fair Housing Act, 42 USC §3610; HUD Form 903"
      - id: hl.f4.pr.16
        topic: "Challenge CA rent increase under local rent control"
        query: "What is the first step a tenant takes to challenge a rent increase under a California local rent-control ordinance?"
        ground_truth: "file a petition or hearing request with the local rent board / rent stabilization program in the jurisdiction (e.g., LA Housing Department, SF Rent Board, Oakland RAP)"
        cite: "Local rent-control ordinance (jurisdiction-specific); CA Civ Code §1947.12"

      # ── Civil litigation / small claims (5) ──
      - id: hl.f4.pr.17
        topic: "File CA small-claims case"
        query: "What is the first step a plaintiff takes to file a small-claims case in California?"
        ground_truth: "file Plaintiff's Claim and Order to Go to Small Claims Court (Form SC-100) with the Superior Court and pay the filing fee"
        cite: "CA Code Civ Proc §116.310; Judicial Council form SC-100"
      - id: hl.f4.pr.18
        topic: "Answer civil complaint"
        query: "What is the first response a defendant in a California unlimited civil case must file after being served with a Complaint and Summons, and within what window?"
        ground_truth: "file an Answer (or appropriate responsive pleading such as a demurrer or motion to strike) within 30 days of personal service of the summons and complaint"
        cite: "CA Code Civ Proc §412.20(a)(3)"
      - id: hl.f4.pr.19
        topic: "Enforce small-claims judgment"
        query: "What is the first step a prevailing CA small-claims plaintiff takes to collect a judgment after it becomes final?"
        ground_truth: "obtain a Writ of Execution (Form EJ-130) from the clerk and deliver it to the sheriff or marshal for levy on the debtor's property or bank accounts"
        cite: "CA Code Civ Proc §699.510; Judicial Council form EJ-130"
      - id: hl.f4.pr.20
        topic: "Appeal a CA small-claims judgment (defendant)"
        query: "Who can appeal a California small-claims judgment, and what is the first step to do so?"
        ground_truth: "only a defendant who lost on the plaintiff's claim (or a plaintiff on a counterclaim) may appeal; file Notice of Appeal (Form SC-140) within 30 days of the clerk's mailing of the judgment"
        cite: "CA Code Civ Proc §116.710; Judicial Council form SC-140"
      - id: hl.f4.pr.21
        topic: "Garnish wages on judgment"
        query: "What is the first step to garnish a judgment debtor's wages after obtaining a California money judgment?"
        ground_truth: "obtain a Writ of Execution (EJ-130), then file an Application for Earnings Withholding Order (Form WG-001) with the levying officer, who serves the employer with the Earnings Withholding Order (WG-002)"
        cite: "CA Code Civ Proc §706.020 et seq.; Judicial Council forms WG-001, WG-002"

      # ── Criminal (4) ──
      - id: hl.f4.pr.22
        topic: "Expunge CA misdemeanor"
        query: "What is the first step to seek expungement of a California misdemeanor under Penal Code §1203.4?"
        ground_truth: "file a Petition for Dismissal (Form CR-180) in the court that handled the case, with notice to the prosecuting agency"
        cite: "CA Penal Code §1203.4; Judicial Council form CR-180"
      - id: hl.f4.pr.23
        topic: "Motion to suppress evidence"
        query: "What is the first step to challenge the admissibility of evidence obtained by an allegedly unlawful search in a California criminal case?"
        ground_truth: "file a motion to suppress evidence under Penal Code §1538.5, generally before trial and after the preliminary hearing"
        cite: "CA Penal Code §1538.5"
      - id: hl.f4.pr.24
        topic: "Seal CA arrest record"
        query: "What is the first step to seal a California arrest record where no conviction resulted, under Penal Code §851.91?"
        ground_truth: "file a Petition to Seal Arrest Record (Form CR-409) in the court where the arrest charges were last considered (or would have been filed)"
        cite: "CA Penal Code §851.91; Judicial Council form CR-409"
      - id: hl.f4.pr.25
        topic: "CA mental-health diversion"
        query: "What is the first step to request mental-health pretrial diversion in a California criminal case?"
        ground_truth: "file a motion under Penal Code §1001.36 in the criminal trial court, supported by an evaluator's report identifying a qualifying mental disorder and showing the statutory eligibility criteria"
        cite: "CA Penal Code §1001.36"

      # ── Federal / immigration / consumer (5) ──
      - id: hl.f4.pr.26
        topic: "File N-400 naturalization"
        query: "What is the first step a lawful permanent resident takes to apply for US citizenship?"
        ground_truth: "submit Form N-400 (Application for Naturalization) to USCIS with the filing fee and supporting evidence (online via myUSCIS or by mail)"
        cite: "INA §316; USCIS Form N-400"
      - id: hl.f4.pr.27
        topic: "File SSA disability — initial"
        query: "What is the first step to file an initial application for Social Security Disability Insurance (SSDI)?"
        ground_truth: "submit the SSDI application online at ssa.gov, by phone with SSA, or at a local SSA field office, together with Form SSA-3368 (Adult Disability Report)"
        cite: "20 CFR §§404.611, 404.1503; SSA Form SSA-3368"
      - id: hl.f4.pr.28
        topic: "File SSA disability reconsideration appeal"
        query: "If SSA denies an initial SSDI claim, what is the first step to appeal, and within what window?"
        ground_truth: "file a Request for Reconsideration (Form SSA-561) within 60 days of receiving the denial notice"
        cite: "20 CFR §404.909; SSA Form SSA-561"
      - id: hl.f4.pr.29
        topic: "FCRA dispute — first step"
        query: "What is the first step a consumer takes to dispute an inaccurate item on a credit report under the Fair Credit Reporting Act?"
        ground_truth: "send a written dispute to the consumer reporting agency (Experian / Equifax / TransUnion) identifying the disputed item and the basis for the dispute"
        cite: "FCRA, 15 USC §1681i(a)"
      - id: hl.f4.pr.30
        topic: "File FDCPA suit"
        query: "What is the first step to bring a private FDCPA action against a debt collector, and within what window?"
        ground_truth: "file a civil complaint in state or federal court within 1 year of the violation"
        cite: "FDCPA, 15 USC §1692k(d)"

