name: scanner-regression

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-regression:
    name: golden scanner regression
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scanner-regression.txt

      - name: Install pinned scanner-regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-scanner-regression.txt

      - name: Run deterministic golden regression tests
        run: |
          python -m pytest \
            tests/test_golden_agents.py \
            tests/test_cli_runner_beaaa464.py \
            tests/test_p1_1_factuality_golden.py \
            tests/test_p1_3_consistency_golden.py \
            tests/test_p1_4_refusal_golden.py \
            tests/test_p1_5_calibration_golden.py \
            tests/test_scanner_tamper_red_team.py \
            -q

      - name: Run BEAAA-6190 v0.5 RC N=5 gate
        run: |
          python scripts/beaaa6190_v05_rc_n5.py

      - name: Enforce release N=5 and Phase-3 vanish gates
        env:
          ARE_BUNDLE_SIGNING_KEY: ci-phase3-reference-gate-nonproduction
        run: |
          python -m pytest tests/test_release_gate_beaaa10189.py tests/test_full_scan_reference_agents_beaaa13803.py -q
          python -m tools.full_scan_reference_agents --check --json-out artifacts/phase3-reference-agent-gate.json

      - name: Upload N=5 calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: beaaa6190-v05-rc-n5
          path: tools/calibration-deltas/2026-06-22-beaaa6190-v05-rc-n5.md
          if-no-files-found: error
          retention-days: 14
