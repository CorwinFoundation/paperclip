name: ARE Collector Release

on:
  push:
    tags:
      - "are-collector-v0.1.*"
  workflow_dispatch:
    inputs:
      image_name:
        description: "OCI image name to build and sign."
        required: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-sign-sbom:
    runs-on: ${{ fromJSON(vars.BACKBOND_LOCAL_DOCKER == 'true' && github.repository == 'CorwinFoundation/are-scanner' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/are-collector-v0.1.'))) && format('["self-hosted","linux","x64","backbond-publish","bb-{0}-{1}-build-sign-sbom"]', github.run_id, github.run_attempt) || '["ubuntu-latest"]') }}
    timeout-minutes: 40
    env:
      IMAGE_NAME: ${{ inputs.image_name || format('ghcr.io/{0}/are-collector', github.repository) }}
      IMAGE_TAG: ${{ github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: tools/are-collector/go.sum
      - name: Run collector canonicalization regression
        working-directory: tools/are-collector
        run: go test ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push scratch collector image
        uses: docker/build-push-action@v6
        with:
          context: tools/are-collector
          file: tools/are-collector/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          provenance: true
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate Syft SBOM
        env:
          TMPDIR: ${{ runner.temp }}
        run: syft "${IMAGE_NAME}:${IMAGE_TAG}" -o spdx-json=are-collector-${IMAGE_TAG}.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: are-collector-sbom-${{ env.IMAGE_TAG }}
          path: are-collector-${{ env.IMAGE_TAG }}.spdx.json
          retention-days: 90
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign collector image with keyless Cosign
        run: cosign sign --yes "${IMAGE_NAME}:${IMAGE_TAG}"
