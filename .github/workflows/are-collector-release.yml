name: ARE Collector Release

on:
  push:
    tags:
      - "are-collector-v0.1.*"
  workflow_dispatch:
    inputs:
      image_name:
        description: "OCI image name to build and sign."
        required: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-sign-sbom:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ inputs.image_name || format('ghcr.io/{0}/are-collector', github.repository) }}
      IMAGE_TAG: ${{ github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push scratch collector image
        uses: docker/build-push-action@v6
        with:
          context: tools/are-collector
          file: tools/are-collector/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          provenance: true
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate Syft SBOM
        run: syft "${IMAGE_NAME}:${IMAGE_TAG}" -o spdx-json=are-collector-${IMAGE_TAG}.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: are-collector-sbom-${{ env.IMAGE_TAG }}
          path: are-collector-${{ env.IMAGE_TAG }}.spdx.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign collector image with keyless Cosign
        run: cosign sign --yes "${IMAGE_NAME}:${IMAGE_TAG}"
