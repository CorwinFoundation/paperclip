# WS-5 (BEAAA-11729) — OSS CI/CD plugin acceptance matrix.
# The single acceptance criterion: this matrix is green against the mock
# scanner harness. Internal-only; the plugin is not published here.
name: ci-plugin

on:
  pull_request:
    paths:
      - "ci_plugin/**"
      - "api/ci_scan_ext.py"
      - "api/jcs.py"
      - "tests/test_ci_plugin_beaaa11729.py"
      - ".github/workflows/ci-plugin.yml"
  push:
    branches: [master]

jobs:
  acceptance-matrix:
    name: ci-plugin acceptance matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev requirements
        # The acceptance matrix needs pytest on the runner; the plugin modules
        # under test are stdlib-only, so requirements-dev.txt (which the working
        # pr-unit-tests workflow installs) is sufficient. Without this step the
        # next line dies with ModuleNotFoundError before a single row runs.
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run the 6-row exit-code matrix (mock scanner harness)
        run: python -m pytest tests/test_ci_plugin_beaaa11729.py -v
      - name: Build the plugin container (context = repo root)
        run: docker build -f ci_plugin/Dockerfile -t are-scanner-action:ci .
