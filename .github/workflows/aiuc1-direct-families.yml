name: AIUC-1 direct families

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-binding:
    name: production binding and report-only invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            locks/core-py312.lock
            locks/ci-test-py312.lock

      - name: Install strict-resolvable test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes \
            -r locks/core-py312.lock \
            -r locks/ci-test-py312.lock
          python -m pip check

      - name: Verify source-built production binding
        run: python scripts/verify_aiuc1_direct_families_release.py

      - name: Run direct-family and observation-ingestion regressions
        run: |
          python -m pytest -v -ra \
            tests/test_authentication_bypass_resistance_beaaa26755.py \
            tests/test_beaaa26756_sensitive_data_disclosure.py \
            tests/test_day1_report_only_beaaa26757.py \
            tests/test_aiuc1_direct_families_production_wiring.py

      - name: Verify registry artifacts are current
        run: python -m tools.probe_registry --repo . --check

      - name: Compile release surface
        run: |
          python -m compileall -q \
            api/day1_report_only.py \
            harness/direct_family_adapter.py \
            scripts/verify_aiuc1_direct_families_canary.py \
            scripts/verify_aiuc1_direct_families_release.py \
            tools/active_test_registry.py \
            tools/framework_worker_registry.py \
            tools/registered_case_executor.py
