name: QA review evidence gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

# Runs from base branch context — never executes PR code.
# pull_request_target gives access to checks:write for posting the result.

permissions:
  checks: write
  pull-requests: read
  contents: read

jobs:
  qa-review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout base branch (never PR code)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Validate QA review evidence
        run: node .github/scripts/check-qa-review.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Both pull_request_target and pull_request_review expose github.event.pull_request
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
