name: Sign exact BEAAA-19984 image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: sign-exact-beaaa-19984-image
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/corwinfoundation/are-scanner
  CERTIFICATE_IDENTITY: https://github.com/CorwinFoundation/are-scanner/.github/workflows/sign-beaaa-19984.yml@refs/heads/master
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  sign:
    name: Verify inputs, sign digest, and verify signature
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Assert authorized master release context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Authenticate to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve exact image digest and assert OCI revision label
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}"
          docker pull "$image_tag"
          actual_revision="$(docker image inspect "$image_tag" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$actual_revision" = "$GITHUB_SHA"

          repository_digest="$(docker image inspect "$image_tag" --format '{{ range .RepoDigests }}{{ println . }}{{ end }}' \
            | awk -v repository="${IMAGE_REPOSITORY}@sha256:" 'index($0, repository) == 1 { print; exit }')"
          test -n "$repository_digest"
          [[ "$repository_digest" =~ ^${IMAGE_REPOSITORY}@sha256:[0-9a-f]{64}$ ]]

          mkdir -p signing-evidence
          printf '%s\n' "$GITHUB_SHA" | tee signing-evidence/github-sha.txt
          printf '%s\n' "$image_tag" | tee signing-evidence/image-tag.txt
          printf '%s\n' "$actual_revision" | tee signing-evidence/oci-revision.txt
          printf '%s\n' "$repository_digest" | tee signing-evidence/image-digest.txt
          printf 'image_ref=%s\n' "$repository_digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign only the authorized image digest
        shell: bash
        run: cosign sign --yes "${{ steps.image.outputs.image_ref }}"

      - name: Verify keyless signature and save evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-evidence
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            --output json \
            "${{ steps.image.outputs.image_ref }}" | tee signing-evidence/cosign-verify.json
          printf '%s\n' "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            | tee signing-evidence/run-url.txt

      - name: Upload signing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beaaa-19984-signing-evidence
          path: signing-evidence/
          if-no-files-found: error
          retention-days: 90
