name: scanner-edge-image

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-runtime.txt"
      - "scripts/verify_runtime_import_closure.py"
      - "infra/live-edge/**"
      - "api/**"
      - "harness/**"
      - "pricing/**"
      - "rubric/**"
      - "scanners/**"
      - ".github/workflows/scanner-edge-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-build:
    name: build live scanner edge image
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: backbond-scanner-live:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image tagged by git SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Verify image metadata
        run: |
          test "$(docker image inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${{ github.sha }}"

      - name: Re-run import closure inside built image
        run: docker run --rm --entrypoint python "$IMAGE_TAG" scripts/verify_runtime_import_closure.py
