name: Scanner Dev Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-build:
    name: build deployable scanner image tar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_IMAGE_TAG: backbond-scanner-live:${{ github.sha }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v6

      - name: Resolve release manifest digest
        id: release_identity
        run: echo "manifest_sha256=$(sha256sum release/backbond-scanner-release.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build image tagged by git SHA
        run: |
          set -euo pipefail
          docker build \
            --build-arg "GIT_SHA=${GITHUB_SHA}" \
            --build-arg "BACKBOND_RELEASE_MANIFEST_SHA256=${{ steps.release_identity.outputs.manifest_sha256 }}" \
            --tag "$LOCAL_IMAGE_TAG" \
            .

      - name: Verify image identity
        run: |
          set -euo pipefail
          test "$(docker image inspect "$LOCAL_IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$LOCAL_IMAGE_TAG" --format '{{ index .Config.Labels "ai.backbond.release.manifest-sha256" }}')" = "${{ steps.release_identity.outputs.manifest_sha256 }}"

      - name: Verify runtime import closure
        run: docker run --rm --entrypoint python "$LOCAL_IMAGE_TAG" scripts/verify_runtime_import_closure.py

      - name: Create dev deploy bundle
        run: |
          set -euo pipefail
          mkdir -p dev-image
          docker save "$LOCAL_IMAGE_TAG" -o dev-image/scanner-edge-image.tar
          sha256sum dev-image/scanner-edge-image.tar > dev-image/scanner-edge-image.tar.sha256
          cp scripts/deploy/scanner-deploy.sh dev-image/scanner-deploy.sh

      - name: Upload dev deploy bundle
        uses: actions/upload-artifact@v7
        with:
          name: scanner-dev-image-${{ github.sha }}
          path: dev-image/
          if-no-files-found: error
          retention-days: 14
