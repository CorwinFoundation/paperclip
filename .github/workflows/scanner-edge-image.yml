name: Scanner Immutable GHCR Image

on:
  # Automatic on every master commit: build, sign, and publish an immutable
  # content-addressed image plus its release manifest, then deploy it to the
  # development scanner server. The on-box helper health-checks and rolls back.
  # Authorized by CEO under BEAAA-29786 on BEAAA-28837.
  push:
    branches:
      - master
  # Manual. A blank expected digest builds an immutable master image.
  # Supplying the four release inputs produces governed evidence for an
  # already-published master image, but never contacts production.
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact master commit to build or prepare for release"
        required: false
        default: ""
        type: string
      expected_image_digest:
        description: "Exact ghcr.io/corwinfoundation/are-scanner@sha256 digest; blank means build"
        required: false
        default: ""
        type: string
      source_issue_id:
        description: "Paperclip source issue UUID; required for release evidence"
        required: false
        default: ""
        type: string
      sequence:
        description: "Positive release-candidate sequence; required for release evidence"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: scanner-immutable-image-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  image-build:
    name: publish immutable scanner image and governed evidence
    runs-on: ubuntu-latest
    if: github.repository == 'CorwinFoundation/are-scanner'
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      EXPECTED_IMAGE_DIGEST: ${{ inputs.expected_image_digest }}
      SOURCE_ISSUE_ID: ${{ inputs.source_issue_id }}
      SEQUENCE: ${{ inputs.sequence }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      IMAGE_REPOSITORY: ghcr.io/corwinfoundation/are-scanner
      EVIDENCE_REPOSITORY: ghcr.io/corwinfoundation/are-scanner-release-evidence
      EVIDENCE_ARTIFACT_TYPE: application/vnd.backbond.scanner.release-evidence.v1
      EXPECTED_OCI_SOURCE: https://github.com/CorwinFoundation/are-scanner
      EXPECTED_SIGNER: https://github.com/CorwinFoundation/are-scanner/.github/workflows/scanner-edge-image.yml@refs/heads/master
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      COSIGN_WALL_TIMEOUT: 180s
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Validate source and release inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) ;;
            push)
              # Automatic master build lane: no release-evidence inputs exist.
              test -z "$EXPECTED_IMAGE_DIGEST"
              test -z "$SOURCE_ISSUE_ID"
              test -z "$SEQUENCE"
              test "$SOURCE_SHA" = "$GITHUB_SHA"
              ;;
            *) echo "unsupported event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          test "$GITHUB_REF" = refs/heads/master
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/master

          if [ -n "$EXPECTED_IMAGE_DIGEST" ]; then
            [[ "$EXPECTED_IMAGE_DIGEST" =~ ^ghcr\.io/corwinfoundation/are-scanner@sha256:[0-9a-f]{64}$ ]]
            [[ "$SOURCE_ISSUE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
            [[ "$SEQUENCE" =~ ^[1-9][0-9]*$ ]]
            test "$SOURCE_SHA" = "$(git rev-parse refs/remotes/origin/master)"
          else
            test -z "$SOURCE_ISSUE_ID"
            test -z "$SEQUENCE"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build or pull the exact candidate image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}"
          if [ -z "$EXPECTED_IMAGE_DIGEST" ]; then
            docker build --build-arg "GIT_SHA=${SOURCE_SHA}" --tag "$image_tag" .
            docker push "$image_tag"
            digest="$(docker buildx imagetools inspect "$image_tag" --format '{{ .Manifest.Digest }}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            signed_ref="${IMAGE_REPOSITORY}@${digest}"
          else
            signed_ref="$EXPECTED_IMAGE_DIGEST"
            docker pull "$signed_ref"
            docker tag "$signed_ref" "$image_tag"
          fi
          test "$(docker image inspect "$image_tag" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
          printf 'image_tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"
          printf 'signed_ref=%s\n' "$signed_ref" >> "$GITHUB_OUTPUT"

      - name: Verify OCI and embedded release identity
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "$EXPECTED_OCI_SOURCE"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
          docker run --rm --entrypoint python "$IMAGE_TAG" -c '
          import json, os, pathlib
          from tools.release_registry_marker import build_release_registry_marker

          manifest = json.loads(pathlib.Path("release/backbond-scanner-release.json").read_text())
          assert manifest["scanner_version"] == "0.5.0"
          assert manifest["corpus_version"] == "0.2.0"
          assert manifest["build_sha"] == os.environ["BACKBOND_BUILD_SHA"]
          assert manifest["release_tag"] == "sha-" + os.environ["BACKBOND_BUILD_SHA"]
          marker = manifest["registry_marker"]
          assert marker["schema_version"] == "backbond-scanner-registry-marker@1"
          assert marker == build_release_registry_marker(pathlib.Path(".").resolve())
          '

      - name: Verify runtime import closure
        run: docker run --rm --entrypoint python "${{ steps.image.outputs.image_tag }}" scripts/verify_runtime_import_closure.py

      - name: Verify AIUC-1 direct-family production binding in image
        run: docker run --rm --entrypoint python "${{ steps.image.outputs.image_tag }}" scripts/verify_aiuc1_direct_families_release.py

      - name: Export the exact immutable image archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          local_tag="backbond-scanner-live:${SOURCE_SHA}"
          docker tag "${{ steps.image.outputs.image_tag }}" "$local_tag"
          docker save "$local_tag" -o release-candidate/scanner-edge-image.tar
          printf '%s\n' "${{ steps.image.outputs.signed_ref }}" > release-candidate/scanner-edge-image.digest
          sha256sum release-candidate/scanner-edge-image.tar > release-candidate/scanner-edge-image.tar.sha256

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Generate CycloneDX SBOM
        id: sbom
        shell: bash
        run: |
          set -euo pipefail
          syft "${{ steps.image.outputs.image_tag }}" -o cyclonedx-json=release-candidate/scanner-edge-sbom.cdx.json
          sha256sum release-candidate/scanner-edge-sbom.cdx.json | tee release-candidate/scanner-edge-sbom.sha256
          printf 'hash=%s\n' "$(cut -d' ' -f1 release-candidate/scanner-edge-sbom.sha256)" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1

      - name: Sign exact digest and write Sigstore bundle
        id: signed
        timeout-minutes: 4
        shell: bash
        env:
          SIGNED_REF: ${{ steps.image.outputs.signed_ref }}
        run: |
          set -euo pipefail
          bundle=release-candidate/scanner-edge-image.sigstore.json
          timeout --signal=TERM --kill-after=15s "$COSIGN_WALL_TIMEOUT" \
            cosign sign --timeout 90s --yes --new-bundle-format=true --bundle "$bundle" "$SIGNED_REF"
          sha256sum "$bundle" | tee release-candidate/scanner-edge-image.sigstore.sha256
          printf 'bundle_hash=%s\n' "$(cut -d' ' -f1 release-candidate/scanner-edge-image.sigstore.sha256)" >> "$GITHUB_OUTPUT"

      - name: Verify exact digest signature
        timeout-minutes: 4
        shell: bash
        env:
          SIGNED_REF: ${{ steps.image.outputs.signed_ref }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s "$COSIGN_WALL_TIMEOUT" \
            cosign verify \
            --timeout 90s \
            --certificate-identity "$EXPECTED_SIGNER" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            --output json \
            --output-file release-candidate/scanner-edge-cosign-verify.json \
            "$SIGNED_REF"

      - name: Write SLSA provenance predicate
        shell: bash
        env:
          SIGNED_REF: ${{ steps.image.outputs.signed_ref }}
          SBOM_HASH: ${{ steps.sbom.outputs.hash }}
        run: |
          set -euo pipefail
          recorded_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg runUrl "$run_url" \
            --arg imageDigest "$SIGNED_REF" \
            --arg sbomHash "$SBOM_HASH" \
            --arg recordedAt "$recorded_at" \
            '{buildDefinition:{buildType:"https://backbond.ai/build/scanner-release-evidence@v1",externalParameters:{sourceSha:$sourceSha,imageDigest:$imageDigest,sbomSha256:$sbomHash},internalParameters:{workflowSha:$workflowSha,workflowRef:$workflowRef},resolvedDependencies:[{uri:"git+https://github.com/CorwinFoundation/are-scanner",digest:{gitCommit:$sourceSha}}]},runDetails:{builder:{id:$workflowRef},metadata:{invocationId:$runUrl,startedOn:$recordedAt,finishedOn:$recordedAt}}}' \
            > release-candidate/scanner-edge-slsa-provenance.json

      - name: Attest CycloneDX SBOM
        id: sbom_attested
        timeout-minutes: 4
        shell: bash
        env:
          SIGNED_REF: ${{ steps.image.outputs.signed_ref }}
        run: |
          set -euo pipefail
          bundle=release-candidate/scanner-edge-sbom-attestation.sigstore.json
          timeout --signal=TERM --kill-after=15s "$COSIGN_WALL_TIMEOUT" \
            cosign attest --timeout 90s --yes --new-bundle-format=true --bundle "$bundle" \
            --predicate release-candidate/scanner-edge-sbom.cdx.json \
            --type cyclonedx \
            "$SIGNED_REF"
          sha256sum "$bundle" | tee release-candidate/scanner-edge-sbom-attestation.sigstore.sha256
          printf 'bundle_hash=%s\n' "$(cut -d' ' -f1 release-candidate/scanner-edge-sbom-attestation.sigstore.sha256)" >> "$GITHUB_OUTPUT"

      - name: Attest SLSA provenance
        id: provenance_attested
        timeout-minutes: 4
        shell: bash
        env:
          SIGNED_REF: ${{ steps.image.outputs.signed_ref }}
        run: |
          set -euo pipefail
          bundle=release-candidate/scanner-edge-provenance-attestation.sigstore.json
          timeout --signal=TERM --kill-after=15s "$COSIGN_WALL_TIMEOUT" \
            cosign attest --timeout 90s --yes --new-bundle-format=true --bundle "$bundle" \
            --predicate release-candidate/scanner-edge-slsa-provenance.json \
            --type slsaprovenance \
            "$SIGNED_REF"
          sha256sum "$bundle" | tee release-candidate/scanner-edge-provenance-attestation.sigstore.sha256
          printf 'bundle_hash=%s\n' "$(cut -d' ' -f1 release-candidate/scanner-edge-provenance-attestation.sigstore.sha256)" >> "$GITHUB_OUTPUT"

      - name: Verify SLSA provenance attestation
        timeout-minutes: 4
        shell: bash
        env:
          SIGNED_REF: ${{ steps.image.outputs.signed_ref }}
        run: |
          set -euo pipefail
          subject_digest="${SIGNED_REF##*@sha256:}"
          timeout --signal=TERM --kill-after=15s "$COSIGN_WALL_TIMEOUT" \
            cosign verify-blob-attestation \
            --timeout 90s \
            --bundle release-candidate/scanner-edge-provenance-attestation.sigstore.json \
            --certificate-identity "$EXPECTED_SIGNER" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            --check-claims=true \
            --digest "$subject_digest" \
            --digestAlg sha256 \
            --type slsaprovenance \
            --output-file release-candidate/scanner-edge-provenance-verify.json

      - name: Verify CycloneDX SBOM attestation
        timeout-minutes: 4
        shell: bash
        env:
          SIGNED_REF: ${{ steps.image.outputs.signed_ref }}
        run: |
          set -euo pipefail
          subject_digest="${SIGNED_REF##*@sha256:}"
          timeout --signal=TERM --kill-after=15s "$COSIGN_WALL_TIMEOUT" \
            cosign verify-blob-attestation \
            --timeout 90s \
            --bundle release-candidate/scanner-edge-sbom-attestation.sigstore.json \
            --certificate-identity "$EXPECTED_SIGNER" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            --check-claims=true \
            --digest "$subject_digest" \
            --digestAlg sha256 \
            --type cyclonedx \
            --output-file release-candidate/scanner-edge-sbom-attestation-verify.json

      - name: Write the signed release manifest for the automatic master build
        if: ${{ inputs.expected_image_digest == '' }}
        shell: bash
        env:
          SIGNED_REF: ${{ steps.image.outputs.signed_ref }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          SBOM_HASH: ${{ steps.sbom.outputs.hash }}
          BUNDLE_HASH: ${{ steps.signed.outputs.bundle_hash }}
          SBOM_ATTESTATION_BUNDLE_HASH: ${{ steps.sbom_attested.outputs.bundle_hash }}
          PROVENANCE_ATTESTATION_BUNDLE_HASH: ${{ steps.provenance_attested.outputs.bundle_hash }}
        run: |
          set -euo pipefail
          test "$SIGNED_REF" = "${IMAGE_REPOSITORY}@${SIGNED_REF#*@}"
          [[ "${SIGNED_REF#*@}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$IMAGE_TAG" = "${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}"
          jq -n \
            --arg schema "backbond.scanner.release-manifest/v1" \
            --arg trigger "$GITHUB_EVENT_NAME" \
            --arg commitSha "$SOURCE_SHA" \
            --arg imageTag "$IMAGE_TAG" \
            --arg signedRef "$SIGNED_REF" \
            --arg imageDigest "${SIGNED_REF#*@}" \
            --arg signer "$EXPECTED_SIGNER" \
            --arg oidcIssuer "$OIDC_ISSUER" \
            --arg sigstoreBundleSha256 "$BUNDLE_HASH" \
            --arg sbomSha256 "$SBOM_HASH" \
            --arg sbomAttestationBundleSha256 "$SBOM_ATTESTATION_BUNDLE_HASH" \
            --arg provenanceAttestationBundleSha256 "$PROVENANCE_ATTESTATION_BUNDLE_HASH" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              schema: $schema,
              lane: "automatic-master-build",
              trigger: $trigger,
              commit_sha: $commitSha,
              image_tag: $imageTag,
              image_digest: $imageDigest,
              immutable_ref: $signedRef,
              mutable_tag_moved: false,
              signature: {
                type: "cosign-keyless",
                certificate_identity: $signer,
                oidc_issuer: $oidcIssuer,
                sigstore_bundle_sha256: $sigstoreBundleSha256,
                verified_in_run: true
              },
              sbom: {format: "cyclonedx-json", sha256: $sbomSha256,
                     attestation_bundle_sha256: $sbomAttestationBundleSha256},
              provenance: {predicate_type: "slsaprovenance",
                           attestation_bundle_sha256: $provenanceAttestationBundleSha256},
              builder: {workflow_ref: $workflowRef, workflow_sha: $workflowSha, run_url: $runUrl},
              deploy_authorized: true,
              environment_promoted: "srv1749248",
              activation: "Master deploys automatically to srv1749248 in development mode after this build succeeds."
            }' > release-candidate/backbond-scanner-release-manifest.json
          sha256sum release-candidate/backbond-scanner-release-manifest.json \
            | tee release-candidate/backbond-scanner-release-manifest.sha256
          cat release-candidate/backbond-scanner-release-manifest.json

      - name: Write immutable release candidate manifest
        if: ${{ inputs.expected_image_digest != '' }}
        shell: bash
        env:
          SIGNED_REF: ${{ steps.image.outputs.signed_ref }}
          SBOM_HASH: ${{ steps.sbom.outputs.hash }}
          BUNDLE_HASH: ${{ steps.signed.outputs.bundle_hash }}
          SBOM_ATTESTATION_BUNDLE_HASH: ${{ steps.sbom_attested.outputs.bundle_hash }}
          PROVENANCE_ATTESTATION_BUNDLE_HASH: ${{ steps.provenance_attested.outputs.bundle_hash }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          evidence_tag="sha-${SOURCE_SHA}-sequence-${SEQUENCE}-run-${GITHUB_RUN_ID}"
          jq -n \
            --arg sourceIssueId "$SOURCE_ISSUE_ID" \
            --arg commitSha "$SOURCE_SHA" \
            --arg sourceCommitSha "$SOURCE_SHA" \
            --arg ociRevision "$SOURCE_SHA" \
            --arg workflowCommitSha "$WORKFLOW_SHA" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg originMasterTip "$(git rev-parse refs/remotes/origin/master)" \
            --arg imageDigest "$SIGNED_REF" \
            --arg signatureBundleRef "oci-payload:scanner-edge-image.sigstore.json" \
            --arg signatureBundleSha256 "$BUNDLE_HASH" \
            --arg signatureSubject "$EXPECTED_SIGNER" \
            --arg signatureOidcIssuer "$OIDC_ISSUER" \
            --arg signatureWorkflowRef "$WORKFLOW_REF" \
            --arg provenanceRef "cosign-slsaprovenance:${SIGNED_REF}" \
            --arg provenanceBundleRef "oci-payload:scanner-edge-provenance-attestation.sigstore.json" \
            --arg provenanceBundleSha256 "$PROVENANCE_ATTESTATION_BUNDLE_HASH" \
            --arg sbomHash "$SBOM_HASH" \
            --arg sbomAttestationBundleRef "oci-payload:scanner-edge-sbom-attestation.sigstore.json" \
            --arg sbomAttestationBundleSha256 "$SBOM_ATTESTATION_BUNDLE_HASH" \
            --arg workflowRunUrl "$run_url" \
            --arg evidenceRepository "$EVIDENCE_REPOSITORY" \
            --arg evidenceTag "$evidence_tag" \
            --arg evidenceArtifactType "$EVIDENCE_ARTIFACT_TYPE" \
            --argjson sequence "$SEQUENCE" \
            '{sourceIssueId:$sourceIssueId,commitSha:$commitSha,sourceCommitSha:$sourceCommitSha,ociRevision:$ociRevision,workflowCommitSha:$workflowCommitSha,workflowRef:$workflowRef,originMasterTip:$originMasterTip,imageDigest:$imageDigest,signatureBundleRef:$signatureBundleRef,signatureBundleSha256:$signatureBundleSha256,signatureSubject:$signatureSubject,signatureOidcIssuer:$signatureOidcIssuer,signatureWorkflowRef:$signatureWorkflowRef,provenanceRef:$provenanceRef,provenanceBundleRef:$provenanceBundleRef,provenanceBundleSha256:$provenanceBundleSha256,sbomHash:$sbomHash,sbomAttestationBundleRef:$sbomAttestationBundleRef,sbomAttestationBundleSha256:$sbomAttestationBundleSha256,workflowRunUrl:$workflowRunUrl,sequence:$sequence,evidencePublication:{schemaVersion:"backbond-scanner-evidence-publication@1",repository:$evidenceRepository,tag:$evidenceTag,artifactType:$evidenceArtifactType,required:true},releaseGates:{schemaVersion:"backbond-scanner-release-gates@1",status:"evidence_only",deploymentInvoked:false,requiredOrder:[{order:1,id:"independent_exact_candidate_qa",status:"pending",binding:{sourceIssueId:$sourceIssueId,sourceCommitSha:$sourceCommitSha,imageDigest:$imageDigest}},{order:2,id:"fresh_founder_approval",status:"blocked",dependsOn:["independent_exact_candidate_qa"],bindingPolicy:"exact_paperclip_release_candidate"},{order:3,id:"on_box_fail_closed_activation",status:"blocked",dependsOn:["independent_exact_candidate_qa","fresh_founder_approval"],route:"paperclip_release_candidate"}]}}' \
            | tee release-candidate/scanner-release-candidate.json

      - name: Validate release identity gate
        if: ${{ inputs.expected_image_digest != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/deploy/release_identity_gate.py \
            --release-candidate release-candidate/scanner-release-candidate.json \
            --cosign-verify release-candidate/scanner-edge-cosign-verify.json \
            --expected-source-issue-id "$SOURCE_ISSUE_ID" \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-image-digest "${{ steps.image.outputs.signed_ref }}"

      - name: Install ORAS for durable evidence publication
        if: ${{ inputs.expected_image_digest != '' }}
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Publish and verify durable OCI evidence
        if: ${{ inputs.expected_image_digest != '' }}
        id: durable_evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p durable-evidence pulled-evidence
          payload="durable-evidence/scanner-release-evidence.tar"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C release-candidate -cf "$payload" .
          payload_sha256="$(sha256sum "$payload" | cut -d' ' -f1)"
          evidence_tag="sha-${SOURCE_SHA}-sequence-${SEQUENCE}-run-${GITHUB_RUN_ID}"
          evidence_ref="${EVIDENCE_REPOSITORY}:${evidence_tag}"
          if oras manifest fetch "$evidence_ref" >/dev/null 2>&1; then
            echo "Refusing to replace existing durable evidence tag: $evidence_ref" >&2
            exit 1
          fi
          push_result="$(
            cd durable-evidence
            oras push "$evidence_ref" \
              --artifact-type "$EVIDENCE_ARTIFACT_TYPE" \
              --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
              --annotation "ai.backbond.source-issue-id=${SOURCE_ISSUE_ID}" \
              --annotation "ai.backbond.release-sequence=${SEQUENCE}" \
              "scanner-release-evidence.tar:application/vnd.backbond.scanner.release-evidence.payload.v1+tar" \
              --format json
          )"
          printf '%s\n' "$push_result" > durable-evidence/oras-push.json
          evidence_digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' durable-evidence/oras-push.json)"
          digest_ref="${EVIDENCE_REPOSITORY}@${evidence_digest}"
          oras manifest fetch "$digest_ref" > durable-evidence/oci-manifest.json
          oras pull "$digest_ref" -o pulled-evidence
          test "$(sha256sum pulled-evidence/scanner-release-evidence.tar | cut -d' ' -f1)" = "$payload_sha256"
          jq -n \
            --arg reference "$digest_ref" \
            --arg payloadSha256 "$payload_sha256" \
            --arg artifactType "$EVIDENCE_ARTIFACT_TYPE" \
            --arg sourceCommitSha "$SOURCE_SHA" \
            --arg sourceIssueId "$SOURCE_ISSUE_ID" \
            --argjson sequence "$SEQUENCE" \
            '{schemaVersion:"backbond-scanner-evidence-publication-receipt@1",reference:$reference,payloadSha256:$payloadSha256,artifactType:$artifactType,sourceCommitSha:$sourceCommitSha,sourceIssueId:$sourceIssueId,sequence:$sequence,verifiedByDigestPull:true}' \
            | tee release-candidate/scanner-release-evidence-publication.json
          printf 'reference=%s\n' "$digest_ref" >> "$GITHUB_OUTPUT"
          printf 'payload_sha256=%s\n' "$payload_sha256" >> "$GITHUB_OUTPUT"
          {
            echo '### Durable scanner release evidence'
            echo
            echo "- OCI reference: \`$digest_ref\`"
            echo "- Payload SHA-256: \`$payload_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable image archive
        if: ${{ inputs.expected_image_digest == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanner-immutable-image-${{ inputs.source_sha || github.sha }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 90

      - name: Upload governed release evidence
        if: ${{ inputs.expected_image_digest != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanner-edge-release-candidate-${{ inputs.source_sha }}-${{ inputs.sequence }}
          path: |
            release-candidate/
            durable-evidence/
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: deploy master image to scanner server
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: image-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHA: ${{ github.sha }}
      IMAGE_REPOSITORY: ghcr.io/corwinfoundation/are-scanner
      DEPLOY_HOST: srv1749248.hstgr.cloud
      DEPLOY_USER: are-deploy
      DEPLOY_HELPER: /usr/local/sbin/scanner-deploy
      SLA_URL: https://scanner.backbond.ai/scanner/v1/sla
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Download image built by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scanner-immutable-image-${{ github.sha }}
          path: payload

      - name: Validate payload and resolve candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          test -s payload/scanner-edge-image.tar
          test -s payload/scanner-edge-image.digest
          test -s payload/scanner-edge-image.tar.sha256
          digest="$(cut -d@ -f2 payload/scanner-edge-image.digest | tr -d '[:space:]')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          archive_sha="$(sha256sum payload/scanner-edge-image.tar | awk '{print $1}')"
          test "$archive_sha" = "$(awk '{print $1}' payload/scanner-edge-image.tar.sha256)"
          candidate_id="$(git show -s --format=%s "$SHA" | grep -oE 'BEAAA-[0-9]+' | head -1 || true)"
          candidate_id="${candidate_id:-BEAAA-29900}"
          archive="backbond-scanner-${SHA}.tar"
          mv payload/scanner-edge-image.tar "$archive"
          {
            echo "ARCHIVE=$archive"
            echo "ARCHIVE_SHA=$archive_sha"
            echo "IMMUTABLE_REF=${IMAGE_REPOSITORY}@${digest}"
            echo "CANDIDATE_ID=$candidate_id"
          } >> "$GITHUB_ENV"

      - name: Install pinned deploy SSH identity
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.SCANNER_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SCANNER_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Capture prior identity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://scanner.backbond.ai/scanner/v1/release-identity > prior-release-identity.json || printf '{}\n' > prior-release-identity.json

      - name: Copy and activate exact image
        shell: bash
        run: |
          set -euo pipefail
          remote_archive="/var/tmp/${ARCHIVE}"
          ssh_opts=(-i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" "$ARCHIVE" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail; cleanup() { rm -f '${remote_archive}'; }; trap cleanup EXIT; sudo '${DEPLOY_HELPER}' '${SHA}' '${remote_archive}' '${IMMUTABLE_REF}' '${ARCHIVE_SHA}' '${CANDIDATE_ID}'"

      - name: Verify public release identity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 \
            https://scanner.backbond.ai/scanner/v1/release-identity > deployed-release-identity.json
          jq -e --arg sha "$SHA" --arg digest "$IMMUTABLE_REF" \
            '.commit_sha == $sha and .image_digest == $digest and .status == "activated"' \
            deployed-release-identity.json
          curl -fsS --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 "$SLA_URL" >/dev/null

      - name: Post Founder release-card receipt
        if: always()
        env:
          PAPERCLIP_API_URL: ${{ secrets.PAPERCLIP_API_URL }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_DEPLOY_AGENT_TOKEN }}
        run: |
          previous="$(jq -r '.commit_sha // "unknown"' prior-release-identity.json 2>/dev/null || echo unknown)"
          outcome="${{ job.status }}"
          python scripts/deploy/history/post_deploy_record.py \
            --sha "$SHA" --ref "$IMMUTABLE_REF" --digest "${IMMUTABLE_REF#*@}" \
            --approver founder-dev-mode --outcome "$outcome" --previous "$previous" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --issue BEAAA-29900

      - name: Remove deploy SSH identity
        if: always()
        run: rm -f ~/.ssh/id_deploy
