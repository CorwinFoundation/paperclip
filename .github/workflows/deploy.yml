# Deploy the scanner to production (srv1749248) — Development Mode push CD.
#
# Founder Directive 2026-07-21 suspended the release ceremony until first bind.
# This is the deploy path in the meantime: one click, no operator laptop.
#
# WHY CI CAN SSH IN (supersedes the "operator-mediated push" note in the parked
# cd.yml): the box is egress-sealed, so it can never PULL its release. But
# inbound SSH is and always has been open (backbond-hostinger-hardening-firewall.sh
# keeps 22 public and drops only 3000/8443/8000-8012). Pushing in over that
# channel needs no firewall change and no self-hosted runner.
#
# Nothing about the trust model on the box changes. `are-deploy` still has
# NOPASSWD sudo for exactly /usr/local/sbin/scanner-deploy, and that helper
# still verifies the archive SHA-256, the OCI revision label, and the embedded
# release manifest, activates atomically, health-checks, and AUTO-ROLLS-BACK.
# All this workflow removes is the human doing scp by hand.

name: Deploy scanner (production)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-char commit SHA to deploy (blank = current master HEAD)"
        required: false
        default: ""
      candidate_id:
        description: "Paperclip candidate id required by the on-box helper"
        required: false
        default: "BEAAA-22801"

permissions:
  contents: read
  actions: read          # cross-workflow artifact download

concurrency:
  group: scanner-production-deploy
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/corwinfoundation/are-scanner
  DEPLOY_USER: are-deploy
  DEPLOY_HOST: srv1749248.hstgr.cloud
  DEPLOY_HELPER: /usr/local/sbin/scanner-deploy
  BUILD_WORKFLOW: scanner-edge-image.yml
  SLA_URL: https://scanner.backbond.ai/scanner/v1/sla

jobs:
  deploy:
    name: push image to srv1749248
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve and validate target commit
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_CANDIDATE: ${{ inputs.candidate_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="${INPUT_SHA}"
          if [ -z "${SHA}" ]; then
            SHA="$(gh api "repos/${REPO}/commits/master" --jq .sha)"
            echo "resolved current master HEAD"
          fi
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::need a full lowercase 40-char git sha (got '${SHA}')"; exit 64; }
          [[ "${INPUT_CANDIDATE}" =~ ^BEAAA-[0-9]+$ ]] || {
            echo "::error::candidate id must look like BEAAA-NNN (got '${INPUT_CANDIDATE}')"; exit 64; }

          # Refuse anything that is not on master. "identical" = master HEAD,
          # "behind" = an older master commit (a rollback target). Anything else
          # is a side branch or an orphan and must not reach production.
          STATUS="$(gh api "repos/${REPO}/compare/master...${SHA}" --jq .status)"
          case "${STATUS}" in
            identical|behind) : ;;
            *) echo "::error::commit ${SHA} is not an ancestor of master (compare status: ${STATUS})"; exit 65 ;;
          esac

          {
            echo "SHA=${SHA}"
            echo "CANDIDATE_ID=${INPUT_CANDIDATE}"
            echo "ARCHIVE_NAME=backbond-scanner-${SHA}.tar"
          } >> "$GITHUB_ENV"
          echo "deploying ${SHA} (${STATUS} vs master) as ${INPUT_CANDIDATE}"

      - name: Locate the successful image build for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "${REPO}" --workflow "${BUILD_WORKFLOW}" --limit 100 \
            --json databaseId,headSha,conclusion \
            --jq "map(select(.headSha==\"${SHA}\" and .conclusion==\"success\")) | .[0].databaseId // empty")"
          if [ -z "${RUN_ID}" ]; then
            echo "::error::no successful ${BUILD_WORKFLOW} run found for ${SHA}."
            echo "::error::Run that workflow against this commit first, then re-dispatch."
            exit 66
          fi
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "using build run ${RUN_ID}"

      - name: Download the exact immutable image payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p payload
          gh run download "${RUN_ID}" --repo "${REPO}" --dir payload \
            --name "scanner-immutable-image-${SHA}"
          ls -l payload

      - name: Prepare payload and derive the helper arguments
        run: |
          set -euo pipefail
          test -s payload/scanner-edge-image.tar
          test -s payload/scanner-edge-image.digest

          # The .digest file holds "<repo>:sha-<sha>@sha256:<64>". The on-box
          # helper's regex forbids a ':' before the '@', so the tag must be
          # dropped and the digest reattached to the bare repository.
          DIGEST="$(cut -d'@' -f2 payload/scanner-edge-image.digest | tr -d '[:space:]')"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::malformed digest in artifact: '${DIGEST}'"; exit 67; }
          REPO_DIGEST="${IMAGE_REPOSITORY}@${DIGEST}"

          # The helper insists on this exact filename under /var/tmp.
          mv payload/scanner-edge-image.tar "${ARCHIVE_NAME}"
          ARCHIVE_SHA="$(sha256sum "${ARCHIVE_NAME}" | awk '{print $1}')"

          # Integrity check against the hash CI recorded at build time — catches
          # a corrupted or truncated artifact round-trip before it reaches the box.
          EXPECTED_SHA="$(awk '{print $1}' payload/scanner-edge-image.tar.sha256)"
          [ "${ARCHIVE_SHA}" = "${EXPECTED_SHA}" ] || {
            echo "::error::archive hash drift: built ${EXPECTED_SHA}, downloaded ${ARCHIVE_SHA}"; exit 68; }

          {
            echo "REPO_DIGEST=${REPO_DIGEST}"
            echo "ARCHIVE_SHA=${ARCHIVE_SHA}"
          } >> "$GITHUB_ENV"
          echo "payload ready: ${REPO_DIGEST} archive_sha256=${ARCHIVE_SHA}"

      - name: Install the deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_KEY}" || {
            echo "::error::secret DEPLOY_SSH_KEY is not set — see docs/deploy/push-cd-setup.md"; exit 69; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${DEPLOY_SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_SSH_KNOWN_HOSTS unset — trusting the host key on first sight"
            ssh-keyscan -T 15 "${DEPLOY_HOST}" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Copy the image to the box
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_deploy -o BatchMode=yes \
            "${ARCHIVE_NAME}" "${DEPLOY_USER}@${DEPLOY_HOST}:/var/tmp/${ARCHIVE_NAME}"

      - name: Activate on the box (health-checked, auto-rollback)
        run: |
          set -euo pipefail
          # Every value below is regex-validated above, so the single quotes are
          # sound. The helper re-verifies all of them on its own side anyway.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
             cleanup() { rm -f '/var/tmp/${ARCHIVE_NAME}'; }
             trap cleanup EXIT
             sudo ${DEPLOY_HELPER} '${SHA}' '/var/tmp/${ARCHIVE_NAME}' '${REPO_DIGEST}' '${ARCHIVE_SHA}' '${CANDIDATE_ID}'"

      - name: Verify the public SLA endpoint
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${SLA_URL}" || true)"
            echo "attempt ${attempt}: ${SLA_URL} -> HTTP ${CODE}"
            [ "${CODE}" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::SLA endpoint never returned 200."
          echo "::error::scanner-deploy auto-rolls-back a failed health check, so production"
          echo "::error::should still be on the previous good image — verify on the box."
          exit 70

      - name: Report
        if: success()
        run: echo "### Scanner live on \`${SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Shred the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
