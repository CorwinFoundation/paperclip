name: Disposable build pool acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    name: disposable Docker acceptance
    if: ${{ github.repository == 'CorwinFoundation/are-scanner' && github.ref == 'refs/heads/master' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') }}
    runs-on: [self-hosted, linux, x64, backbond-build, "bb-${{ github.run_id }}-${{ github.run_attempt }}-docker-smoke"]
    timeout-minutes: 15
    steps:
      - name: Verify nonroot confinement and fresh home
        run: |
          test "$(id -u)" = 1001
          grep -Eq '^CapEff:[[:space:]]+0+$' /proc/self/status
          grep -Eq '^NoNewPrivs:[[:space:]]+1$' /proc/self/status
          test ! -e /etc/backbond-build-pool
          test ! -e "$HOME/previous-job-sentinel"
          touch "$HOME/previous-job-sentinel"
          docker info
      - name: Build and execute through the private Docker daemon
        run: |
          set -euo pipefail
          context=$(mktemp -d "$RUNNER_TEMP/build-smoke.XXXXXX")
          printf '%s\n' 'FROM alpine:3.22' 'RUN echo disposable-build-ok > /proof' > "$context/Dockerfile"
          docker buildx create --name backbond-acceptance --driver docker-container
          docker buildx build --builder backbond-acceptance --load --tag backbond-build-smoke "$context"
          docker run --rm backbond-build-smoke grep -q disposable-build-ok /proof
          docker run --rm --volume "$context:/work:ro" alpine:3.22 test -f /work/Dockerfile
          trap 'docker rm --force backbond-port-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name backbond-port-smoke --publish 18088:80 nginx:1.27-alpine
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18088 | grep -q nginx; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Require host and private-network denial
        run: |
          python3 - <<'PY'
          import socket
          for host, port in [('82.29.173.38', 22), ('10.0.2.2', 22), ('169.254.169.254', 80)]:
              try:
                  connection = socket.create_connection((host, port), timeout=2)
              except OSError:
                  continue
              connection.close()
              raise SystemExit(f'Host/private egress unexpectedly reached {host}:{port}')
          print('Host and private-network probes were denied')
          PY

  publish-smoke:
    name: disposable publishing acceptance
    if: ${{ github.repository == 'CorwinFoundation/are-scanner' && github.ref == 'refs/heads/master' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') }}
    runs-on: [self-hosted, linux, x64, backbond-publish, "bb-${{ github.run_id }}-${{ github.run_attempt }}-publish-smoke"]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Verify fresh publisher and private Docker daemon
        run: |
          test "$(id -u)" = 1001
          grep -Eq '^CapEff:[[:space:]]+0+$' /proc/self/status
          grep -Eq '^NoNewPrivs:[[:space:]]+1$' /proc/self/status
          test ! -e /etc/backbond-build-pool
          test ! -e "$HOME/previous-job-sentinel"
          touch "$HOME/previous-job-sentinel"
          docker info
      - name: Install the publisher's signing tool without root
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: Verify signing-tool execution without publishing
        run: cosign version
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prove repository-token GHCR access without publishing
        run: docker pull ghcr.io/corwinfoundation/are-scanner@sha256:e955a2812015cf7da487c2e266e0a7f3fc9478cdafc2580dc0e02df53d96df9b
      - name: Prove protected master OIDC identity without printing a token
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sigstore'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          assert claims['iss'] == 'https://token.actions.githubusercontent.com'
          assert claims['aud'] == 'sigstore'
          assert claims['repository'] == 'CorwinFoundation/are-scanner'
          assert claims['ref'] == 'refs/heads/master'
          assert claims['workflow_ref'] == 'CorwinFoundation/are-scanner/.github/workflows/build-pool-smoke.yml@refs/heads/master'
          print('Protected master OIDC identity verified; no package was published')
          PY
