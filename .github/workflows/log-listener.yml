name: log-listener

on:
  pull_request:
    branches: [master]
    paths:
      - "tools/log-tracker/**"
      - ".github/workflows/log-listener.yml"
  push:
    branches: [master]
    paths:
      - "tools/log-tracker/**"
      - ".github/workflows/log-listener.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: log-listener-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: log-listener tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            tools/log-tracker/pyproject.toml
      - name: Install focused log-listener dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install -e tools/log-tracker
      - name: Run log-listener checks
        run: python -m pytest -q tools/log-tracker/tests tests/test_log_tracker_beaaa6159.py
