name: monitor-validation

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor-validation:
    name: monitor validation suite
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Monitor validation suite
        run: |
          PYTHONPATH="tools/e2e-harness/src:tools/post-bind-ingest/src:${PYTHONPATH}" \
          python -m e2e_harness.validation \
            --json-out artifacts/ci/monitor-validation.json \
            --md-out artifacts/ci/monitor-validation.md

      - name: Upload Monitor validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: monitor-validation
          path: |
            artifacts/ci/monitor-validation.json
            artifacts/ci/monitor-validation.md
          if-no-files-found: error
          retention-days: 14
