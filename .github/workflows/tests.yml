name: tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  min-python-cli-render:
    name: python 3.11 CLI render smoke
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is the non-co-installable release-contract
          # superset.  The CLI smoke exercises deterministic scanner/report
          # rendering, so use the installable regression + dev locks.
          python -m pip install --require-hashes \
            -r requirements-scanner-regression.txt \
            -r requirements-dev.txt

      - name: Parse Python sources
        run: |
          python - <<'PY'
          import ast
          import pathlib

          roots = [
              pathlib.Path("api"),
              pathlib.Path("bin"),
              pathlib.Path("harness"),
              pathlib.Path("report_card"),
              pathlib.Path("rubric"),
              pathlib.Path("scripts"),
              pathlib.Path("scanners"),
              pathlib.Path("tests"),
              pathlib.Path("tools"),
          ]
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.py")):
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY

      - name: Run bin/are-scan through report-card render
        run: python scripts/min_python_cli_render_smoke.py --output-dir "$RUNNER_TEMP/min-python-cli-render"

  pytest:
    name: python pytest
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            locks/core-py312.lock

      - name: Install strict-resolvable test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r locks/core-py312.lock
          python -m pip check

      - name: Ruff critical scoring module
        run: python -m ruff check rubric/scoring.py

      - name: Type-check critical scoring module
        run: python -m mypy --ignore-missing-imports rubric/scoring.py

      - name: Report high-confidence dead code
        run: python -m vulture rubric/scoring.py --min-confidence 90

      - name: Enforce critical scoring coverage
        run: |
          python -m coverage run --source=rubric.scoring -m pytest -q \
            tests/test_scoring.py \
            tests/test_beaaa198_phase3_scoring.py \
            tests/test_golden_agents.py
          python -m coverage report --fail-under=80

      - name: Prove pytest discovers integration regressions
        run: |
          python -m pytest --collect-only -q tests \
            --ignore=tests/test_inspect_runner.py \
            --ignore=tests/unit/test_inspect_provenance_pin.py \
            | tee pytest-collection.txt
          grep -F "tests/integration/test_customer_runner_egress.py::TestCustomerRunnerRefusesLoopbackRedirect::test_runner_refuses_loopback_pivot_via_redirect" pytest-collection.txt
          grep -F "tests/integration/test_invocation_context_e2e.py::test_rescans_includes_invocation_context_in_score_inputs" pytest-collection.txt
          grep -F "tests/integration/test_walker_customer_agent_v0_3.py::TestAGB1WalkerRoundTrip::test_walker_yields_rows_against_echo_server" pytest-collection.txt

      - name: Run tests
        run: |
          python -m pytest -v -ra tests \
            --ignore=tests/test_inspect_runner.py \
            --ignore=tests/unit/test_inspect_provenance_pin.py

  eval-framework-venvs:
    name: eval venv (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: garak
            import-name: garak
            distribution-name: garak
            expected-version: 0.10.0
          - framework: pyrit
            import-name: pyrit
            distribution-name: pyrit
            expected-version: 0.6.0
          - framework: agentdojo
            import-name: agentdojo
            distribution-name: agentdojo
            expected-version: 0.1.35
          - framework: inspect
            import-name: inspect_ai
            distribution-name: inspect-ai
            expected-version: 0.3.220
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      ARE_EVAL_VENVS_DIR: ${{ github.workspace }}/.cache/are-eval-venvs
      EVAL_FRAMEWORK: ${{ matrix.framework }}
      EVAL_IMPORT_NAME: ${{ matrix.import-name }}
      EVAL_DISTRIBUTION_NAME: ${{ matrix.distribution-name }}
      EVAL_EXPECTED_VERSION: ${{ matrix.expected-version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            locks/garak-py312.lock
            locks/pyrit-py312.lock
            locks/agentdojo-py312.lock
            locks/inspect-py312.lock

      - name: Restore eval venv cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ARE_EVAL_VENVS_DIR }}/${{ matrix.framework }}-venv
          key: eval-venv-${{ runner.os }}-py312-${{ matrix.framework }}-${{ hashFiles('locks/*-py312.lock', 'scripts/build_eval_framework_venvs.sh', 'scanners/eval_framework_venv.py') }}

      - name: Build and verify pinned eval venv
        run: scripts/build_eval_framework_venvs.sh "$EVAL_FRAMEWORK"

      - name: Verify isolated dependency graph
        run: |
          "$ARE_EVAL_VENVS_DIR/$EVAL_FRAMEWORK-venv/bin/python" -m pip check

      - name: Verify resolver sees pinned framework
        run: |
          python - <<'PY'
          import os
          import sys

          from scanners.eval_framework_venv import FRAMEWORKS, resolve_framework

          framework = os.environ["EVAL_FRAMEWORK"]
          expected = FRAMEWORKS[framework].pinned_version
          available, version = resolve_framework(framework)
          if not available or version != expected:
              raise SystemExit(
                  f"{framework} resolver mismatch: available={available} "
                  f"version={version!r} expected={expected!r}"
              )
          print(f"{framework}: resolver verified {version}")
          PY

      - name: Smoke import real pinned framework
        run: |
          "$ARE_EVAL_VENVS_DIR/$EVAL_FRAMEWORK-venv/bin/python" - <<'PY'
          import importlib
          import importlib.metadata
          import os

          framework = os.environ["EVAL_FRAMEWORK"]
          import_name = os.environ["EVAL_IMPORT_NAME"]
          distribution_name = os.environ["EVAL_DISTRIBUTION_NAME"]
          expected = os.environ["EVAL_EXPECTED_VERSION"]
          importlib.import_module(import_name)
          version = importlib.metadata.version(distribution_name)
          if version != expected:
              raise SystemExit(
                  f"{framework} import mismatch: {version!r} != {expected!r}"
              )
          print(f"{framework}: imported {import_name}=={version}")
          PY

      - name: Run Inspect-specific tests in pinned Inspect environment
        if: matrix.framework == 'inspect'
        run: |
          "$ARE_EVAL_VENVS_DIR/inspect-venv/bin/python" -m pip install \
            "pytest==9.0.3"
          "$ARE_EVAL_VENVS_DIR/inspect-venv/bin/python" -m pytest -v -ra \
            tests/test_inspect_runner.py \
            tests/unit/test_inspect_provenance_pin.py

      - name: Report datasets resolver split
        if: matrix.framework == 'garak' || matrix.framework == 'pyrit'
        run: |
          "$ARE_EVAL_VENVS_DIR/$EVAL_FRAMEWORK-venv/bin/python" - <<'PY'
          import importlib.metadata
          import os

          framework = os.environ["EVAL_FRAMEWORK"]
          version = importlib.metadata.version("datasets")
          major_minor = tuple(int(part) for part in version.split(".")[:2])
          if framework == "garak" and not major_minor < (2, 17):
              raise SystemExit(f"garak expected datasets<2.17, got {version}")
          if framework == "pyrit" and not major_minor >= (3, 0):
              raise SystemExit(f"pyrit expected datasets>=3.0, got {version}")
          print(f"{framework}: datasets=={version}")
          PY

      - name: Run venv resolver unit smoke
        run: python -m unittest tests.scanners.test_eval_framework_venv
