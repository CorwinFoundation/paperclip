name: tests

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # Nightly full run (03:23 UTC). The safety net for anything the
    # affected-test selection below misses on a PR or a master push.
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run everything regardless of what changed"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # PR-scoped only. Non-PR runs fall back to run_id so every push or manual
  # dispatch gets its own group and can never be cancelled by a later run of
  # the same commit. Master evidence runs are therefore uncancellable.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # What did this push/PR change, and which jobs can that affect?
  # scripts/ci_select_tests.py is fail-closed: when in doubt it answers ALL,
  # Malformed input still selects ALL. A failed selector job instead fails the
  # required aggregate, so missing outputs cannot purchase hosted heavy checks.
  # Docs/evidence-only changes therefore run nothing; a rubric change runs the
  # scoring lint + the tests that import it; a lock change runs everything.
  # ---------------------------------------------------------------------------
  changes:
    name: select affected CI
    runs-on: ${{ fromJSON(vars.BACKBOND_LOCAL_CI == 'true' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","backbond-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Trusted same-repository work queues on the isolated runner, even when
      # it is busy or offline. Forks and other actors retain hosted routing.
      # The dedicated label excludes the credential-bearing deploy runner.
      runner: ${{ vars.BACKBOND_LOCAL_CI == 'true' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","backbond-ci"]' || '["ubuntu-latest"]' }}
      selection_mode: ${{ steps.select.outputs.selection_mode }}
      tests: ${{ steps.select.outputs.tests }}
      code: ${{ steps.select.outputs.code }}
      scoring: ${{ steps.select.outputs.scoring }}
      evalvenv: ${{ steps.select.outputs.evalvenv }}
      aiuc1: ${{ steps.select.outputs.aiuc1 }}
      registry: ${{ steps.select.outputs.registry }}
      regression: ${{ steps.select.outputs.regression }}
      shards: ${{ steps.select.outputs.shards }}
      pytest_workers: ${{ steps.select.outputs.pytest_workers }}
      scanner: ${{ steps.solution.outputs.scanner }}
      instinct: ${{ steps.solution.outputs.instinct }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: List changed files
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            all:
              - '**'

      - name: Select affected tests and jobs
        id: select
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.all_files }}
          FULL_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          if [ "$FULL_RUN" = "true" ]; then
            python3 scripts/ci_select_tests.py --full \
              --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            printf '%s' "$CHANGED_FILES" | python3 scripts/ci_select_tests.py --changed-json - \
              --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Select affected solutions
        id: solution
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.all_files }}
          FULL_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          if [ "$FULL_RUN" = "true" ]; then
            printf '[]' | python3 scripts/ci_solution_changes.py --changed-json invalid \
              --github-output "$GITHUB_OUTPUT"
          else
            printf '%s' "$CHANGED_FILES" | python3 scripts/ci_solution_changes.py --changed-json - \
              --github-output "$GITHUB_OUTPUT"
          fi

  min-python-cli-render:
    name: python 3.11 CLI render smoke
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.runner != '' && needs.changes.outputs.scanner == 'true' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Prepare fresh dedicated checkout
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = backbond-ci
          test "$GITHUB_WORKSPACE" = /home/backbond-ci/runner/_work/are-scanner/are-scanner
          test ! -L "$GITHUB_WORKSPACE"
          test ! -L "$GITHUB_WORKSPACE/.git"
          # Match the fresh shallow repository used by GitHub-hosted jobs.
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            rm -rf -- "$GITHUB_WORKSPACE/.git"
          fi
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: ${{ !contains(needs.changes.outputs.runner, 'backbond-ci') && 'pip' || '' }}
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Prepare dedicated Python runtime
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        run: bash scripts/ci/prepare-python-runtime.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is the non-co-installable release-contract
          # superset.  The CLI smoke exercises deterministic scanner/report
          # rendering, so use the installable regression + dev locks.
          python -m pip install --require-hashes \
            -r requirements-scanner-regression.txt \
            -r requirements-dev.txt

      - name: Parse Python sources
        run: |
          python - <<'PY'
          import ast
          import pathlib

          roots = [
              pathlib.Path("api"),
              pathlib.Path("bin"),
              pathlib.Path("harness"),
              pathlib.Path("report_card"),
              pathlib.Path("rubric"),
              pathlib.Path("scripts"),
              pathlib.Path("scanners"),
              pathlib.Path("tests"),
              pathlib.Path("tools"),
          ]
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.py")):
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY

      - name: Run bin/are-scan through report-card render
        run: python scripts/min_python_cli_render_smoke.py --output-dir "$RUNNER_TEMP/min-python-cli-render"

  # ---------------------------------------------------------------------------
  # The Python suite as shards, one check each (BEAAA-35635). The required
  # branch-protection context is the `python pytest` fan-in job below, not
  # these; each shard names itself so a failure email says which piece failed.
  # scripts/ci_shard_tests.py bin-packs the selector's targets by measured
  # per-file duration (ci/test-durations.json), whole files only.
  # ---------------------------------------------------------------------------
  pytest:
    name: python pytest (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    # A skipped job counts as passed for branch protection, so the matrix is
    # only skipped when the selector positively said "no Python test can be
    # affected"; if the selector itself failed, run everything.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.runner != '' && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner || '["ubuntu-latest"]') }}
    # Warm shards target <= 5 minutes. The larger ceiling allows cold
    # dependency installs and the dedicated runner's two-CPU resource cap.
    timeout-minutes: 30
    strategy:
      # One shard at a time on the dedicated runner; retain hosted parallelism.
      max-parallel: ${{ contains(needs.changes.outputs.runner, 'backbond-ci') && 1 || 6 }}
      # Every shard reports. One red shard must not hide the other five.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards || '[1,2,3,4,5,6]') }}
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ strategy.job-total }}
      PYTEST_WORKERS: ${{ contains(needs.changes.outputs.runner, 'backbond-ci') && '2' || needs.changes.outputs.pytest_workers || 'auto' }}
      PYTHONHASHSEED: "0"
      TZ: UTC
      SELECTION_MODE: ${{ needs.changes.outputs.selection_mode }}
      SELECTED_TESTS: ${{ needs.changes.outputs.tests }}
      SCORING_CHANGED: ${{ needs.changes.result != 'success' || needs.changes.outputs.scoring == 'true' }}
    steps:
      - name: Prepare fresh dedicated checkout
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = backbond-ci
          test "$GITHUB_WORKSPACE" = /home/backbond-ci/runner/_work/are-scanner/are-scanner
          test ! -L "$GITHUB_WORKSPACE"
          test ! -L "$GITHUB_WORKSPACE/.git"
          # Match the fresh shallow repository used by GitHub-hosted jobs.
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            rm -rf -- "$GITHUB_WORKSPACE/.git"
          fi
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The isolated image lacks the node CLI used by frontend lifecycle tests.
      - name: Setup Node for dedicated pytest jobs
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Prepare dedicated Python runtime
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        run: bash scripts/ci/prepare-python-runtime.sh

      # The installed venv is cached, not the wheels: the core lock carries
      # CUDA torch, so installing from a warm pip cache still costs ~3 min per
      # job. A cache hit restores the ready venv and skips pip entirely; the
      # key changes with the exact interpreter build and the two locks, so a
      # lock bump rebuilds once (no pip cache: the wheels are only downloaded
      # on that miss) and every later run reuses it.
      - name: Prepare local test cache
        id: local_venv
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        run: bash scripts/ci/prepare-local-cache.sh test "py${{ steps.py.outputs.python-version }}-${{ hashFiles('locks/core-py312.lock', 'locks/ci-test-py312.lock') }}"

      - name: Restore test venv
        id: venv
        if: ${{ !contains(needs.changes.outputs.runner, 'backbond-ci') }}
        uses: actions/cache@v4
        with:
          path: .venv
          key: test-venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('locks/core-py312.lock', 'locks/ci-test-py312.lock') }}

      - name: Build strict-resolvable test venv (cache miss only)
        if: steps.venv.outputs.cache-hit != 'true' && steps.local_venv.outputs.cache-hit != 'true'
        run: |
          python -m venv "$(readlink -f .venv)"
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --require-hashes \
            -r locks/core-py312.lock \
            -r locks/ci-test-py312.lock

      - name: Activate test venv
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          .venv/bin/python -m pip check
          .venv/bin/python -c "import sys; print(sys.executable)"

      - name: Mark validated local test environment
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        run: touch .venv/.ci-ready

      - name: Ruff critical scoring module
        if: env.SHARD == '1' && env.SCORING_CHANGED == 'true'
        run: python -m ruff check rubric/scoring.py

      - name: Type-check critical scoring module
        if: env.SHARD == '1' && env.SCORING_CHANGED == 'true'
        run: python -m mypy --ignore-missing-imports rubric/scoring.py

      - name: Report high-confidence dead code
        if: env.SHARD == '1' && env.SCORING_CHANGED == 'true'
        run: python -m vulture rubric/scoring.py --min-confidence 90

      - name: Enforce critical scoring coverage
        if: env.SHARD == '1' && env.SCORING_CHANGED == 'true'
        run: |
          python -m coverage run --source=rubric.scoring -m pytest -q \
            tests/test_scoring.py \
            tests/test_beaaa198_phase3_scoring.py \
            tests/test_golden_agents.py
          python -m coverage report --fail-under=80

      - name: Prove pytest discovers integration regressions
        # Discovery config only changes with files that force a full run.
        # Suite-wide, so shard 1 carries it for the whole matrix.
        if: env.SHARD == '1' && env.SELECTION_MODE != 'SOME'
        run: |
          python -m pytest --collect-only -q tests \
            --ignore=tests/test_inspect_runner.py \
            --ignore=tests/unit/test_inspect_provenance_pin.py \
            | tee pytest-collection.txt
          grep -F "tests/integration/test_customer_runner_egress.py::TestCustomerRunnerRefusesLoopbackRedirect::test_runner_refuses_loopback_pivot_via_redirect" pytest-collection.txt
          grep -F "tests/integration/test_invocation_context_e2e.py::test_rescans_includes_invocation_context_in_score_inputs" pytest-collection.txt
          grep -F "tests/integration/test_walker_customer_agent_v0_3.py::TestAGB1WalkerRoundTrip::test_walker_yields_rows_against_echo_server" pytest-collection.txt

      - name: Run tests
        # Targets come from the changes job (scripts/ci_select_tests.py):
        # the whole tree (ALL, also when that job failed) or only the test
        # files whose import closure the diff touches (SOME).
        # pytest-xdist: one worker per runner core (-n auto), whole files kept
        # on a single worker (--dist loadfile) so module-level fixtures and
        # monkeypatched state never straddle workers. --durations surfaces the
        # slowest tests in the log so the next speed-up is data-driven.
        run: |
          # One ignore list for both the partition and the run. pytest's
          # --ignore only filters discovery, so a file named on the command
          # line runs anyway; the sharder has to drop these itself.
          IGNORE=(
            --ignore=tests/test_inspect_runner.py
            --ignore=tests/unit/test_inspect_provenance_pin.py
          )
          python scripts/ci_select_tests.py --expand > all-targets.txt
          mapfile -t TARGETS < <(python scripts/ci_shard_tests.py \
            --shard "$SHARD" --of "$SHARDS" --targets-from all-targets.txt \
            "${IGNORE[@]}")
          echo "selection=$SELECTION_MODE selected=$(wc -l < all-targets.txt)" \
            "shard=$SHARD/$SHARDS targets=${#TARGETS[@]}"
          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "nothing partitioned onto shard $SHARD of $SHARDS"
            exit 0
          fi
          python -m pytest -v -ra "${TARGETS[@]}" \
            -n "$PYTEST_WORKERS" --dist loadfile \
            --durations=25 \
            --junit-xml="$RUNNER_TEMP/junit-shard-$SHARD.xml" \
            "${IGNORE[@]}"

      # No artifact upload: the map is recovered from the run log, so refreshing
      # the partition costs no Actions storage (BEAAA-35604).
      #   gh run view <id> --log > run.log
      #   python scripts/ci_shard_tests.py --from-log run.log --out ci/test-durations.json
      - name: Emit measured per-file durations
        if: always()
        run: |
          python scripts/ci_shard_tests.py --emit-marker \
            --from-junit "$RUNNER_TEMP/junit-shard-$SHARD.xml"

  # Docker/nginx edge tests retain their hosted prerequisites. They also remain
  # in shard discovery; this explicit job prevents local environment skips
  # from reducing coverage when the dedicated runner is selected.
  native-integrations:
    name: Docker and nginx integration coverage
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.runner != '' && contains(needs.changes.outputs.runner, 'backbond-ci') && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ fromJSON(vars.BACKBOND_LOCAL_DOCKER == 'true' && github.repository == 'CorwinFoundation/are-scanner' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('["self-hosted","linux","x64","backbond-build","bb-{0}-{1}-native-integrations"]', github.run_id, github.run_attempt) || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-python
        with:
          python-version: '3.12'
      - name: Require edge integration prerequisites
        run: |
          docker info
          docker pull caddy:2.8-alpine
          docker pull nginx:1.27-alpine
          docker pull python:3.12-alpine
          if [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq nginx
          fi
          command -v nginx
          command -v ssh-keygen
          command -v openssl
          python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run edge integration coverage
        # These standalone modules use only stdlib and pytest, so the unrelated
        # scoring and customer-egress conftest seams are unnecessary here.
        run: |
          python -m pytest --noconftest -v -ra --junitxml="$RUNNER_TEMP/native-integrations.xml" \
            tests/integration/test_edge_caddy_staging.py \
            tests/integration/test_edge_nginx_request_id_beaaa16230.py \
            tests/integration/test_edge_nginx_topology_beaaa16331.py \
            tests/test_deploy_ssh_identity_beaaa39574.py
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          report = ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'native-integrations.xml'))
          skipped = report.findall('.//testcase/skipped')
          assert not skipped, 'Edge integration prerequisites caused skipped tests'
          PY

  kaltura-browser-image:
    name: Kaltura browser image readiness
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.runner != '' }}
    runs-on: ${{ fromJSON(vars.BACKBOND_LOCAL_DOCKER == 'true' && github.repository == 'CorwinFoundation/are-scanner' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('["self-hosted","linux","x64","backbond-build","bb-{0}-{1}-kaltura-browser-image"]', github.run_id, github.run_attempt) || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            kaltura:
              - 'Dockerfile'
              - 'requirements-runtime.txt'
              - 'harness/kaltura_genie_browser.py'
              - '.github/workflows/scanner-edge-image.yml'
              - '.github/workflows/tests.yml'
      - name: Build exact scanner image
        if: steps.paths.outputs.kaltura == 'true'
        run: docker build --build-arg "GIT_SHA=${GITHUB_SHA}" --tag backbond-scanner-kaltura-pr .
      - name: Prove browser readiness as service user
        if: steps.paths.outputs.kaltura == 'true'
        run: |
          docker run --rm --entrypoint python backbond-scanner-kaltura-pr -c '
          import getpass
          from playwright.sync_api import sync_playwright
          assert getpass.getuser() == "scanner"
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          '

  # The one required branch-protection context. Passes iff every shard passed,
  # so the protected-branch check names on master are unchanged by the split.
  pytest-aggregate:
    name: python pytest
    needs: [changes, pytest, native-integrations, kaltura-browser-image]
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(vars.BACKBOND_LOCAL_CI == 'true' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","backbond-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Require every shard to have passed
        env:
          SELECTOR_RESULT: ${{ needs.changes.result }}
          SELECTOR_RUNNER: ${{ needs.changes.outputs.runner }}
          SHARDS_RESULT: ${{ needs.pytest.result }}
          NATIVE_RESULT: ${{ needs.native-integrations.result }}
          KALTURA_IMAGE_RESULT: ${{ needs.kaltura-browser-image.result }}
        run: |
          test "$SELECTOR_RESULT" = success || {
            echo '::error::CI selection failed; no hosted heavy-test fallback is permitted.' >&2
            exit 1
          }
          test -n "$SELECTOR_RUNNER" || {
            echo '::error::CI runner selection is missing; no hosted heavy-test fallback is permitted.' >&2
            exit 1
          }
          case "$NATIVE_RESULT" in
            success|skipped) ;;
            *) echo '::error::Docker/nginx integration coverage did not pass.' >&2; exit 1 ;;
          esac
          test "$KALTURA_IMAGE_RESULT" = success || {
            echo '::error::Kaltura browser image readiness did not pass.' >&2
            exit 1
          }
          echo "python pytest shard matrix: $SHARDS_RESULT"
          case "$SHARDS_RESULT" in
            success)
              echo "all selected shards passed" ;;
            skipped)
              # The selector positively reported no affected Python test.
              echo "shard matrix skipped: no Python test can be affected" ;;
            *)
              echo "::error::python pytest shards did not pass (matrix result:" \
                "$SHARDS_RESULT). Open the failing 'python pytest (N/6)' check." >&2
              exit 1 ;;
          esac

  eval-framework-venvs:
    name: eval venv (${{ matrix.framework }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.runner != '' && needs.changes.outputs.evalvenv == 'true' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 40
    strategy:
      max-parallel: ${{ contains(needs.changes.outputs.runner, 'backbond-ci') && 1 || 4 }}
      fail-fast: false
      matrix:
        include:
          - framework: garak
            import-name: garak
            distribution-name: garak
            expected-version: 0.16.0
          - framework: pyrit
            import-name: pyrit
            distribution-name: pyrit
            expected-version: 0.6.0
          - framework: agentdojo
            import-name: agentdojo
            distribution-name: agentdojo
            expected-version: 0.1.35
          - framework: inspect
            import-name: inspect_ai
            distribution-name: inspect-ai
            expected-version: 0.3.220
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      ARE_EVAL_VENVS_DIR: ${{ github.workspace }}/.cache/are-eval-venvs
      EVAL_FRAMEWORK: ${{ matrix.framework }}
      EVAL_IMPORT_NAME: ${{ matrix.import-name }}
      EVAL_DISTRIBUTION_NAME: ${{ matrix.distribution-name }}
      EVAL_EXPECTED_VERSION: ${{ matrix.expected-version }}
    steps:
      - name: Prepare fresh dedicated checkout
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = backbond-ci
          test "$GITHUB_WORKSPACE" = /home/backbond-ci/runner/_work/are-scanner/are-scanner
          test ! -L "$GITHUB_WORKSPACE"
          test ! -L "$GITHUB_WORKSPACE/.git"
          # Match the fresh shallow repository used by GitHub-hosted jobs.
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            rm -rf -- "$GITHUB_WORKSPACE/.git"
          fi
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ${{ !contains(needs.changes.outputs.runner, 'backbond-ci') && 'pip' || '' }}
          cache-dependency-path: |
            locks/garak-py312.lock
            locks/pyrit-py312.lock
            locks/agentdojo-py312.lock
            locks/inspect-py312.lock

      - name: Prepare dedicated Python runtime
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        run: bash scripts/ci/prepare-python-runtime.sh

      - name: Prepare local eval cache
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        run: bash scripts/ci/prepare-local-cache.sh eval "py${{ steps.py.outputs.python-version }}-${{ hashFiles('locks/*-py312.lock', 'scripts/build_eval_framework_venvs.sh', 'scanners/eval_framework_venv.py') }}"

      - name: Restore eval venv cache
        if: ${{ !contains(needs.changes.outputs.runner, 'backbond-ci') }}
        uses: actions/cache@v4
        with:
          path: ${{ env.ARE_EVAL_VENVS_DIR }}/${{ matrix.framework }}-venv
          key: eval-venv-${{ runner.os }}-py312-${{ matrix.framework }}-${{ hashFiles('locks/*-py312.lock', 'scripts/build_eval_framework_venvs.sh', 'scanners/eval_framework_venv.py') }}

      - name: Build and verify pinned eval venv
        run: scripts/build_eval_framework_venvs.sh "$EVAL_FRAMEWORK"

      - name: Verify isolated dependency graph
        run: |
          "$ARE_EVAL_VENVS_DIR/$EVAL_FRAMEWORK-venv/bin/python" -m pip check

      - name: Verify resolver sees pinned framework
        run: |
          python - <<'PY'
          import os
          import sys

          from scanners.eval_framework_venv import FRAMEWORKS, resolve_framework

          framework = os.environ["EVAL_FRAMEWORK"]
          expected = FRAMEWORKS[framework].pinned_version
          available, version = resolve_framework(framework)
          if not available or version != expected:
              raise SystemExit(
                  f"{framework} resolver mismatch: available={available} "
                  f"version={version!r} expected={expected!r}"
              )
          print(f"{framework}: resolver verified {version}")
          PY

      - name: Smoke import real pinned framework
        run: |
          "$ARE_EVAL_VENVS_DIR/$EVAL_FRAMEWORK-venv/bin/python" - <<'PY'
          import importlib
          import importlib.metadata
          import os

          framework = os.environ["EVAL_FRAMEWORK"]
          import_name = os.environ["EVAL_IMPORT_NAME"]
          distribution_name = os.environ["EVAL_DISTRIBUTION_NAME"]
          expected = os.environ["EVAL_EXPECTED_VERSION"]
          importlib.import_module(import_name)
          version = importlib.metadata.version(distribution_name)
          if version != expected:
              raise SystemExit(
                  f"{framework} import mismatch: {version!r} != {expected!r}"
              )
          print(f"{framework}: imported {import_name}=={version}")
          PY

      - name: Run Inspect-specific tests in pinned Inspect environment
        if: matrix.framework == 'inspect'
        run: |
          "$ARE_EVAL_VENVS_DIR/inspect-venv/bin/python" -m pip install \
            "pytest==9.0.3"
          "$ARE_EVAL_VENVS_DIR/inspect-venv/bin/python" -m pytest -v -ra \
            tests/test_inspect_runner.py \
            tests/unit/test_inspect_provenance_pin.py

      - name: Report datasets resolver split
        if: matrix.framework == 'garak' || matrix.framework == 'pyrit'
        run: |
          "$ARE_EVAL_VENVS_DIR/$EVAL_FRAMEWORK-venv/bin/python" - <<'PY'
          import importlib.metadata
          import os

          framework = os.environ["EVAL_FRAMEWORK"]
          version = importlib.metadata.version("datasets")
          major_minor = tuple(int(part) for part in version.split(".")[:2])
          if framework == "garak" and version != "3.6.0":
              raise SystemExit(f"garak expected datasets==3.6.0, got {version}")
          if framework == "pyrit" and not major_minor >= (3, 0):
              raise SystemExit(f"pyrit expected datasets>=3.0, got {version}")
          print(f"{framework}: datasets=={version}")
          PY

      - name: Run venv resolver unit smoke
        run: python -m unittest tests.scanners.test_eval_framework_venv

      - name: Run Garak native-worker smoke
        if: matrix.framework == 'garak'
        run: |
          python -m pip install "pytest==9.0.3" "PyYAML==6.0.3"
          python -m pytest --noconftest -v -ra \
            tests/test_native_worker_venvs_beaaa16616.py::test_real_garak_0160_probe_generator_detector_and_seed \
            tests/test_garak_registry_resolution_beaaa31623.py

  # ---------------------------------------------------------------------------
  # Formerly separate workflows (aiuc1-direct-families.yml,
  # authoritative-probe-registry.yml, scanner-regression.yml). Folded in here
  # so they share the one `changes` job instead of each running unconditionally
  # on every push. Steps are unchanged.
  # ---------------------------------------------------------------------------
  aiuc1-production-binding:
    name: AIUC-1 production binding and report-only invariants
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.runner != '' && needs.changes.outputs.aiuc1 == 'true' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Prepare fresh dedicated checkout
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = backbond-ci
          test "$GITHUB_WORKSPACE" = /home/backbond-ci/runner/_work/are-scanner/are-scanner
          test ! -L "$GITHUB_WORKSPACE"
          test ! -L "$GITHUB_WORKSPACE/.git"
          # Match the fresh shallow repository used by GitHub-hosted jobs.
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            rm -rf -- "$GITHUB_WORKSPACE/.git"
          fi
      - name: Check out source
        uses: actions/checkout@v4

      - name: Setup Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare dedicated Python runtime
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        run: bash scripts/ci/prepare-python-runtime.sh

      # Same cached venv as the pytest job (same key): whichever job misses
      # first builds and saves it.
      - name: Prepare local test cache
        id: local_venv
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        run: bash scripts/ci/prepare-local-cache.sh test "py${{ steps.py.outputs.python-version }}-${{ hashFiles('locks/core-py312.lock', 'locks/ci-test-py312.lock') }}"

      - name: Restore test venv
        id: venv
        if: ${{ !contains(needs.changes.outputs.runner, 'backbond-ci') }}
        uses: actions/cache@v4
        with:
          path: .venv
          key: test-venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('locks/core-py312.lock', 'locks/ci-test-py312.lock') }}

      - name: Build strict-resolvable test venv (cache miss only)
        if: steps.venv.outputs.cache-hit != 'true' && steps.local_venv.outputs.cache-hit != 'true'
        run: |
          python -m venv "$(readlink -f .venv)"
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --require-hashes \
            -r locks/core-py312.lock \
            -r locks/ci-test-py312.lock

      - name: Activate test venv
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          .venv/bin/python -m pip check
          .venv/bin/python -c "import sys; print(sys.executable)"

      - name: Mark validated local test environment
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        run: touch .venv/.ci-ready

      - name: Verify source-built production binding
        run: python scripts/verify_aiuc1_direct_families_release.py

      - name: Run direct-family and observation-ingestion regressions
        run: |
          python -m pytest -v -ra \
            tests/test_authentication_bypass_resistance_beaaa26755.py \
            tests/test_beaaa26756_sensitive_data_disclosure.py \
            tests/test_day1_report_only_beaaa26757.py \
            tests/test_aiuc1_direct_families_production_wiring.py

      - name: Verify registry artifacts are current
        run: python -m tools.probe_registry --repo . --check

      - name: Compile release surface
        run: |
          python -m compileall -q \
            api/day1_report_only.py \
            harness/direct_family_adapter.py \
            scripts/verify_aiuc1_direct_families_canary.py \
            scripts/verify_aiuc1_direct_families_release.py \
            tools/active_test_registry.py \
            tools/framework_worker_registry.py \
            tools/registered_case_executor.py

  authoritative-probe-registry:
    name: authoritative probe registry drift
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.runner != '' && needs.changes.outputs.registry == 'true' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Prepare fresh dedicated checkout
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = backbond-ci
          test "$GITHUB_WORKSPACE" = /home/backbond-ci/runner/_work/are-scanner/are-scanner
          test ! -L "$GITHUB_WORKSPACE"
          test ! -L "$GITHUB_WORKSPACE/.git"
          # Match the fresh shallow repository used by GitHub-hosted jobs.
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            rm -rf -- "$GITHUB_WORKSPACE/.git"
          fi
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Prepare dedicated Python runtime
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        run: bash scripts/ci/prepare-python-runtime.sh
      - name: Install focused registry-gate dependencies
        run: |
          python -m pip install --require-hashes -r requirements-scanner-regression.txt
          python -m pip install pytest==9.0.3 jsonschema==4.26.0
      - run: scripts/authoritative_probe_registry_integration_gate.sh

  golden-regression:
    name: golden scanner regression
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.runner != '' && needs.changes.outputs.regression == 'true' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Prepare fresh dedicated checkout
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = backbond-ci
          test "$GITHUB_WORKSPACE" = /home/backbond-ci/runner/_work/are-scanner/are-scanner
          test ! -L "$GITHUB_WORKSPACE"
          test ! -L "$GITHUB_WORKSPACE/.git"
          # Match the fresh shallow repository used by GitHub-hosted jobs.
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            rm -rf -- "$GITHUB_WORKSPACE/.git"
          fi
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: ${{ !contains(needs.changes.outputs.runner, 'backbond-ci') && 'pip' || '' }}
          cache-dependency-path: requirements-scanner-regression.txt

      - name: Prepare dedicated Python runtime
        if: contains(needs.changes.outputs.runner, 'backbond-ci')
        run: bash scripts/ci/prepare-python-runtime.sh

      - name: Install pinned scanner-regression dependencies
        run: |
          python -m pip install --require-hashes -r requirements-scanner-regression.txt

      - name: Run deterministic golden regression tests
        run: |
          python -m pytest \
            tests/test_golden_agents.py \
            tests/test_beaaa23968_corpus_pin.py \
            tests/test_beaaa24002_corpus_pin_p13_p15.py \
            tests/test_cli_runner_beaaa464.py \
            tests/test_p1_1_factuality_golden.py \
            tests/test_p1_3_consistency_golden.py \
            tests/test_p1_4_refusal_golden.py \
            tests/test_p1_5_calibration_golden.py \
            tests/test_scanner_tamper_red_team.py \
            -q

      - name: Run BEAAA-6190 v0.5 RC N=5 gate
        run: |
          python scripts/beaaa6190_v05_rc_n5.py

      - name: Enforce release N=5 and Phase-3 vanish gates
        env:
          ARE_BUNDLE_SIGNING_KEY: ci-phase3-reference-gate-nonproduction
        run: |
          python -m pytest tests/test_release_gate_beaaa10189.py tests/test_full_scan_reference_agents_beaaa13803.py -q
          python -m tools.full_scan_reference_agents --check --json-out artifacts/phase3-reference-agent-gate.json

      # Diagnostic dump, not the governed copy. The calibration table this uploads
      # is a file committed in the repository at the path below, so the artifact is
      # a convenience copy of something already durable in git. It must never decide
      # the required check `golden scanner regression`, which is what happened while
      # Actions artifact storage was over the account allowance (BEAAA-35604): the
      # N=5 and Phase-3 gates passed and the job died on `Failed to CreateArtifact`.
      # Diagnostics upload only on failure and age out in a day.
      - name: Upload N=5 calibration evidence (diagnostic)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: beaaa6190-v05-rc-n5
          path: tools/calibration-deltas/2026-06-22-beaaa6190-v05-rc-n5.md
          if-no-files-found: warn
          retention-days: 1
