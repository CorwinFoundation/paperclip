name: authoritative-probe-registry
on:
  pull_request:
  push:
    branches: [master]
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: scripts/authoritative_probe_registry_integration_gate.sh
