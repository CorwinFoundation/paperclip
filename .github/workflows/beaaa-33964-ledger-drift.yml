name: BEAAA-33964 rank-2 ledger drift

# Reports whether artifacts/beaaa-31092/rank2-ledger.json still reproduces from
# the pinned inventory + run manifest under the CURRENT code. It fails closed: a
# rebuild that cannot run is reported as "ledger not reproducible under the
# current manifest", not treated as nothing-to-compare.
#
# This job is deliberately NOT one of master's three required status checks
# ("golden scanner regression", "python pytest", "python 3.11 CLI render smoke").
# Making it required would convert a standing, known gap into a repo-wide merge
# block, which would get the check waived rather than the ledger fixed. Its
# behaviour is pinned by tests/test_beaaa33964_ledger_drift.py, which does run
# under "python pytest".
#
# BEAAA-33992: the reason it is expected RED here has changed. It used to be that
# the pinned manifest was unfit to bind and build_ledger refused it; that is
# fixed. What a CI runner still lacks is the evidence export the manifest names,
# and recorded_target_response is only ever read from there - so the job now
# reports the one non-comparable finding and exits 1. Pass --evidence-root (or
# set BEAAA31092_EVIDENCE_ROOT) on a host that has the export mounted to get the
# real comparison; it exits 0 there.
#
# BEAAA-34038: the job now also prints an ADVISORY replay - the committed ledger's
# own recorded responses fed back through the rebuild - which answers whether
# current code still derives the committed dispositions and counts. It prints
# below the finding and never changes the exit code, because a response sourced
# from the artifact under test proves the derivation is stable, not that the text
# is what the target said. The job stays red until the real export is reachable.

on:
  pull_request:
    paths:
      - "artifacts/beaaa-31092/**"
      - "artifacts/beaaa-18720/unified-probe-inventory.jsonl"
      - "tools/beaaa31092_content_slice.py"
      - "tools/beaaa33964_ledger_drift_check.py"
      - ".github/workflows/beaaa-33964-ledger-drift.yml"
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  ledger-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild the pinned ledger and compare
        run: PYTHONPATH=. python tools/beaaa33964_ledger_drift_check.py
