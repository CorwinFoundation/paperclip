name: PR Unit Tests

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes the running set.
  group: pr-unit-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Same selector as tests.yml: each job below runs only when its own area
  # changed (see GATES in scripts/ci_select_tests.py). If this job fails, every
  # job runs, so a broken selector costs minutes, not coverage.
  changes:
    name: select affected CI
    runs-on: ${{ fromJSON(vars.BACKBOND_LOCAL_CI == 'true' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","backbond-ci-control"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      brain: ${{ steps.select.outputs.brain }}
      portal: ${{ steps.select.outputs.portal }}
      probe_sdk: ${{ steps.select.outputs.probe_sdk }}
      connector: ${{ steps.select.outputs.connector }}
      go: ${{ steps.select.outputs.go }}
      runtime_slice: ${{ steps.select.outputs.runtime_slice }}
    steps:
      - uses: actions/checkout@v4
      - name: List changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            all:
              - '**'
      - name: Select affected jobs
        id: select
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.all_files }}
        run: |
          printf '%s' "$CHANGED_FILES" | python3 scripts/ci_select_tests.py --changed-json - \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  brain-unit-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.brain == 'true') }}
    runs-on: ${{ fromJSON(vars.BACKBOND_LOCAL_CI == 'true' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","backbond-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-python
        with:
          python-version: "3.11"
          cache-dependency-path: requirements-dev.txt
      - name: Install dev requirements
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run brain unit tests
        run: python -m pytest tests/test_r2_bias_families.py tests/test_r2_rob_families.py -q

  portal-unit-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.portal == 'true') }}
    runs-on: ${{ fromJSON(vars.BACKBOND_LOCAL_CI == 'true' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","backbond-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-python
        with:
          python-version: "3.11"
          cache-dependency-path: requirements-dev.txt
      - name: Install PDF text extraction dependency
        if: runner.environment != 'self-hosted'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Require provisioned PDF text extraction tool
        run: |
          command -v pdftotext
          pdftotext -v
      - name: Install dev requirements
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run portal and fixture unit tests
        run: |
          python -m pytest tools/portal_v1 -q
          if [ -f tools/staging-endpoint-fixture/test_determinism.py ]; then
            python -m pytest tools/staging-endpoint-fixture/test_determinism.py -q
          else
            echo "Skipping legacy staging-endpoint fixture tests; path is not present on this branch."
          fi
          if [ -f tools/connector-static-attest/test_attest.py ]; then
            python -m pytest tools/connector-static-attest/test_attest.py -q
          else
            echo "Skipping legacy connector static-attest tests; path is not present on this branch."
          fi

  probe-sdk-unit-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.probe_sdk == 'true') }}
    runs-on: ${{ fromJSON(vars.BACKBOND_LOCAL_CI == 'true' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","backbond-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-python
        with:
          python-version: "3.11"
          cache-dependency-path: |
            requirements-dev.txt
            engineering/probe-sdk/pyproject.toml
      - name: Install probe SDK and dev requirements
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install -e engineering/probe-sdk
      - name: Run probe SDK unit tests
        run: python -m pytest engineering/probe-sdk/tests -q

  connector-unit-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.connector == 'true') }}
    runs-on: ${{ fromJSON(vars.BACKBOND_LOCAL_CI == 'true' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","backbond-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-python
        with:
          python-version: "3.11"
          cache-dependency-path: |
            requirements-dev.txt
            tools/are-connector/pyproject.toml
      - name: Install connector and dev requirements
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install -e tools/are-connector
      - name: Run connector unit tests
        run: python -m pytest tools/are-connector/tests -q

  are-collector-unit-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ${{ fromJSON(vars.BACKBOND_LOCAL_CI == 'true' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","backbond-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: ${{ runner.environment != 'self-hosted' }}
          cache-dependency-path: tools/are-collector/go.sum
      - name: Run collector unit and integration tests
        working-directory: tools/are-collector
        run: go test ./...

  # BEAAA-13329 / ADR-0038 — production runtime import-closure guard.
  # Builds a venv from requirements-runtime.txt ONLY (the live online-service
  # slice), then asserts (1) every live module imports and (2) the four
  # offline eval frameworks are NOT importable. This is also the standing
  # proof that the slice resolves + installs clean with no datasets conflict
  # (garak vs pyrit), i.e. the production venv is buildable on a fresh box.
  runtime-slice-import-closure:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.runtime_slice == 'true') }}
    runs-on: ${{ fromJSON(vars.BACKBOND_LOCAL_CI == 'true' && (github.actor == 'CorwinFoundation' || github.actor == 'backbond-qa') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","backbond-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    env:
      ARE_RUNTIME_SLICE_VENV: "1"
      ARE_BUNDLE_SIGNING_KEY: "beaaa13329-import-closure-dummy"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-python
        with:
          python-version: "3.11"
          cache-dependency-path: requirements-runtime.txt
      - name: Build the production runtime venv from the slice only
        run: |
          # Install the runtime slice ONLY — no requirements.txt, no dev deps.
          # A clean resolve here IS the "no datasets conflict" acceptance proof.
          python -m pip install --require-hashes -r requirements-runtime.txt
          # pytest is the only test-runner dep we add on top of the slice.
          python -m pip install "pytest==9.0.3"
      - name: Assert the four eval frameworks are absent from the slice
        run: |
          for fw in garak pyrit agentdojo inspect_ai; do
            if python -c "import ${fw}" 2>/dev/null; then
              echo "FAIL: ${fw} is importable in the runtime slice venv"; exit 1
            fi
          done
          echo "OK: garak / pyrit / agentdojo / inspect_ai all absent"
      - name: Run the import-closure guard test
        run: python -m pytest tests/test_runtime_import_closure_beaaa13329.py -q
