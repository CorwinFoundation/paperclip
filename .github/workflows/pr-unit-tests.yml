name: PR Unit Tests

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  brain-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev requirements
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run brain unit tests
        run: python -m pytest tests/test_r2_bias_families.py tests/test_r2_rob_families.py -q

  portal-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev requirements
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run portal and fixture unit tests
        run: |
          python -m pytest tools/portal_v1 -q
          if [ -f tools/staging-endpoint-fixture/test_determinism.py ]; then
            python -m pytest tools/staging-endpoint-fixture/test_determinism.py -q
          else
            echo "Skipping legacy staging-endpoint fixture tests; path is not present on this branch."
          fi
          if [ -f tools/connector-static-attest/test_attest.py ]; then
            python -m pytest tools/connector-static-attest/test_attest.py -q
          else
            echo "Skipping legacy connector static-attest tests; path is not present on this branch."
          fi

  probe-sdk-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            engineering/probe-sdk/pyproject.toml
      - name: Install probe SDK and dev requirements
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install -e engineering/probe-sdk
      - name: Run probe SDK unit tests
        run: python -m pytest engineering/probe-sdk/tests -q

  connector-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            tools/are-connector/pyproject.toml
      - name: Install connector and dev requirements
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install -e tools/are-connector
      - name: Run connector unit tests
        run: python -m pytest tools/are-connector/tests -q

  are-collector-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: tools/are-collector/go.sum
      - name: Run collector unit and integration tests
        working-directory: tools/are-collector
        run: go test ./...

  # BEAAA-13329 / ADR-0038 — production runtime import-closure guard.
  # Builds a venv from requirements-runtime.txt ONLY (the live online-service
  # slice), then asserts (1) every live module imports and (2) the four
  # offline eval frameworks are NOT importable. This is also the standing
  # proof that the slice resolves + installs clean with no datasets conflict
  # (garak vs pyrit), i.e. the production venv is buildable on a fresh box.
  runtime-slice-import-closure:
    runs-on: ubuntu-latest
    env:
      ARE_RUNTIME_SLICE_VENV: "1"
      ARE_BUNDLE_SIGNING_KEY: "beaaa13329-import-closure-dummy"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Build the production runtime venv from the slice only
        run: |
          # Install the runtime slice ONLY — no requirements.txt, no dev deps.
          # A clean resolve here IS the "no datasets conflict" acceptance proof.
          python -m pip install --require-hashes -r requirements-runtime.txt
          # pytest is the only test-runner dep we add on top of the slice.
          python -m pip install "pytest==9.0.3"
      - name: Assert the four eval frameworks are absent from the slice
        run: |
          for fw in garak pyrit agentdojo inspect_ai; do
            if python -c "import ${fw}" 2>/dev/null; then
              echo "FAIL: ${fw} is importable in the runtime slice venv"; exit 1
            fi
          done
          echo "OK: garak / pyrit / agentdojo / inspect_ai all absent"
      - name: Run the import-closure guard test
        run: python -m pytest tests/test_runtime_import_closure_beaaa13329.py -q
