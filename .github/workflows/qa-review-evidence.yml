name: qa-review-evidence

# Control repair for BEAAA-28421 / BEAAA-28516.
# Publishes the `qa-review-evidence` check-run, which is enrolled as a required
# status check on the default branch. A `backbond-qa` APPROVED review only
# passes when it carries a substantive body (>= 50 chars) that cites the exact
# PR head SHA. Identity alone is not a pass.
#
# The job is deliberately named `qa-gate` so that the job's own check-run does
# not collide with the `qa-review-evidence` check-run the script posts.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  qa-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Evaluate backbond-qa approval evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-qa-review.mjs
