# BackBond Scanner — Sequence 20 edge, HTTP-context fragment (log_format only).
# BEAAA-16331 (parent BEAAA-16330; operator STOP on BEAAA-16232 962f9417).
#
# WHY THIS FILE EXISTS
#   The prior deployable surface was a single standalone `server {}` block that
#   declared its own `listen`/`server_name`. Installed into nginx's live config,
#   that created a SECOND, parallel TLS listener that conflicts with the real
#   production vhost `/etc/nginx/sites-available/scanner.backbond.ai`. The
#   operator's fail-closed pre-mutation inventory caught this before any change.
#
#   The topology-correct integration adds NO server block and NO listener. It is
#   two fragments: this HTTP-context fragment (a single `log_format`) and a
#   SERVER-context include (`backbond-scanner-edge.server.conf.template`) that is
#   pulled INTO the existing scanner.backbond.ai server block.
#
# WHERE THIS GOES
#   Installed at HTTP scope, i.e. dropped into /etc/nginx/conf.d/ (which the
#   distribution nginx.conf includes inside its top-level `http {}`). It declares
#   ONLY the `edge_json` log_format so the server-scope `access_log` in the
#   include can reference it. It opens no socket and defines no server, so it can
#   never collide with, duplicate, or shadow the live TLS vhost.
#
# WHAT IT GUARANTEES (unchanged from the reviewed posture)
#   One access-log line per request, keyed by the SAME opaque id echoed to the
#   client in X-Request-ID. escape=json keeps upstream-influenced fields safe.
#
# No score / API contract / rubric / corpus behaviour changes.

log_format edge_json escape=json
    '{"ts":"$time_iso8601","request_id":"$request_id","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes_sent":$bytes_sent}';
