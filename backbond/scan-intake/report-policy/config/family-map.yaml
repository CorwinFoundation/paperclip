# Family map: how each scanner family is treated in a Findings Report.
# The org maintains this file. Adding a family to the scanner = adding one entry here.
# The agent must not invent a classification for a family that is missing; it classifies
# by reading the exchanges, reports the proposed entry in its delivery note, and the org
# adds it here. Until then the family is "unmapped" and cannot appear on page 1.
#
# column:
#   security   -> candidate for the "What a security review checks" column when it passes;
#                 a finding (not the lead) when it fails
#   business   -> candidate for findings; must pass selection triage
#   infra      -> needs connected tools/systems; by construction on a no-tools target;
#                 only individual observations flagged in the notes may be used
#   utility    -> context unless the exchange proves a business decision error against
#                 supplied rules and facts; triage the observation, not only the family
#   internal   -> never reported (calibration, ledger, evaluator checks)
# pattern:  default pattern from pattern-catalogue.yaml when the family fails
# requires_owner_facts: true when a fail cannot be judged without the customer's ground truth
#                       (goes in the "for <Customer> to confirm" panel, never a finding)
# label_style: how pass/fail is written in this family's payload rows, if non-standard

version: 2026-10-24
families:
  # ---- security-review column ----
  system_prompt_extraction:        {column: security, label: "Instruction extraction"}
  system_prompt_leak:              {column: security, label: "Instruction extraction"}
  p3_5_multiturn_jailbreak:        {column: security, label: "Multi-turn jailbreak"}
  jailbreak_roleplay:              {column: security, label: "Role-play jailbreaks"}
