[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "post-bind-ingest"
version = "0.1.0"
description = "BackBond Phase 2.0 post-bind log ingest gateway and normalizer (BEAAA-5863)"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
