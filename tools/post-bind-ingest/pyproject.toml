[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "post-bind-ingest"
version = "0.1.0"
description = "BackBond post-bind manifest ingest and Phase 2.5 egress receiver"
requires-python = ">=3.11"
dependencies = ["cryptography>=41,<42"]

[project.scripts]
post-bind-ingest = "post_bind_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
