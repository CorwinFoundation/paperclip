[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "are-connector"
version = "0.1.1"
description = "Backbond connector v1 runtime for DP-side staging scans"
requires-python = ">=3.11"
dependencies = [
  "cryptography==45.0.7",
  "pynacl==1.6.2",
  "requests==2.34.2",
]

[project.scripts]
are-connector = "are_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
