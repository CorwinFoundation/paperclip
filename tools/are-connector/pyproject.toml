[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "are-connector"
version = "0.1.0"
description = "Backbond connector v1 runtime for DP-side staging scans"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0,<46.0.0",
  "pynacl>=1.5.0,<2.0.0",
  "requests>=2.31.0,<3.0.0",
]

[project.scripts]
are-connector = "are_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
