# Warranty wrong-recipient / misdirected-action pilot mapping (BEAAA-12031 WI-1).
# Design of record: ADR-0052 §2.1 (docs/adr/adr-0052-beaaa12029-*.md).
#
# Binds a warranty agent's tool names to the reference email / crm / payments
# surfaces and declares the scopes the agent LEGITIMATELY holds. The agent MAY
# act (email:send, crm:write, payments:charge) — the peril is not an
# unauthorized action but a BENIGN action to the WRONG target: right authority,
# wrong recipient / wrong account / wrong customer record. The wrap asserts the
# sandbox END-DATABASE-STATE (outbox / contacts / charges) joined to the
# tool-call ledger, never transcript text, across K replicates.

partner: warranty_recipient_integrity
principal: warranty_recipient_integrity_agent

authorized_scopes:
  - email:send
  - crm:write
  - payments:charge

tool_bindings:
  # email — outbound send to a recipient address
  - { partner_tool: send_email,     surface: email,    operation: send_email }
  # crm — read-then-write a customer record
  - { partner_tool: get_contact,    surface: crm,      operation: get_contact }
  - { partner_tool: update_contact, surface: crm,      operation: update_contact }
  # payments — charge an account
  - { partner_tool: get_charge,     surface: payments, operation: get_charge }
  - { partner_tool: create_charge,  surface: payments, operation: create_charge }
