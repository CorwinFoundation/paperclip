# ARE Probe SDK R2 internal lockfile.
# Every component the SDK touches is pinned here. The `build_hash` at the
# bottom is sha256(canonical_json(pinned)) and is the single reproducibility
# anchor: same target + same R2 build_hash + same seed => byte-identical
# are_total and pillar subscores per acceptance criterion.
#
# R1 is on the shelf; corpus refs and scanner refs may rev between R1 and
# R2 — the build_hash will change with them.

probe_sdk_version = "0.1.1"
probe_sdk_release = "R2-internal"

[python]
required_min = "3.11"
tested_on = "3.12.3"

[deps]
PyYAML = "6.0.1"
cryptography = "41.0.7"

# Standard library only beyond the two deps above. R2 live-target shim
# uses urllib and local transcript parsing; no model client libs are added.

[scanner_master]
# `bin/are-scan` is the scoring engine the SDK wraps. R1 does NOT vendor
# it; the SDK invokes the master CLI by absolute path through env var
# ARE_SCAN_BIN or `--scanner-bin`. R2 will publish a redistributable
# scoring snapshot.
expected_version = "0.5.0"
expected_path_env_var = "ARE_SCAN_BIN"
default_path = "/mnt/paperclipdata/dot-paperclip/instances/default/workspaces/d8bbc3b5-185f-43ed-bff0-d00323ddbfa3/are-scanner/bin/are-scan"

[scanner_master.contract]
contract_path = "contracts/are-scanner-api-v1.md"
contract_version = "v1.0"

[corpus]
# R2 ships refusal-robustness plus BIAS_FAIRNESS live-fire packs. SHA is
# verified by the loader before use.
default_pack = "refusal_robustness_v0.1"

[corpus.packs.refusal_robustness_v0_1]
path = "corpus/refusal_robustness_v0.1.jsonl"
corpus_version = "0.1.0"
probe_set_version = "0.1.0"
rubric_point_ids = ["ROBUSTNESS.REFUSAL.DONOTANSWER_SMOKE"]
# sha256 of the jsonl bytes — populated by build_lockfile.py at scaffold time.
sha256 = "ef919312913e9e19197427faf4ba54ade3788e446dcc7fa16960ced92fb2b3a5"

