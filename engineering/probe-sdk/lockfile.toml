[signing]
# R1 portal CA signer is the cto-attest-v1 Ed25519 key per the same
# discipline as the public probe ledger (BEAAA-4900). The SDK signs the
# envelope when --sign is passed; unsigned mode is default so DP
# users without BackBond-issued keys can still produce envelopes (CTO
# counter-signs on portal ingest).
algorithm = "Ed25519"
key_id = "cto-attest-v1"
key_path_default = "~/.config/backbond/keys/cto-attest-v1.json"

[determinism]
# Acceptance: spread = 0 on are_total + every pillar subscore across N=5
# runs on the fixture target with the same seed. `run_timestamp` is the
# one envelope field that may vary across runs; tests project it out
# before byte-equality comparison.
fixture_target_seed = 7
n5_replicates = 5
spread_threshold = 0

# Built once R1 contents settle.
