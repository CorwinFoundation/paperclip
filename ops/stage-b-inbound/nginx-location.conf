# Include inside the existing scanner.backbond.ai TLS server block.
location = /stage-b-demo/healthz {
    proxy_pass http://127.0.0.1:8788/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /stage-b-demo/mailgun/mime {
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:8788/mailgun/mime;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /stage-b-demo/receipts {
    proxy_pass http://127.0.0.1:8788/receipts$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
}
