# Include inside the existing scanner.backbond.ai TLS server block.
location = /stage-b-demo/healthz {
    proxy_pass http://127.0.0.1:8788/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /stage-b-demo/mailgun/mime {
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:8788/mailgun/mime;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /stage-b-demo/history/mailgun/mime {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8788/history/mailgun/mime;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /stage-b-demo/instinct/instruction/ {
    proxy_pass http://127.0.0.1:8788/instinct/instruction/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /stage-b-demo/instinct/report/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8788/instinct/report/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /stage-b-demo/instinct/grant {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8789;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /stage-b-demo/instinct/revoke {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8789;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /stage-b-demo/instinct/followups {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8789;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /stage-b-demo/instinct/followups/ {
    proxy_pass http://127.0.0.1:8788/instinct/followups/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /stage-b-demo/history {
    proxy_pass http://127.0.0.1:8789;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /stage-b-demo/receipts {
    proxy_pass http://127.0.0.1:8789/stage-b-demo/receipts;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /stage-b-demo/export {
    proxy_pass http://127.0.0.1:8789/stage-b-demo/export;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /stage-b-demo/onboard {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8789;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
