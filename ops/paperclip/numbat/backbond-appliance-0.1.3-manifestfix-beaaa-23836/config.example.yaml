# BackBond appliance config (example). Copy to config.yaml and set reader.path.
appliance_id: "vendor-agent-prod-01"       # synthetic example; unique per deployment
evidence_tier: "log-inferred"              # BackBond-assigned; do not raise without verification

reader:
  name: "ndjson_log"                        # ndjson_log | codex_rollout | synthetic_engine
  path: "/data/events.ndjson"               # mounted substrate path (READ-ONLY)

rules:
  pack: "growth_agent.cel.yaml"             # CEL packs (production): growth_agent.cel.yaml | coding_agent.cel.yaml
  allowlist: null                           # e.g. paperclip_allowlist.cel.yaml for the fleet

signing:
  key_path: "~/.backbond/appliance.key"     # Ed25519 private key (generated on first run, 0600)
  key_id: "vendor-agent-prod-01-key"

state_dir: "~/.backbond/state"              # chain + idempotency state

ship:
  mode: "outbox"                            # "outbox" (files) or "http"
  outbox_dir: "~/.backbond/outbox"
  url: ""                                    # set for mode:http; token via BACKBOND_SHIP_TOKEN env
  max_events_per_batch: 5000                 # P0-1 windowing — split large runs into chained batches
  gzip: true                                 # P0-4 gzip the HTTP body
  retries: 4                                 # P0-4 bounded retries with exponential backoff
  backoff_base_sec: 0.5
  timeout_sec: 30

producer:                                    # contract-v1.0 pin set
  collector_version: "appliance-0.1.3"
  evidence_profile_version: "1.0"
  scanner_version: "na-appliance"
  corpus_version: "na-appliance"
  rule_pack_version: "0.1"
  seed: 0
