# BEAAA-24049 -- staged drop-in for pm2-beai-agent.service. NOT APPLIED.
#
# Install path: /etc/systemd/system/pm2-beai-agent.service.d/10-control-plane-protection.conf
# Requires root. This account (uid 1001 beai-agent) has no sudo:
#   $ sudo -n true  ->  "sudo: a password is required"
# Applying this is a shared/live mutation and needs the Founder/host-admin
# authorization and QA gate named on BEAAA-24049.
#
# Baseline actually observed on the host at 2026-08-17T19:3xZ (systemctl show):
#   CPUWeight=[not set]  MemoryHigh=infinity  MemoryMax=infinity
#   MemorySwapMax=infinity  IOWeight=[not set]  OOMScoreAdjust=0
#   OOMPolicy=stop  Restart=on-failure  WatchdogUSec=0  Delegate=no
#   ControlGroup=/system.slice/pm2-beai-agent.service (443 tasks)
# Host: 8 cores, 15 GiB RAM, 4 GiB swap. Unit held 10.9 GiB + 1.19 GiB swap.

[Service]

# --- 1. Break the single-agent -> total-outage chain -------------------------
# This is the most important line in the file and it is a correctness fix, not
# a tuning knob. Today OOMPolicy=stop means a kernel OOM kill of ANY process in
# this cgroup -- including a disposable agent seat -- stops the entire unit.
# Because systemd treats that as a clean stop, Restart=on-failure does NOT
# bring it back. One OOM-killed agent can therefore permanently down the
# control plane. `continue` scopes the blast radius to the killed process.
OOMPolicy=continue

# --- 2. Make the control plane an unattractive OOM victim -------------------
# OOMScoreAdjust applies to the unit's main process and is inherited by
# children, so it cannot by itself rank the listener below the seats; the
# agent-priority-warden raises the seats to +500 at runtime. Setting the unit
# floor negative requires CAP_SYS_RESOURCE, which only root can grant here.
OOMScoreAdjust=-500

# --- 3. Bound memory so pressure surfaces as reclaim, not swap death ---------
# The observed stall was IO, not CPU: PSI io full avg300=17.86% while cpu full
# was 0.00%. Load 35 on 8 cores was D-state on swap, not runnable demand. With
# vm.overcommit_memory=1 and no cgroup bound, nothing applies back-pressure.
# MemoryHigh throttles and reclaims before the swapfile is exhausted.
MemoryHigh=9G
MemoryMax=11G
# The decisive lever. Capping swap converts a slow global IO stall -- which
# takes the listener down with it -- into a bounded local reclaim.
MemorySwapMax=2G

# --- 4. Give the control plane priority for CPU and IO ----------------------
# NOTE: on their own these do NOT satisfy the isolation requirement, and the
# BEAAA-24049 acceptance criteria say so correctly. Weighting is relative
# BETWEEN units; the listener and the agent seats that starve it are inside
# THIS unit, so a unit-level weight cannot separate them. These values only
# protect the unit against dockerd/kubelet/containerd, which are real
# co-tenants here (kube-apiserver 368 MiB, kubelet 233 MiB, dockerd 178 MiB).
CPUWeight=300
IOWeight=300

# --- 5. Enable the actual isolation ----------------------------------------
# Delegate=yes hands the subtree to uid 1001, which is what lets the
# unprivileged warden create and populate:
#   pm2-beai-agent.service/control/   <- node listener + embedded postgres
#   pm2-beai-agent.service/agents/    <- every claude/codex seat, capped
# This is the only mechanism that genuinely isolates the listener from its own
# load generators without patching the Paperclip server's spawn path. Without
# this line the split is impossible and items 3-4 are only partial mitigation.
Delegate=yes

# --- 6. Bound the process explosion ----------------------------------------
# TasksMax was 19144 (effectively unbounded); the unit was running 443 tasks
# across ~15 agent seats and their pytest/curl/mempalace subtrees.
TasksMax=2000

# Rollback: see ../ROLLBACK.md. Removing this file and running
#   systemctl daemon-reload && systemctl restart pm2-beai-agent.service
# restores the exact baseline above. Every directive here is additive; none
# overwrites an existing configured value, because none was set.
