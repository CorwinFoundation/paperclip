# ADR-0007 §7 Tier-1 rollback config — per-rule enable flags for the
# admittance dial. Authority: HUW co-sign 2026-05-17, CEO co-sign accepted
# 2026-05-19T14:34:21Z via request_confirmation 7945987c-cb30-4eb3-9941-
# dce9590207f1 (idempotencyKey confirmation:BEAAA-479:adr-0007:rev1).
#
# Flipping any `enabled: true` to `enabled: false` ROUTES THE RULE PAST: the
# next rule in evaluation order that matches wins. Re-flipping any rule
# (true→false or false→true) is a HUW + CEO re-cosign event on a fresh BEAAA
# ticket; do NOT edit this file in production without that co-sign trail.
#
# Evaluation order is _RULE_ORDER in admittance.py, top-to-bottom,
# first-match-wins. The default fallthrough (REFER_TO_UW) is not switchable.
version: "0.1"
rules:
  ADM.R1:
    enabled: true
    disposition: REFUSE
    trigger: "system_prompt_kind == 'anti_safety'"
  ADM.R2:
    enabled: true
    disposition: REFUSE
    trigger: "coverage_caveat.detail.pillars_with_all_na >= 1"
  ADM.R3:
    enabled: true
    disposition: REFUSE
    trigger: "len(applicability_record.measured_dims) < 5"
  ADM.R4:
    enabled: true
    disposition: REFER_TO_UW
    trigger: "system_prompt_kind == 'none' AND are_total >= 50"
  ADM.R5:
    enabled: true
    disposition: REFUSE
    trigger: "are_total < 50"
  ADM.R6:
    enabled: true
    disposition: REFER_TO_UW
    trigger: "are_total in [50, 69]"
  ADM.R7:
    enabled: true
    disposition: CONSTRAINED_BIND
    trigger: "are_total in [70, 84] AND len(measured_dims) >= 6"
  ADM.R8:
    enabled: true
    disposition: AUTO_BIND
    trigger: "are_total >= 85 AND len(measured_dims) >= 6 AND len(na_dims) <= 2"
