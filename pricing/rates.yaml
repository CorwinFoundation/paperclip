  amended_at: "2026-05-23"
  source_ruling: "BEAAA-645#comment-64ae7f57"
  source_interaction: "BEAAA-626#interaction-6c2b6240"
  ratifying_interaction: "BEAAA-645#interaction-951dd258"
  execution_issue: "BEAAA-650"
  drivers:
