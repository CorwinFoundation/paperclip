# Pricing v1 rate tables — frozen 2026-04-30 (BEAAA-10 pricing-v1 §2-§8).
# v1.1 amendment 2026-05-23 (BEAAA-650): C/D BandFactor recal per Founder
# ratification on BEAAA-645 Q2 (interaction `951dd258`, CEO ack cmt `64ae7f57`).
# Source: Actuary pressure-test-v0 (BEAAA-255 doc rev `ca1e575a`) §6.1
# indicative recal — Supreme Law LR>0.7/segment escalation on C-band
# (140.2% structural / 82.4% limit-factored) and D-band (175.7% / 103.4%).
# Recal restores LR compliance (C ~59%, D ~62% under LimitFactor 1.70).
# v1.1.1 addendum 2026-05-23 (BEAAA-669): §8 d_band_layered_excess_min_retention
# = $50K bind-eligibility floor. HoUW ratification BEAAA-666 §1(b); op-seat
# concur BEAAA-667. UW-guideline / referral-threshold (HoUW unilateral per
# underwriter-os.md §DECISION AUTHORITY) — bind-eligibility addendum only,
# no factor change, no scoring-math touch, no N=5 calibration required.
# Encoded directly from the doc; quote.py applies the formula.
# Annual Premium = BaseRate × AREBandFactor × ModifierFactor × SectorFactor × RevenueFactor × LimitFactor × Aggregate

version: "1.1.1"
frozen_at: "2026-04-30"
amended_at: "2026-05-23"
base_rate_usd: 25000
aggregate: 1.10

# §3 — letter band factors. Keyed to BEAAA-57 12-band cuts.
# v1.1 (2026-05-23): C 1.80→2.50, D 3.00→5.00. Founder-ratified per
# BEAAA-645 Q2; audit block at §11 below.
band_factor:
  A: 0.60
  B: 1.00
  C: 2.50  # v1.1 recal (was 1.80 in v1.0) — see §11
  D: 5.00  # v1.1 recal (was 3.00 in v1.0) — see §11; decline/layered-excess only

# §4 — sector factors. OTHER routes to manual underwriting.
sector_factor:
  ENT_SAAS: 1.00
  B2B_AI_SAAS: 1.10
  RETAIL_CONSUMER: 1.25
  INDUSTRIAL: 1.35
  HEALTHCARE: 1.40
  LEGAL: 1.45
  FINSERV: 1.50
  PUBLIC_SECTOR: 1.50

# §5 — revenue bands. Convention: [min_usd, max_usd_exclusive). Boundary value
# (e.g. exactly $250M) sits in the higher band — verified against pricing-v1 §9
# Profile 5 ($250M → factor 1.30, not 1.00).
# null factor = manual referral.
revenue_bands:
  - { min_usd: 0,            max_usd_excl: 10000000,    factor: 0.70, label: "<$10M" }
  - { min_usd: 10000000,     max_usd_excl: 50000000,    factor: 0.85, label: "$10M-$50M" }
  - { min_usd: 50000000,     max_usd_excl: 250000000,   factor: 1.00, label: "$50M-$250M" }
  - { min_usd: 250000000,    max_usd_excl: 1000000000,  factor: 1.30, label: "$250M-$1B" }
  - { min_usd: 1000000000,   max_usd_excl: 5000000000,  factor: 1.75, label: "$1B-$5B" }
  - { min_usd: 5000000000,   max_usd_excl: null,        factor: null, label: ">$5B (manual)" }

# §6 — limit tiers. Match exactly on (per_claim_usd, aggregate_usd) pair.
limit_tiers:
  - { per_claim_usd: 500000,    aggregate_usd: 1000000,   factor: 0.60 }
  - { per_claim_usd: 1000000,   aggregate_usd: 2000000,   factor: 1.00 }
  - { per_claim_usd: 2000000,   aggregate_usd: 5000000,   factor: 1.70 }
  - { per_claim_usd: 5000000,   aggregate_usd: 10000000,  factor: 2.75 }
  - { per_claim_usd: 10000000,  aggregate_usd: 20000000,  factor: 4.20 }

# §8 — endorsements (additive, in USD). Remediation auto-applies for letter C bind.
endorsements:
  remediation:                { load_usd: 2500,  description: "Remediation endorsement (Band C bind requirement)" }
  regulatory_fines_buyback:   { load_usd: 5000,  description: "Regulatory-fines buyback (where insurable), sub-limit $100K" }
  harness_bump_waiver:        { load_usd: 1500,  description: "Harness version bump re-bind waiver (client opt-in)" }
  d_band_layered_excess_min_retention:
    min_retention_usd: 50000
    applies_to_band: "D"
    bind_eligibility_floor: true
    description: |
      Layered-excess D-band bind-eligibility minimum retention. Subject must
      carry at least $50K self-insured retention before any IFA layered-excess
      attachment. Anchored on Silver-tier per-incident limit (OnePager v1.3).
    cosign_chain:
      head_of_uw_ratification: "BEAAA-666#section-1"
      uw_operational_landing:  "BEAAA-667"
      authority_basis: "underwriter-os.md §DECISION AUTHORITY — UW-guideline / referral-threshold (HoUW unilateral)"

# §9 — live_probe rate-book policy v1.0 (BEAAA-536, filed 2026-05-18).
# Consumed only when score.scan_mode == "live_probe". offline_replay scans are
# byte-identical pre/post this addendum — the live_probe block is a no-op on
# the legacy path. Co-sign chain: op-seat Underwriter authored on BEAAA-536
# #9f0f31e5-ed5e-404b-ae33-325e7a552d39; Head of UW & AI Risk countersigned
# ACCEPT-all-three-rules on BEAAA-537 #c8eb13e2-6491-4748-bb74-df5f55eedad7
# (2026-05-18T19:48Z) per Supreme Law (rule change → strategic seat).
live_probe:
  policy_version: "1.0"
  filed_at: "2026-05-18"
  contract_dependency: "are-scanner-api-v1@v1.1.0"
  uw_operational_filing_ref: "BEAAA-536#comment-9f0f31e5-ed5e-404b-ae33-325e7a552d39"
  head_of_uw_cosign_ref: "BEAAA-537#comment-c8eb13e2-6491-4748-bb74-df5f55eedad7"
  # Loading-factor curve on spread_per_dim. Spread is observed (max - min)
  # across the K replicates per rubric_point_id, in raw rubric-point units
  # (each dim raw is 0..4 per rubric.yaml). Piecewise-linear between the
  # named breakpoints; factor floors at 1.00 and caps at the segment endpoint.
  loading_curve:
    breakpoints:
      - { spread: 0.50, factor: 1.00 }   # below this, no load
      - { spread: 1.00, factor: 1.05 }   # mild jitter — 5% load
      - { spread: 1.50, factor: 1.15 }   # near critical-pillar refuse — 15% load
      - { spread: 2.00, factor: 1.30 }   # at hygiene-pillar refuse — 30% load
    # Aggregation across dims to a single spread_load_factor. "max" applies
    # the worst-dim load; "max" picked over "product" for v1.0 because per-dim
    # refuse-to-quote thresholds already gate the worst-dim case, and product
    # over 24 dims would systematically over-load even tight scans.
    aggregation: "max"
    cap: 1.50   # ceiling on aggregated spread_load_factor
  # Per-dim refuse-to-quote thresholds — tighter than the contract-level
  # spread_per_pillar > 2 / spread_total > 2 gates. Refuse-to-quote on this
  # path surfaces as ManualReferral, mirroring the existing "no pricing
  # without evidence trail" UW Hard Guarantee #1 enforcement.
  refuse_to_quote_per_dim:
    # Critical-pillar set rationale: P1 (OPS / hallucination) drives loss
    # frequency; P2 (BIAS_FAIRNESS) drives discrimination-claim exposure;
    # P3 (ROBUSTNESS) drives adversarial-failure exposure and already has
    # per-dim bind-blocking floors (rubric.yaml §pillar_floors). P4
    # (GOVERNANCE) is hygiene — its weak-link risk is pillar-level only.
    critical_pillars: ["P1", "P2", "P3"]
    hygiene_pillars: ["P4"]
    critical_threshold: 1.5   # per-dim spread above this on P1/P2/P3 = refuse
    hygiene_threshold: 2.0    # per-dim spread above this on P4 = refuse
  # K-replicate selection policy. K=5 default; K=10 mandatory when any
  # condition fires. Caller (quote requestor) MUST set k_replicates=10 on
  # the upstream /score request before /quote arrives for these cases.
  # quote.py enforces by recording the requested-vs-required K on the
  # quote breakdown — caller mismatch surfaces as a soft warning, not a
  # hard refuse-to-quote (the band-exceed gate catches the substantive
  # case where the looser K=5 spread blew through thresholds anyway).
  k_replicate_selection:
    default_k: 5
    mandatory_k10_conditions:
      - revenue_tier_gte_t3                   # customer.annual_revenue_usd >= $50M
      - prior_midterm_rescan_trigger          # any prior policy on this agent saw a re-scan trigger fire
      - customer_attests_model_change_in_term # customer attests model deployment change within policy term
  # Filed-rate posture. Per UW Hard Guarantee #3 ("Band-to-premium mapping
  # is filed"), this addendum must be filed before binding the first
  # live_probe-bound policy. Phase 1 stays in non-admitted / surplus-lines
  # posture (rate filing not required pre-bind per underwriter-os.md
  # filed-rate posture); this artifact is the binding rate book of record.
  filing_status: "filed_internal_rate_book"
  filed_artifact_uri: "projects/are-scanner/artifacts/beaaa-536/rate-book-policy-v1.0.md"

