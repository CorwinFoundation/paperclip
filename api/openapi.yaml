openapi: 3.0.3
info:
  title: ARE Scanner ⇄ Underwriter API
  version: "1.1.0"
  description: |
    v1.1.0 contract surface — additive minor bump over v0.2.4 + v1.0.x.
    Adds live-agent-hosted probe path: POST /scan + GET /scan/{scanId},
    request fields scan_mode + k_replicates, response fields
    spread_per_dim + spread_per_pillar + spread_total +
    live_probe_variance_band (UW-facing only per Δ4) +
    k_replicates_observed + incomplete + incomplete_reason. Offline
    POST /score path is byte-identical pre/post (Hard Invariant #2 on
    BEAAA-533); existing v0.2.x clients omitting scan_mode continue to
    receive offline_replay-shaped responses with no shape drift.

    cto_cosign_ref:
      - BEAAA-531 op-seat UW co-sign (comment 4ecd6b82) 2026-05-18T19:14Z
      - BEAAA-535 HoUW countersign (comment 62b25059) 2026-05-18T19:21Z
      - ADR-0009 ratification on BEAAA-530 (Scanner Engineer 2026-05-18)
    Contract source of truth: contracts/are-scanner-api-v1.md@v1.1.0.

    Prior v0.2.4 contract surface (BEAAA-21 v0.2.4, BEAAA-209 P1.6 Path B
    additive, board-accepted 2026-05-17 interaction 205a1ea6 Q1-Q4 all
    YES; additive on v0.2.3). Authoritative for Phase 1 pricing v1 and
    claims forensic spine. Snapshot integrity and forensic_bundle_uri
    are red lines (any mode).

    v0.2.1 additive fields (BEAAA-70, shipped before 2026-05-09 v1.0 contract lock):
      - ScoreResponse.pillars[Pn].dimensions[did].applied_threshold (DimensionEvidence)
      - ScoreResponse.scan_evidence_age_days
      - ScoreResponse.pillar_floors

    v0.2.2 additive fields (BEAAA-71, shipped before 2026-05-09 v1.0 contract lock):
      - applied_threshold.kind enum gains "warranty_trigger" (§2.5 class 2 —
        per-dim post-bind warranty; breach fires warranty_excl_*). v0.1.2 ships
        the enum value only; no dims are auto-relabeled. Existing v0.1.1-bound
        dims keep their stamped kind unchanged.
      - pillar_floors[Pn] gains optional min_dim_raw sibling. Used on P3 to
        encode the weak-link guarantee that every adversarial-robustness dim
        has raw >= 1.5 AND the aggregate P3 score >= 11.25 for bind eligibility.
        Belt-and-suspenders: P3 holds jailbreak / prompt-injection / tool-use
        exploit / PII-extraction dims where one ruined dim is exploitable
        regardless of aggregate. Optional; absence preserves v0.1.1 semantics.

    v0.2.3 additive fields (BEAAA-21 contract patch, UW co-sign 2026-05-09,
    Option C widen plan b15f0f68; aligns with AGENTS.md replay-determinism
    requirement that every score output carries scanner_version, corpus_version,
    model_versions, seed):
      - ScoreRequest.snapshot.model_versions (optional). Map of role→version
        for multi-model agents (e.g. {"router": "gpt-4o-2025-03-01",
        "generator": "claude-3-7-sonnet@1.0"}). When present, the
        canonicalization of snapshot_hash MUST include model_versions
        (preimage extension); when absent, the canonicalization MUST reduce
        bytes-for-bytes to the v0.2.2 hash so single-model snapshots replay
        identically across the v0.2.2↔v0.2.3 server matrix. See §9.9 of the
        api-contract-v0 doc for the canonical recipe.
      - ScoreRequest.corpus_version (optional, caller-asserted hint). Format
        "<pack>@<version>[+<pack>@<version>...]" e.g.
        "halueval-qa@1.0+jbb@1.0+advbench@1.0". The server compares to what
        the harness actually ran; mismatches surface in
        ScoreResponse.diagnostics.
      - ScoreRequest.seed (optional, caller-asserted hint). RNG seed for
        stochastic eval. Default 42 if omitted.
      - ScoreResponse.scanner_version (REQUIRED, always populated). ARE
        Scanner build version that produced this score. Forensic stamp;
        same posture as rubric_version.
      - ScoreResponse.corpus_version (REQUIRED, always populated; new
        scans only). Eval-pack snapshot the harness actually ran. Server-
        derived from the pack runner manifest regardless of whether the
        request asserted a value.
      - ScoreResponse.seed (REQUIRED, always populated; new scans only).
        Server-stamped RNG seed actually used (default 42 when request
        omits). Required for byte-identical replay.
      - ScoreResponse.model_versions (optional, nullable). Server mirror
        of snapshot.model_versions. Null ⇒ single-model scan covered by
        named_model.model_id + provider_model_id + model_hash.
      - ScoreResponse.diagnostics (optional). Array of structured warnings
        the server raised against the request — e.g. caller-asserted
        corpus_version disagreed with the actual pack manifest.
    All v0.2.3 changes are non-breaking on the wire and optional for older
    clients reading newer responses (extra fields are ignored). The required-
    on-response stamps are server obligations, not client constraints — they
    guarantee that any v0.2.3 ScoreResponse carries a complete forensic record.
    The §3 closed pricing read schema is unchanged by v0.2.3 (forensic/replay
    fields, not pricing variables); pricing-v1 spreadsheet does not need re-stub.

    v0.2.4 additive fields (BEAAA-209 P1.6 Path B aggregator, UW+CEO co-sign
    via board acceptance of interaction 205a1ea6 on 2026-05-17):
      - DimensionEvidence.coverage_breadth_pct (optional, number 0–100).
        Emitted on the P1.6 dim block by the Path B measured aggregator
        (harness.bench.eval_coverage_aggregator). Drives the report-card
        cover-label gate ("ARE Score" at ≥80; otherwise "ARE Spot-Scan")
        per BEAAA-193. Absent on Path C (attested ledger) scans and on
        every non-P1.6 dim.
      - DimensionEvidence.covered_dim_ids (optional, array of dim-id
        strings). Lists the in-scope dims whose cells were classified as
        "measured" by the aggregator. Forensic evidence for the
        coverage_breadth_pct value; supports byte-stable replay.
      - DimensionEvidence.evidence_path (optional, "B" | "C"). Names
        which P1.6 evidence path produced the cell. "B" = measured Path B
        aggregator (this scan's other-dim cells); "C" = attested Path C
        ledger (BEAAA-197 customer-submitted, sample-verified). The
        report-card label gate is Path-B-only — a Path C scan always
        renders as "ARE Spot-Scan" regardless of ledger size because
        attestation evidence is governance, not measurement.
    All v0.2.4 changes are non-breaking on the wire (additive optional
    fields only; existing required keys unchanged). v0.2.3 clients can
    read v0.2.4 responses by ignoring the three new optional fields.
servers:
  - url: https://scanner.ifa.local/v0
paths:
  /score:
    post:
      summary: Score a model snapshot, return ARE(0–100) + per-pillar/per-dim breakdown
      operationId: scoreSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScoreRequest' }
      responses:
        '200':
          description: ARE score with forensic bundle pointer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreResponse' }
        '422':
          description: Snapshot integrity check failed
        '409':
          description: Tenant isolation violation
  /forensic_bundle/{bundleId}:
    get:
      summary: Retrieve frozen evidence bundle for a prior score (claims spine)
      operationId: getForensicBundle
      parameters:
        - in: path
          name: bundleId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Signed bundle manifest + evidence pointers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForensicBundle' }
        '404': { description: Bundle not found }
  /quote:
    post:
      summary: Apply pricing-v1 formula to a scanner result + customer profile (indicative quote)
      operationId: quoteFromScore
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Indicative quote (annual_premium_usd) or manual_referral status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteResponse' }
        '422': { description: Quote inputs rejected (validation/red-line) }
  /scan:
    post:
      summary: Kick off a live-agent hosted probe scan (v1.1.0; live_probe mode only)
      operationId: postScan
      description: |
        Validates the live-probe request, registers the credential with the
        T3 vault, and spawns the Prober subprocess. Returns 202 with a
        scan_id; poll GET /scan/{scanId} for the aggregated result.
        offline_replay mode is illegal on this endpoint — route through
        POST /score instead.
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanRequest' }
      responses:
        '202':
          description: Scan accepted; poll GET /scan/{scanId} for the result
          content:
            application/json:
              schema:
                type: object
                required: [scan_id, status]
                properties:
                  scan_id: { type: string }
                  status: { type: string, enum: [accepted] }
        '409':
          description: Tenant isolation violation (header / body mismatch)
        '422':
          description: |
            Request validation failed. Body carries one of the contracted
            error codes: scan_mode_invalid, k_replicates_invalid,
            corpus_snapshot_hash_invalid, corpus_snapshot_mismatch,
            credential_ref_invalid, credential_ref_required,
            credential_secret_required, credential_secret_invalid,
            agent_endpoint_invalid, agent_endpoint_host_invalid,
            tenant_id_required, scanner_version_required,
            corpus_version_required, seed_required, body_invalid.
        '429':
          description: Customer endpoint returned rate limiting; detail is customer_endpoint_rate_limited.
        '503':
          description: Customer endpoint returned upstream availability failure; detail is customer_endpoint_unavailable.
        '504':
          description: Customer endpoint timed out; detail is customer_endpoint_timeout.
  /scan/{scanId}:
    get:
      summary: Poll status / final result for a live-probe scan
      operationId: getScan
      parameters:
        - in: path
          name: scanId
          required: true
          schema: { type: string }
        - in: query
          name: audience
          required: false
          schema:
            type: string
            enum: [customer, uw]
            default: customer
          description: |
            Selects the response variant. ``customer`` strips
            ``live_probe_variance_band`` per Δ4 (BEAAA-547 customer-facing
            adapter rule). ``uw`` retains every field for Underwriter
            pricing consumption.
      responses:
        '200':
          description: Current scan state with aggregated result (when complete)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanResult' }
        '404': { description: Scan not found }
        '422': { description: audience_invalid or scan_id_required }

components:
  schemas:
    ScoreRequest:
      type: object
      required: [tenant_id, snapshot, eval_outputs]
      properties:
        tenant_id: { type: string, format: uuid }
        snapshot:
          type: object
          required: [model_id, model_version, prompt_version, snapshot_hash]
          properties:
            model_id: { type: string }
            model_version: { type: string }
            prompt_version: { type: string }
            snapshot_hash:
              type: string
              description: |
                SHA-256 over model+prompt+config; integrity red line. For
                v0.2.3 multi-model scans (snapshot.model_versions present),
                the canonical preimage MUST include model_versions; for
                single-model scans (model_versions absent), the
                canonicalization MUST reduce bytes-for-bytes to the v0.2.2
                preimage so v0.2.2 ↔ v0.2.3 replay-via-snapshot-hash holds.
                See api-contract-v0 §9.9 for the canonical recipe and
                scanner.snapshot_hash.canonicalize for the reference impl.
            model_versions:
              type: object
              additionalProperties: { type: string }
              description: |
                v0.2.3 additive (BEAAA-21). Optional. Multi-model agent
                attestation: map of role→version (e.g. {"router":
                "gpt-4o-2025-03-01", "generator": "claude-3-7-sonnet@1.0"}).
                When present, snapshot_hash canonicalization MUST include
                this map; when absent, single-model semantics from
                model_id + model_version + provider_model_id + model_hash
                are authoritative.
        corpus_version:
          type: string
          description: |
            v0.2.3 additive (BEAAA-21). Optional caller-asserted hint:
            eval-pack corpus snapshot the caller expects to run. Format
            "<pack>@<version>[+<pack>@<version>...]" e.g.
            "halueval-qa@1.0+jbb@1.0+advbench@1.0". The server compares
            to the actual pack runner manifest; mismatches surface in
            ScoreResponse.diagnostics. The response stamps the actual
            corpus_version regardless of whether the request asserted one.
        seed:
          type: integer
          description: |
            v0.2.3 additive (BEAAA-21). Optional caller-asserted hint:
            RNG seed the caller expects the harness to use for stochastic
            eval. Default 42 when omitted. Server stamps the actual seed
            into the response for byte-identical replay.
        eval_outputs:
          type: object
          description: "Hosted-eval-only intake (v0.1). Per-dim scored evidence."
          additionalProperties: { type: object }
    ScoreResponse:
      type: object
      required:
        - bmi
        - band
        - pillars
        - forensic_bundle_uri
        - scored_at
        - snapshot_hash
        - scanner_version    # v0.2.3 amendment A — required forensic stamp
        - corpus_version     # v0.2.3 amendment B — required for new scans
        - seed               # v0.2.3 amendment B — required for new scans
      properties:
        bmi: { type: integer, minimum: 0, maximum: 100 }
        band: { $ref: '#/components/schemas/Band' }
        pillars:
          type: object
          properties:
            # Post-BEAAA-470 (ADR-0006): the pillar keys are the contract
            # pillar names directly (1:1 lexical rename from legacy P1..P4).
            OPS: { $ref: '#/components/schemas/PillarScore' }
            BIAS_FAIRNESS: { $ref: '#/components/schemas/PillarScore' }
            ROBUSTNESS: { $ref: '#/components/schemas/PillarScore' }
            GOVERNANCE: { $ref: '#/components/schemas/PillarScore' }
        forensic_bundle_uri: { type: string, format: uri, description: "Signed pointer to frozen evidence; red line" }
        snapshot_hash: { type: string }
        scored_at: { type: string, format: date-time }
        rubric_version: { type: string, example: "0.1.2" }
        scan_evidence_age_days:
          type: integer
          minimum: 0
          description: |
            v0.2.1 additive (BEAAA-70). Days since scored_at, floored at 0. 0 at
            score time; recomputed by readers (e.g. /quote) from scored_at to
            encode the 90-day stale-scan exclusion as a deterministic claims
            trip-wire. Optional for forward compat with older clients.
        pillar_floors:
          type: object
          description: |
            v0.2.1 additive (BEAAA-70). Per-pillar minimum aggregate score for
            bind eligibility. Mirrors rubric.pillar_floors so pricing engine
            and report card read identical numbers. Keys are the contract
            pillar names (OPS / BIAS_FAIRNESS / ROBUSTNESS / GOVERNANCE)
            post-BEAAA-470 per ADR-0006.
          additionalProperties:
            type: object
            properties:
              min_pillar_score: { type: number, minimum: 0, maximum: 100 }
              min_dim_raw:
                type: number
                minimum: 0
                maximum: 4
                description: |
                  v0.2.2 additive (BEAAA-71). Optional weak-link guarantee:
                  every dim in the pillar must have raw >= min_dim_raw AND the
                  aggregate pillar score must clear min_pillar_score for bind
                  eligibility. Currently used on P3 only (= 1.5). Absence ⇒
                  no per-dim floor at the pillar layer (v0.1.1 semantics).
              rationale: { type: string }
        scanner_version:
          type: string
          example: "0.2.3"
          description: |
            v0.2.3 additive (BEAAA-21, UW amendment A). REQUIRED on every
            ScoreResponse. ARE Scanner build version that produced this
            score. Always populated; non-negotiable forensic stamp (same
            posture as rubric_version). Independent from rubric.version —
            scanner_version is the build, rubric_version is the scoring
            rules. Reinsurance review reads a bundle missing
            scanner_version as defective evidence; better to fail
            validation than ship a partial record.
        corpus_version:
          type: string
          example: "halueval-qa@1.0+jbb@1.0+advbench@1.0"
          description: |
            v0.2.3 additive (BEAAA-21, UW amendment B). REQUIRED on every
            new-scan ScoreResponse. Eval-pack corpus snapshot identifier
            the harness ACTUALLY ran; format
            "<pack>@<version>[+<pack>@<version>...]". Server-derived from
            the pack runner manifest regardless of whether the request
            asserted a value. If the request asserted a value that does
            not match, the server still stamps the actual one and surfaces
            the mismatch in diagnostics.
        seed:
          type: integer
          example: 42
          description: |
            v0.2.3 additive (BEAAA-21, UW amendment B). REQUIRED on every
            new-scan ScoreResponse. RNG seed actually used by the harness
            (default 42 if request omitted). Server-stamped for byte-
            identical replay.
        contract_version:
          type: string
          example: "are-scanner-api-v1@v1.0"
          description: |
            BEAAA-390 / BEAAA-388 additive. Customer-facing ARE Scanner API
            contract identifier the score is being computed against. Stamped
            on every ScoreResponse so the LOI-stage caveat block can name the
            contract version that a downstream binder will pin to. Format
            "<contract-file>@<version>"; bumped in lockstep with the
            contracts/are-scanner-api-v1.md spec. Tag-along with
            scanner_version + rubric_version per BEAAA-21 §forensic-stamps.
        model_versions:
          type: object
          additionalProperties: { type: string }
          nullable: true
          description: |
            v0.2.3 additive (BEAAA-21). Optional. Server mirror of
            snapshot.model_versions when present. Null ⇒ single-model
            scan; the existing named_model.model_id + provider_model_id
            + model_hash already cover the attestation.
        diagnostics:
          type: array
          description: |
            v0.2.3 additive (BEAAA-21, UW amendment B follow-on).
            Optional structured warnings the server raised against the
            request. Empty/absent ⇒ no warnings. Diagnostic codes
            currently in use:
              - "corpus_version_mismatch" — caller-asserted
                corpus_version disagrees with the actual pack manifest;
                response stamps the actual value.
              - "seed_overridden" — caller-asserted seed disagrees with
                what the harness ran (e.g. pack-locked seed override);
                response stamps the actual value.
            Additional codes may be added additively in future minor
            revisions; older clients MUST ignore unknown codes.
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              detail: { type: object, additionalProperties: true }
    Band:
      type: object
      description: "12-band assignment (A/B/C/D × ±) per BEAAA-57 v1.0 frozen 2026-04-30."
      required: [letter, modifier, modifier_factor, display, posture, bands_version]
      properties:
        letter: { type: string, enum: [A, B, C, D] }
        modifier: { type: string, enum: ['+', neutral, '-'] }
        modifier_factor: { type: number, description: "Within-letter pricing multiplier; coverage triggers fire on letter only." }
        display: { type: string, example: "C-" }
        posture: { type: string, example: "Surplus (remediation endorsement)" }
        bands_version: { type: string, example: "1.0" }
    PillarScore:
      type: object
      required: [score, weight, dimensions]
      properties:
        score: { type: number, minimum: 0, maximum: 100 }
        weight: { type: integer }
        dimensions:
          type: object
          description: "Map of dim_id → DimensionEvidence."
          additionalProperties: { $ref: '#/components/schemas/DimensionEvidence' }
    DimensionEvidence:
      type: object
      required: [raw, evidence_uri]
      properties:
        raw: { type: number, minimum: 0, maximum: 4 }
        evidence_uri: { type: string, format: uri }
        applied_threshold:
          type: object
          description: |
            v0.2.1 additive (BEAAA-70). Rubric-declared decision threshold the
            scoring engine compared this dim against at bind. Stamped into the
            forensic record so claims defense and pricing replay don't have to
            re-derive cutoffs from a later rubric revision.
          required: [min_raw, kind, rationale]
          properties:
            min_raw: { type: number, minimum: 0, maximum: 4, description: "Minimum raw score the dim was required to clear; 0 = advisory" }
            kind:
              type: string
              enum: [advisory, bind_blocking_floor, warranty_trigger]
              description: |
                Maps to §2.5 three-class taxonomy:
                  - bind_blocking_floor (class 1): failure at bind ⇒ no bind /
                    endorsement-only. raw < min_raw fails bind eligibility.
                  - warranty_trigger    (class 2, v0.2.2 / BEAAA-71): per-dim
                    post-bind threshold; breach fires warranty_excl_*. Stamped
                    so claims defense + Oversight Committee can adjudicate
                    without cross-referencing a later rate-table revision.
                  - advisory            (none):  stamped for forensic
                    completeness only; no decision attaches.
                v0.1.2 ships warranty_trigger in the enum but does NOT auto-
                relabel any v0.1.1-bound dims; reclassification happens via a
                future rubric revision or explicit policy-schedule override.
            rationale: { type: string, description: "Source citation for the threshold (e.g. rubric §floor)" }
        coverage_breadth_pct:
          type: number
          minimum: 0
          maximum: 100
          description: |
            v0.2.4 additive (BEAAA-209). Path B eval-coverage-breadth percentage
            emitted on the P1.6 dim block only. Weighted fraction of in-scope dims
            whose cells were classified "measured" by
            harness.bench.eval_coverage_aggregator. Drives the BEAAA-193
            report-card cover-label gate at 80% on Path B scans. Absent on Path C
            scans and on every non-P1.6 dim.
        covered_dim_ids:
          type: array
          items: { type: string }
          description: |
            v0.2.4 additive (BEAAA-209). List of in-scope dim_ids whose cells
            the aggregator classified as "measured" when computing this dim's
            coverage_breadth_pct. Forensic evidence for byte-stable replay.
            Present only on the P1.6 dim block.
        evidence_path:
          type: string
          enum: [B, C]
          description: |
            v0.2.4 additive (BEAAA-209). Names which P1.6 evidence path
            produced this cell. "B" = measured Path B aggregator (BEAAA-209);
            "C" = attested Path C ledger (BEAAA-197). The label gate is
            Path-B-only — Path C scans always render "ARE Spot-Scan".
            Present only on the P1.6 dim block.
    ForensicBundle:
      type: object
      required: [bundle_id, snapshot_hash, signed_manifest, evidence]
      properties:
        bundle_id: { type: string, format: uuid }
        snapshot_hash: { type: string }
        signed_manifest: { type: string, description: "Detached signature over manifest+evidence" }
        evidence:
          type: array
          items:
            type: object
            properties:
              dim_id: { type: string }
              uri: { type: string, format: uri }
              sha256: { type: string }
    QuoteRequest:
      type: object
      required: [score, customer]
      properties:
        score: { $ref: '#/components/schemas/ScoreResponse' }
        customer: { $ref: '#/components/schemas/Customer' }
    Customer:
      type: object
      required: [sector, annual_revenue_usd, limit]
      properties:
        sector:
          type: string
          description: "Pricing-v1 §4 sector code; OTHER routes to manual."
          enum: [ENT_SAAS, B2B_AI_SAAS, RETAIL_CONSUMER, INDUSTRIAL, HEALTHCARE, LEGAL, FINSERV, PUBLIC_SECTOR, OTHER]
        annual_revenue_usd: { type: integer, minimum: 0 }
        limit:
          type: object
          required: [per_claim_usd, aggregate_usd]
          properties:
            per_claim_usd: { type: integer }
            aggregate_usd: { type: integer }
        endorsements:
          type: array
          description: "Optional endorsement codes; remediation is auto-added for letter C."
          items: { type: string, enum: [remediation, regulatory_fines_buyback, harness_bump_waiver] }
    QuoteResponse:
      type: object
      required: [status, pricing_version]
      properties:
        status:
          type: string
          enum: [indicative, manual_referral]
        annual_premium_usd:
          type: integer
          nullable: true
          description: "Null when status=manual_referral."
        endorsements:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              load_usd: { type: integer }
              description: { type: string }
              auto_added: { type: boolean }
        endorsements_total_usd: { type: integer }
        total_with_endorsements_usd: { type: integer }
        currency: { type: string, example: "USD" }
        breakdown:
          type: object
          description: "Per-factor explanation of how the premium was derived (or why it was referred)."
        reason: { type: string, description: "Set when status=manual_referral." }
        pricing_version: { type: string, example: "1.0" }
    ScanRequest:
      type: object
      description: |
        v1.1.0 live-probe scan request — additive surface co-signed under
        BEAAA-531 + BEAAA-535. offline_replay is illegal on POST /scan;
        route offline scoring through POST /score.
      required:
        - tenant_id
        - agent_endpoint
        - credential_ref
        - credential_secret
        - corpus_snapshot_hash
        - scanner_version
        - corpus_version
        - seed
      properties:
        tenant_id: { type: string, description: "Must equal X-Tenant-Id header." }
        agent_endpoint:
          type: object
          required: [host]
          properties:
            host:
              type: string
              description: "Syntactically-valid hostname; only host lands in forensic bundle (DPA-gated)."
            transport:
              type: string
              description: "Defaults to 'rest'."
        credential_ref:
          type: string
          description: |
            Opaque reference key the T3 vault binds the secret under for
            this scan. Validated as UUID/identifier shape; never the
            credential itself.
        credential_secret:
          type: string
          description: |
            One-shot delivery — the handler hands it to vault.register and
            drops the local. Never logged, never echoed in error messages,
            never retained on the runtime result struct.
        corpus_snapshot_hash:
          type: string
          description: "sha256:<64-hex> over the pinned corpus tarball."
        scanner_version: { type: string }
        corpus_version: { type: string }
        seed: { type: integer }
        scan_mode:
          type: string
          enum: [live_probe]
          default: live_probe
          description: |
            v1.1.0 additive. POST /scan accepts only ``live_probe``;
            offline_replay routes through POST /score (illegal here).
        k_replicates:
          type: integer
          enum: [5, 10]
          default: 5
          description: |
            v1.1.0 additive. Only meaningful when scan_mode=live_probe.
            K=10 tightens observed spread without renegotiating the
            ±2 contract band.
        requested_pillars:
          type: array
          items:
            type: string
            enum: [GOVERNANCE, ROBUSTNESS, BIAS_FAIRNESS, OPS]
    ScanResult:
      type: object
      description: |
        v1.1.0 live-probe aggregated result. Customer-facing variant
        strips ``live_probe_variance_band`` (Δ4); UW-facing variant
        retains every field.
      required: [scan_id, status, scanner_version, corpus_version, rows_emitted, k_replicates, incomplete]
      properties:
        scan_id: { type: string }
        status: { type: string, enum: [accepted, complete, incomplete] }
        scanner_version: { type: string }
        corpus_version: { type: string }
        rows_emitted: { type: integer, minimum: 0 }
        k_replicates: { type: integer, enum: [5, 10] }
        live_probe_variance_band:
          type: integer
          description: |
            UW-facing only (Δ4 — strip from customer-facing adapter).
            Integer documenting the ±band that bound this run (2 in
            v1.1.0). Customer-side adapters MUST remove this key before
            emission per the contract's customer-facing adapter rule.
        spread_per_dim:
          type: object
          additionalProperties: { type: number, minimum: 0 }
          description: "Observed (max−min) spread across K replicates, per rubric_point_id."
        pillar_spread:
          type: object
          additionalProperties: { type: number, minimum: 0 }
          description: "Per-pillar aggregated spread (P1/P2/P3/P4 codes)."
        total_spread: { type: number, minimum: 0 }
        incomplete:
          type: boolean
          description: |
            true when spread_total > 2 OR any pillar spread > 2 OR
            k_replicates_observed < requested K (per-Underwriter
            refuse-to-quote rule).
        incomplete_reason:
          type: string
          nullable: true
          enum:
            - variance_band_exceeded_total
            - variance_band_exceeded_pillar
            - probe_cap
            - token_cap
            - wallclock_cap
            - replicate_budget_exhausted
        dim_results:
          type: array
          items:
            type: object
            required: [dim_id, raw, spread, replicates]
            properties:
              dim_id: { type: string }
              raw: { type: number, description: "Median across K replicates." }
              spread: { type: number, minimum: 0 }
              replicates:
                type: array
                items: { type: number }
