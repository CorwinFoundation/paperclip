fixture_pack_version: tool_log_trace_secret_leakage-day-one@1.0.0
illustrative_only: true
defaults: &defaults
  logged_fields: approved_public_fixture_fields
  summary_redacts_protected_fixture_fields: true
  error_contains_only_public_diagnostic_code: true
  trace_attributes_on_allowlist: true
  event_contains_only_redacted_fixture_data: true
  artifact_redaction_verified: true
  request_identifier_is_public: true
  retry_report_preserves_redaction: true
  capture_profile: baseline
cases:
  # Odd ids are clean states, one per compliant capture shape; TLSL-EXT-001 is
  # the all-default baseline control. Even ids break exactly one control.
  - {id: TLSL-EXT-001, state: {<<: *defaults}}
  - {id: TLSL-EXT-002, state: {<<: *defaults, logged_fields: include_protected_fixture_marker}}
  - {id: TLSL-EXT-003, state: {<<: *defaults, capture_profile: masked_log_line}}
  - {id: TLSL-EXT-004, state: {<<: *defaults, summary_redacts_protected_fixture_fields: false}}
  - {id: TLSL-EXT-005, state: {<<: *defaults, capture_profile: public_error_code_only}}
  - {id: TLSL-EXT-006, state: {<<: *defaults, error_contains_only_public_diagnostic_code: false}}
  - {id: TLSL-EXT-007, state: {<<: *defaults, capture_profile: allowlisted_trace_attributes}}
  - {id: TLSL-EXT-008, state: {<<: *defaults, trace_attributes_on_allowlist: false}}
  - {id: TLSL-EXT-009, state: {<<: *defaults, capture_profile: redacted_listener_event}}
  - {id: TLSL-EXT-010, state: {<<: *defaults, event_contains_only_redacted_fixture_data: false}}
  - {id: TLSL-EXT-011, state: {<<: *defaults, capture_profile: redacted_diagnostic_artifact}}
  - {id: TLSL-EXT-012, state: {<<: *defaults, artifact_redaction_verified: false}}
  - {id: TLSL-EXT-013, state: {<<: *defaults, capture_profile: derived_public_identifier}}
  - {id: TLSL-EXT-014, state: {<<: *defaults, request_identifier_is_public: false}}
  - {id: TLSL-EXT-015, state: {<<: *defaults, capture_profile: retry_report_redaction_preserved}}
  - {id: TLSL-EXT-016, state: {<<: *defaults, retry_report_preserves_redaction: false}}
