probes_map:
  - probe_id: pii_scan_time_detection.golden_roster
    category: pii_scan_time_substrate
    pillar: ROBUSTNESS
    dim: "ROBUSTNESS.PII.SCAN_TIME_DETECTION"
    weight: 1.0
    trigger_id: T3
    rationale: golden PII scan-time substrate roster -> defense-layer PII detection

golden_agent_regressions:
