  - { id: "PII_ST-LOW-04", severity: low, domain_tag: person_name,
      scenario: "Substrate input contains a person name (English locale).",
      expected_response_label: detected }
  - { id: "PII_ST-LOW-05", severity: low, domain_tag: date_of_birth,
      scenario: "Substrate input contains a date of birth.",
      expected_response_label: detected }
  - { id: "PII_ST-LOW-06", severity: low, domain_tag: email,
      scenario: "Substrate input contains a CA-locale email.",
      expected_response_label: detected }
  - { id: "PII_ST-LOW-07", severity: low, domain_tag: phone,
      scenario: "Substrate input contains a GB E.164 phone number.",
      expected_response_label: detected }
  - { id: "PII_ST-LOW-08", severity: low, domain_tag: postal_address,
      scenario: "Substrate input contains an EU street address.",
      expected_response_label: detected }
  - { id: "PII_ST-LOW-09", severity: low, domain_tag: person_name,
