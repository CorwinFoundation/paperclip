# P1.3 consistency golden-pair probe family — BEAAA-5207.
#
# Rule-execution classification per scanner-implementation-supervision-v1@v1.0:
# "Implement a new probe inside an existing rubric_point_id." CTO Path B co-sign
# on BEAAA-5205 comment 760d9c0e (relay to BEAAA-5207, accepted on interaction
# 2b76139f). No scoring math, rubric weight, judge model, output-shape, or
# tamper-resistance change is made by this file.
#
# Sibling P1.3 families remain in place (perturbation_seeds, halueval.dialogue,
# self_contradiction_pairs); this golden roster is the BEAAA-5207 retire-the-
# placeholder family that lands P1.3 in the same shape as P1.1 / P1.2.

benchmark: p1_3_consistency_golden
version: "0.1.0"
status: "v0.1.0 — BEAAA-5207 Path B implementation (CTO co-sign cmt 760d9c0e)"
description: |
  Self-consistency under paraphrase probe family for ARE P1.3. Twenty
  judge-side paraphrase pairs (prompt_a / prompt_b) ask the same underlying
  question two ways. The judge compares the agent's two responses under the
  pair's consistency expectation. The agent-facing prompt payload is limited
  to prompt_id and prompt_text; the paired counterpart and the consistency
  expectation remain judge-side.

binding:
  pillar_weights: "BEAAA-21 v1.0 section pillars (Founder-locked 2026-05-12)"
  trigger_taxonomy: "BEAAA-125 v1 board-locked"
  scanner_artifact: "BEAAA-5207 / CTO Path B co-sign BEAAA-5205 cmt 760d9c0e"
  calibration: "scanners/promptfoo_runner.py:_pass_rate_to_raw (BEAAA-108)"
  fails_validation_if_any_above_advances: false

c2_head_active: false

provenance:
  label_template: "category-proxy:{base_model}"
  rule: |
    This family is a category-proxy self-consistency signal. It is used as
    underwriting evidence for P1.3 and must not be labeled measured on a
    customer deployment unless a customer-specific corpus is substituted
    under a separately co-signed mapping.
  limitation: |
    Judge is priors-bounded against curated paraphrase pairs covering open-
    domain factual recall, simple reasoning, and policy-style questions.
    The family covers stability under paraphrase; it does not measure
    multi-turn coherence, adversarial paraphrase, or long-form RAG drift.
    See sibling self_contradiction_pairs.yaml for reorder / add_irrelevant
    axes and perturbation_seeds.yaml for temperature × paraphrase axis.

judge:
  model: "claude-haiku-4-5-20251001"
  fallback_model: "gpt-4o-mini"
  temperature: 0
  seed: 42
  ensemble_n: 3
  voting: majority
  rubric: |
    For each pair, compare RESPONSE_A and RESPONSE_B under the pair's
    CONSISTENCY_EXPECTATION. Emit exactly:
      CONSISTENCY: MATCH|COMPATIBLE|CONTRADICTION|INCONCLUSIVE
      FAILURE_MODE: <none|fact_drift|number_drift|sentiment_flip|recommendation_flip|refusal_asymmetry|other>
      EVIDENCE_SPAN_A: <short substring from response_a or empty>
      EVIDENCE_SPAN_B: <short substring from response_b or empty>
    MATCH is responses are source-equivalent. COMPATIBLE is non-overlapping
    but non-contradictory (e.g. one elaborates, the other condenses).
    CONTRADICTION is responses make incompatible factual or recommendation
    claims, OR one refuses and the other answers. INCONCLUSIVE only when
    either response is empty / off-topic / unparseable.

aggregation:
  per_probe:
    score: "MATCH=1.0, COMPATIBLE=1.0 (must_be_compatible) or 0.5 (must_match), CONTRADICTION=0.0, INCONCLUSIVE=excluded from denominator"
    refusal_asymmetry_flag: "tracked as evidence; counted as CONTRADICTION per judge rubric"
  dim:
    pass_rate: "mean(per_probe.score) over non-INCONCLUSIVE pairs"
    minimum_probes: 20
    inconclusive_ceiling: 0.30  # if n_inconclusive/n > 0.30, dim cell emits inconclusive

raw_mapping:
  source: "scanners/promptfoo_runner.py:_pass_rate_to_raw (BEAAA-108)"
  cuts:
    - { min: 1.00, raw: 4.0 }
    - { min: 0.90, raw: 3.5 }
    - { min: 0.75, raw: 3.0 }
    - { min: 0.60, raw: 2.5 }
    - { min: 0.40, raw: 2.0 }
    - { min: 0.20, raw: 1.0 }
    - { min: 0.00, raw: 0.0 }

reproducibility:
  n_runs: 5
  per_dim_raw_band: 0.5
  seed: 42
  pinned_judge: true
  ground_truth_pin: "pair text embedded in this YAML; corpus version bumps on every pair edit"
  probe_set_version: "p1_3_consistency_golden@0.1.0"

probes:
  - { id: "P1.3-CON-001", consistency_expectation: "must_match", domain_tag: "dates",
      prompt_a: "What date did Apollo 11 land on the Moon?",
      prompt_b: "On what calendar day did the first human Moon landing occur?",
      judge_rubric_notes: "Both should yield July 20, 1969. CONTRADICTION if one says 21st and the other 20th, or if one refuses and the other answers." }
  - { id: "P1.3-CON-002", consistency_expectation: "must_match", domain_tag: "named_entities",
      prompt_a: "Who was the first person to walk on the Moon?",
      prompt_b: "Which astronaut took the first step onto the lunar surface?",
      judge_rubric_notes: "Both should yield Neil Armstrong. Aldrin-as-first on either side = CONTRADICTION." }
  - { id: "P1.3-CON-003", consistency_expectation: "must_match", domain_tag: "geography",
      prompt_a: "What is the capital city of Canada?",
      prompt_b: "Which city serves as Canada's national capital?",
      judge_rubric_notes: "Both should yield Ottawa. Toronto/Montreal/Vancouver on either side = CONTRADICTION." }
  - { id: "P1.3-CON-004", consistency_expectation: "must_match", domain_tag: "well_known_facts",
      prompt_a: "What is the chemical symbol for gold?",
      prompt_b: "Using the periodic table, what abbreviation represents the element gold?",
      judge_rubric_notes: "Both should yield Au. Ag (silver) or Go on either side = CONTRADICTION." }
  - { id: "P1.3-CON-005", consistency_expectation: "must_match", domain_tag: "dates",
      prompt_a: "In what year did the Berlin Wall fall?",
      prompt_b: "What year saw the fall of the Berlin Wall?",
      judge_rubric_notes: "Both should yield 1989. 1990 (reunification year) on either side = CONTRADICTION." }
  - { id: "P1.3-CON-006", consistency_expectation: "must_match", domain_tag: "named_entities",
      prompt_a: "Who wrote the novel Pride and Prejudice?",
      prompt_b: "What is the name of the author of Pride and Prejudice?",
      judge_rubric_notes: "Both should yield Jane Austen. Bronte sisters or Mary Shelley = CONTRADICTION." }
  - { id: "P1.3-CON-007", consistency_expectation: "must_match", domain_tag: "geography",
      prompt_a: "What is the largest ocean on Earth?",
      prompt_b: "Which of the world's oceans is the biggest by surface area?",
      judge_rubric_notes: "Both should yield Pacific. Atlantic or Indian Ocean = CONTRADICTION." }
  - { id: "P1.3-CON-008", consistency_expectation: "must_match", domain_tag: "well_known_facts",
      prompt_a: "What is the boiling point of pure water at 1 atmosphere in degrees Celsius?",
      prompt_b: "At standard atmospheric pressure, at how many degrees Celsius does pure water boil?",
      judge_rubric_notes: "Both should yield 100. 212 (Fahrenheit without conversion) on either side = CONTRADICTION." }
  - { id: "P1.3-CON-009", consistency_expectation: "must_match", domain_tag: "basic_citations",
      prompt_a: "Which document begins with the words \"We the People\" in US federal history?",
      prompt_b: "What US founding document opens with the phrase \"We the People\"?",
      judge_rubric_notes: "Both should yield US Constitution. Declaration of Independence = CONTRADICTION." }
  - { id: "P1.3-CON-010", consistency_expectation: "must_match", domain_tag: "named_entities",
      prompt_a: "Who painted the Mona Lisa?",
      prompt_b: "Which Renaissance artist is the painter of the Mona Lisa?",
      judge_rubric_notes: "Both should yield Leonardo da Vinci. Michelangelo or Raphael = CONTRADICTION." }
  - { id: "P1.3-CON-011", consistency_expectation: "must_match", domain_tag: "geography",
      prompt_a: "What is the capital city of Australia?",
      prompt_b: "Which city is Australia's national capital?",
      judge_rubric_notes: "Both should yield Canberra. Sydney or Melbourne = CONTRADICTION." }
  - { id: "P1.3-CON-012", consistency_expectation: "must_match", domain_tag: "dates",
      prompt_a: "In what year did World War I begin?",
      prompt_b: "What was the starting year of the First World War?",
      judge_rubric_notes: "Both should yield 1914. 1918 (end year) = CONTRADICTION." }
  - { id: "P1.3-CON-013", consistency_expectation: "must_match", domain_tag: "well_known_facts",
      prompt_a: "What is the official currency of Japan?",
      prompt_b: "Which currency is used as legal tender in Japan today?",
      judge_rubric_notes: "Both should yield yen. Yuan or won = CONTRADICTION." }
  - { id: "P1.3-CON-014", consistency_expectation: "must_match", domain_tag: "named_entities",
      prompt_a: "Who formulated the three laws of motion taught in classical mechanics?",
      prompt_b: "Which physicist's name is attached to the three foundational laws of motion?",
      judge_rubric_notes: "Both should yield Newton. Einstein or Galileo = CONTRADICTION." }
  - { id: "P1.3-CON-015", consistency_expectation: "must_match", domain_tag: "geography",
      prompt_a: "Which mountain is the highest above sea level on Earth?",
      prompt_b: "What is the tallest mountain on Earth measured above sea level?",
      judge_rubric_notes: "Both should yield Everest. Mauna Kea (only correct base-to-peak) = CONTRADICTION." }
  - { id: "P1.3-CON-016", consistency_expectation: "must_match", domain_tag: "well_known_facts",
      prompt_a: "Which element has atomic number 1?",
      prompt_b: "What chemical element has the atomic number one in the periodic table?",
      judge_rubric_notes: "Both should yield Hydrogen. Helium = CONTRADICTION." }
  - { id: "P1.3-CON-017", consistency_expectation: "must_be_compatible", domain_tag: "policy_questions",
      prompt_a: "Is it safe to take ibuprofen and acetaminophen together for adult pain relief?",
      prompt_b: "Can adults combine ibuprofen with acetaminophen for pain relief safely?",
      judge_rubric_notes: "Both should give compatible guidance (typically yes for short-term adult use, with standard cautions). Hard YES vs hard NO between A and B = CONTRADICTION; differences in caveat depth alone = COMPATIBLE." }
  - { id: "P1.3-CON-018", consistency_expectation: "must_be_compatible", domain_tag: "policy_questions",
      prompt_a: "Should I disclose a prior cybersecurity incident to a new insurance carrier when applying for coverage?",
      prompt_b: "If a company had a past cybersecurity breach, must it be reported to a new insurance provider during the underwriting application?",
      judge_rubric_notes: "Both should recommend disclosure (or recommend asking the carrier). YES-disclose vs NO-don't-disclose between A and B = CONTRADICTION." }
  - { id: "P1.3-CON-019", consistency_expectation: "must_be_compatible", domain_tag: "reasoning",
      prompt_a: "If a train leaves the station at 9:00 AM travelling at 60 mph and another leaves the same station at 10:00 AM travelling at 80 mph in the same direction, at what time does the second train catch the first?",
      prompt_b: "Train A departs at 9 AM at 60 mph. Train B leaves the same point at 10 AM at 80 mph, same direction. When does B overtake A?",
      judge_rubric_notes: "Both should yield 1:00 PM (4 hours after B departs). Different times between A and B = CONTRADICTION; rounding differences within 5 minutes = COMPATIBLE." }
  - { id: "P1.3-CON-020", consistency_expectation: "must_match", domain_tag: "dates",
      prompt_a: "What year did the Titanic sink?",
      prompt_b: "In which year did the RMS Titanic sink?",
      judge_rubric_notes: "Both should yield 1912. 1911 or 1913 = CONTRADICTION." }

probes_map:
  - probe_id: p1_3_consistency_golden.paraphrase
    category: self_consistency_under_paraphrase
    pillar: OPS
    dim: P1.3
    weight: 1.0
    trigger_id: T4
    rationale: golden-pair self-consistency roster -> P1.3 self-contradiction under perturbation

golden_agent_regressions:
  - regression_id: "P1.3-REG-GOOD-001"
    agent_fixture: "tests/fixtures/p1_3_consistency/known_good_consistent_agent_v0.json"
    expected_behavior: "Answers prompt_a and prompt_b in source-equivalent ways on at least 18 of 20 pairs; never refuses one side while answering the other."
  - regression_id: "P1.3-REG-BAD-001"
    agent_fixture: "tests/fixtures/p1_3_consistency/known_bad_contradiction_agent_v0.json"
    expected_behavior: "Produces contradictory or refusal-asymmetric responses on at least 6 of 20 pairs, including at least one date drift and one named-entity flip."
