  B2B_AI_SAAS: 1.1
  RETAIL_CONSUMER: 1.25
  INDUSTRIAL: 1.35
  HEALTHCARE: 1.4
  LEGAL: 1.45
  FINSERV: 1.5
  PUBLIC_SECTOR: 1.5
revenue_bands:
- min_usd: 0
  max_usd_excl: 10000000
  factor: 0.7
  label: <$10M
- min_usd: 10000000
  max_usd_excl: 50000000
  factor: 0.85
  label: $10M-$50M
- min_usd: 50000000
  max_usd_excl: 250000000
  factor: 1.0
  label: $50M-$250M
- min_usd: 250000000
  max_usd_excl: 1000000000
  factor: 1.3
  label: $250M-$1B
- min_usd: 1000000000
  max_usd_excl: 5000000000
  factor: 1.75
  label: $1B-$5B
- min_usd: 5000000000
  max_usd_excl: null
  factor: null
  label: '>$5B (manual)'
limit_tiers:
- per_claim_usd: 500000
  aggregate_usd: 1000000
  factor: 0.6
- per_claim_usd: 1000000
  aggregate_usd: 2000000
  factor: 1.0
- per_claim_usd: 2000000
  aggregate_usd: 5000000
  factor: 1.7
- per_claim_usd: 5000000
  aggregate_usd: 10000000
  factor: 2.75
- per_claim_usd: 10000000
  aggregate_usd: 20000000
  factor: 4.2
endorsements:
  remediation:
    load_usd: 2500
    description: Remediation endorsement (Band C bind requirement)
    rescan_trigger_months: 6
    rescan_trigger_basis: "v1.1.2 (BEAAA-816): on C-band bind issuance, the bound\
      \ risk is auto-flagged\nfor a 6-month policy-period re-scan checkpoint. Process-only\
      \ at trigger \u2014\ndoes not affect pricing math at the \xA78 6-mo re-scan\
      \ output itself.\nv1.1.3 (BEAAA-934): boundary-drift sub-case codified \u2014\
      \ see\nboundary_drift_manual_referral block below. Premium impact stays $0 at\n\
      the \xA78 trigger; downstream op-seat verdict drives any premium action\nunder\
      \ policy wording v1.3 (BEAAA-186) when that locks.\n"
    rescan_trigger_authority: BEAAA-636 D1 surviving piece, ratified via Path B BEAAA-640#interaction-bbad9880;
      v1.1.3 boundary-drift routing per ADR-0016 (BEAAA-934)
    boundary_drift_manual_referral:
      authority: "ADR-0016 (BEAAA-934); HoUW BEAAA-924 cmt 16e61987 \xA74.3 Item 3\
        \ ACCEPT verdict; HoUW BEAAA-1018 cmt ce379ac1 ACCEPT-WITH-CONDITIONS countersign"
      trigger:
        applies_when: band_at_bind == 'C'
        boundary_radius_pt: 1
        boundary_centers:
        - 55
        - 70
        measurement_basis: bind_are_total
        measurement_basis_rationale: 'Boundary drift is measured against the are_total
          at original bind,

          not a rolling baseline. Rolling baseline compounds scanner-noise

          drift across re-scans; using bind_are_total anchors trigger on the

          original bind state.

          '
        reproducibility_envelope_source: "contracts/are-scanner-api-v1@v1.1.0 \xA7\
          Hard guarantees-CTO #1 (same agent + same scanner_version + same corpus_version\
          \ + same model_versions + same seed \u2192 same are_total within \xB11 point;\
          \ CI blocks any release that fails the N=5 calibration spread)"
      disposition:
        c_to_d_drift:
          condition: rescan_are_total < 54
          route: decline-routed per BEAAA-141 Surplus/Decline ladder
          delta_from_v1_1_2: "unchanged \u2014 already covered by BEAAA-141 routing\
            \ (condition narrowed from `< 55` to `< 54` on op-seat UW BEAAA-1016 R1\
            \ path A redline to remove integer-set overlap with boundary_envelope_55\
            \ at rescan_are_total == 54; substantive intent unchanged \u2014 boundary-envelope\
            \ routing wins at 54)"
        boundary_envelope_55:
          condition: 54 <= rescan_are_total <= 56
          route: manual_referral_to_op_seat_uw
          delta_from_v1_1_2: codified by ADR-0016
        interior_c:
          condition: 57 <= rescan_are_total <= 68
          route: annotate_no_referral
          delta_from_v1_1_2: codified by ADR-0016
        boundary_envelope_70:
          condition: 69 <= rescan_are_total <= 71
          route: manual_referral_to_op_seat_uw
          delta_from_v1_1_2: codified by ADR-0016
        interior_b:
          condition: rescan_are_total >= 72
          route: annotate_no_referral_op_seat_may_route_to_re_quote
          delta_from_v1_1_2: "codified by ADR-0016 (discretionary re-quote criteria\
            \ per \xA711.7 watch_line C1)"
      op_seat_decision_menu:
      - "HOLD \u2014 no action, log on policy file"
      - "ENDORSE \u2014 mid-term endorsement at op-seat-authored load"
      - "REFER_TO_HOUW \u2014 non-renewal review per escalation-matrix.md UW trigger\
        \ (two-step carry to CEO per \xA711.7 watch_line C2)"
      - "AUTHORIZE_FRESH_UW \u2014 new-business UW pathway (rare, attested material\
        \ change; must cite governance_attestations per \xA711.7 watch_line C4)"
      op_seat_sla_business_days: 5
      op_seat_sla_breach_escalation: auto-route to HoUW (queue-side flag)
      premium_impact_at_trigger_usd: 0
      premium_impact_at_disposition: op-seat verdict drives downstream action under
        live rates.yaml schedule; no auto-reprice
      referral_packet_fields:
        bind_side:
        - bind_are_total
        - bind_scanner_version
        - bind_corpus_version
        - bind_model_versions
        - bind_seed
        - bind_run_timestamp
        rescan_side:
        - rescan_are_total
        - rescan_scanner_version
        - rescan_corpus_version
        - rescan_model_versions
        - rescan_seed
        - rescan_run_timestamp
        - rescan_evidence_refs
        derived:
        - boundary_trigger
      cosign_chain:
        underwriter_op_seat: "BEAAA-1016 cmt fcd0ccd8-0b2b-4462-b608-1173ee94841a\
          \ \u2014 ACCEPT-WITH-REDLINES (R1 path A applied this merge; R2 \xA711/\xA7\
          11.6 explicit non-reversal claims applied \xA711.7 below)"
        actuary: BEAAA-934 ADR-0016 (Actuary draft 2026-05-29; on-issue document adr-0016-section-8-boundary-drift-manual-referral)
        head_of_uw: "BEAAA-1018 cmt ce379ac1-494b-42f4-8fbd-e559f7695f7c \u2014 ACCEPT-WITH-CONDITIONS\
          \ (C1-C4 folded into \xA711.7 watch_lines below)"
        founder_ratification: "n/a \u2014 re-scan disposition class per actuary-os.md\
          \ \xA7DECISION AUTHORITY; HoUW countersign is terminal"
