# Op-seat-derived full-rates wrapper for Actuary candidate v1.1-draft live_probe block.
# Source: artifacts/beaaa-617/synthetic_v2_k10/candidate_v1_1_draft_live_probe.yaml (Actuary, 2026-06-02).
# Derivation: deployed pricing/rates.yaml v1.1.3 base + Actuary's candidate live_probe block
#             translated into the deployed live_probe schema shape.
# Top-level `version` preserved at 1.1.3: candidate is a live_probe-block overlay only;
# non-live_probe fields inherit verbatim. live_probe.policy_version carries the candidate-r1 marker.
# This preserves the offline_replay byte-identity invariant — quote.pricing_version
# matches the deployed baseline by construction, so D5 hashes can compare cleanly.
# Schema translation map:
#   candidate.live_probe.loading_curve (list)  -> live_probe.loading_curve.breakpoints (list)
#   candidate.live_probe.cap                   -> live_probe.loading_curve.cap
#   candidate.live_probe.aggregation           -> live_probe.loading_curve.aggregation
#   candidate.live_probe.refuse_thresholds.P{1..3}=X -> live_probe.refuse_to_quote_per_dim.critical_threshold=X
#   candidate.live_probe.refuse_thresholds.P4=Y  -> live_probe.refuse_to_quote_per_dim.hygiene_threshold=Y
#   candidate.live_probe.k_replicate_policy    -> live_probe.k_replicate_selection
# Asserted-invariant: candidate refuse_thresholds.P1==P2==P3 (Actuary HOLD-byte-identical claim).
# BandFactor: inherits deployed v1.1.3 (C=2.50, D=5.00) per Actuary substrate-caveat scope.
# Filed by op-seat for BEAAA-2058 D4 + D5-candidate re-fire only; not for §11.7 audit-block merge.
version: 1.1.3
frozen_at: '2026-04-30'
amended_at: '2026-05-29'
base_rate_usd: 25000
aggregate: 1.1
band_factor:
